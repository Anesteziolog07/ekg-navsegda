<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Мини-приложения</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="../icon-192.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{var t=localStorage.getItem("ekg-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}catch(e){}</script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#161a23;--mu:#667085;--bd:#e4e7ee;--acc:#e5484d;--acc2:#cf2f42;--sh:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
:root[data-theme=dark]{--bg:#0f141c;--card:#171e29;--tx:#eef1f6;--mu:#97a1b3;--bd:#263041;--sh:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
.w{max-width:560px;margin:0 auto}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px;letter-spacing:-.01em}
.sub{color:var(--mu);margin:0 0 22px}
.app{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:14px;margin:0 0 12px;text-decoration:none;color:inherit;box-shadow:var(--sh);transition:transform .12s}
.app:active{transform:scale(.98)}
.ic{flex:none;width:64px;height:64px;border-radius:16px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center}
.ic img{width:64px;height:64px;border-radius:16px;display:block}
.app b{display:block;font-size:18px}
.app small{display:block;color:var(--mu);font-size:14px;margin-top:2px}
.go{margin-left:auto;color:var(--mu);font-size:22px}
.soon{border:1.5px dashed var(--bd);border-radius:20px;padding:18px 16px;color:var(--mu);text-align:center;font-size:15px}
</style></head><body>
<div class="w">
 <h1>Мини-приложения</h1>
 <p class="sub">Выбери, что открыть</p>
 <a class="app" id="ekg" href="../">
  <span class="ic"><img src="../icon-192.png" alt="" width="64" height="64"></span>
  <span><b>ЭКГ — это просто</b><small>Бесплатный курс: теория, тренажёр, игры, настоящие записи</small></span>
  <span class="go">›</span>
 </a>
 <div class="soon">Здесь появятся новые приложения</div>
</div>
<script>
(function(){
 var W=window.Telegram&&window.Telegram.WebApp;
 document.getElementById('ekg').addEventListener('click',function(){try{sessionStorage.setItem('tg-from-hub','1')}catch(e){}});
 if(!W||!W.initData)return;
 function sf(f){try{return f()}catch(e){}}
 sf(function(){W.ready()});sf(function(){W.expand()});sf(function(){W.disableVerticalSwipes()});
 function theme(){var t;try{t=localStorage.getItem('ekg-theme')}catch(e){}t=t||W.colorScheme||'light';document.documentElement.dataset.theme=t;
  var c=t==='dark'?'#0f141c':'#f6f7fb';sf(function(){W.setHeaderColor(c)});sf(function(){W.setBackgroundColor(c)});sf(function(){W.setBottomBarColor(c)})}
 theme();W.onEvent('themeChanged',theme);
 sf(function(){W.BackButton.hide()});
})();
</script>
</body></html>
