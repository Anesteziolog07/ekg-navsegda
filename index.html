const SH={'Сокращения':[['СА-узел','Синоатриальный узел'],['АВ-узел','Атриовентрикулярный узел'],['ЧСС','Частота сердечных сокращений, ударов в минуту'],['ЖТ','Желудочковая тахикардия'],['ФП','Фибрилляция предсердий'],['ФЖ','Фибрилляция желудочков'],['ГЛЖ, ГПЖ','Гипертрофия левого и правого желудочка'],['QTc','Интервал QT с поправкой на ЧСС'],['ТЭЛА','Тромбоэмболия лёгочной артерии'],['ВЧД','Внутричерепное давление']],'Лента':[['Паспорт ленты','25 мм/с, 10 мм/мВ, 12 отведений'],['Клетки при 25 мм/с','малая 0,04 с, большая 0,2 с'],['ЧСС в минуту','1500 / R-R в мм при 25 мм/с; 3000 / R-R в мм при 50 мм/с'],['ЧСС по большим клеткам','300 / число клеток: 300, 150, 100, 75, 60, 50 в минуту'],['Алгоритм','РЫЧАГ на ОСИ, потом P, QRS, ST, T, интервалы'],['Ось по высоте R','норма II > I > III, влево I > II > III, вправо III > II > I']],'Нормы':[['P','до 0,10 с, до 2,5 мм'],['QRS','до 0,10 с, широкий от 0,12 с'],['PQ','0,12–0,20 с'],['QTc','примерно до 0,45 с, выше 0,50 с опасно'],['Q','меньше ¼ R'],['ST','на изолинии, до 0,5 мм вниз в V5–V6, до 2 мм вверх в V1–V2']],'Ритмы':[['Ранний узкий, P другой','Предсердная экстрасистола'],['Ранний узкий, P нет','Экстрасистола из АВ-узла'],['Ранний широкий, P нет','Желудочковая экстрасистола'],['Пила','Трепетание предсердий'],['Нет P, R-R разные','Фибрилляция предсердий'],['Широкие, ровные, частые','Желудочковая тахикардия, пока не доказано другое'],['Вьются вокруг линии','Пируэт']],'Блокады':[['Выпал цикл с P','СА-блокада'],['PQ больше 0,2 с','АВ-блокада I степени'],['PQ растёт, QRS выпал','Мобитц 1'],['PQ ровный, QRS выпал','Мобитц 2'],['P и QRS отдельно','АВ-блокада III степени'],['М в V1','Правая ножка'],['М в V5–V6','Левая ножка'],['Короткий PQ, дельта','WPW']],'Инфаркт':[['T / ST / Q','Ишемия / повреждение / некроз'],['V1–V3','Переднеперегородочный'],['V3–V4','Передневерхушечный'],['I, aVL, V5, V6','Переднебоковой'],['II, III, aVF','Нижний'],['Порог подъёма ST','от 1 мм; в V2–V3: мужчины до 40 лет 2,5 мм, от 40 лет 2 мм, женщины 1,5 мм']],'Другое':[['P пик','Правое предсердие'],['P двугорбый','Левое предсердие'],['S в V1 + R в V5 или V6 ≥ 35 мм','Гипертрофия левого желудочка'],['Острый узкий T, широкий QRS','Подумай о гиперкалиемии'],['Плоский T, зубец U','Подумай о гипокалиемии'],['ST везде, вогнутый','Перикардит']]};
function vSh(v){const k=Object.keys(SH);v.innerHTML=`<div class="view"><div class="pt"><h1>Шпаргалка</h1></div><div class="tabs" id="st">${k.map(x=>`<button>${x}</button>`).join('')}</div><div class="card" id="sb"></div></div>`;const set=i=>{[...$('st').children].forEach((b,j)=>b.classList.toggle('on',j===i));$('sb').innerHTML=`<table>${SH[k[i]].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`};[...$('st').children].forEach((b,i)=>b.onclick=()=>set(i));set(k.indexOf('Лента'))}
function vAb(v){v.innerHTML=`<div class="view"><div class="pt"><h1>О курсе</h1><p>Для студентов, медсестёр, фельдшеров и молодых врачей.</p></div><div class="wrn">${ic('warn')}<p>Сайт не ставит диагнозов и не заменяет врача. Цифры сверяй с действующими рекомендациями и протоколами. Если есть боль в груди, одышка, обморок или другие тревожные симптомы, вызывай скорую помощь.</p></div><div class="card"><details open><summary>Честные правила</summary><ul><li>Очки дают только за знания, случайных наград нет.</li><li>Нет рекламы и покупок.</li><li>Пропущенный день ничего не сжигает.</li><li>Регистрации нет, прогресс хранится только в этом браузере.</li></ul></details><details><summary>Где источники расходятся</summary><ul><li>Норма ЧСС: 60–90 в минуту в российских учебниках, 60–100 в минуту чаще за рубежом.</li><li>Нормальная ось: от +30° до +69° или вся зона от −30° до +90°.</li><li>Граница QTc: около 0,45 с у мужчин, 0,46–0,47 с у женщин.</li><li>Сроки стадий инфаркта различаются, здесь даны ориентиры.</li><li>Частоты аритмий — учебные ориентиры.</li></ul></details><details><summary>Чего здесь нет</summary><ul><li>Лечения и доз препаратов.</li><li>Детской ЭКГ, ритмов кардиостимулятора, синдрома Бругада.</li><li>Критериев инфаркта на фоне блокады левой ножки.</li></ul></details><details><summary>Проверочные материалы</summary><ul><li><a href="https://litfl.com/ecg-criteria-for-left-ventricular-hypertrophy/">LITFL, критерии ГЛЖ</a></li><li><a href="https://en.ecgpedia.org/wiki/Rvh">ECGpedia, ГПЖ</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/30165617/">Четвёртое универсальное определение ИМ</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9075358">Обзор критериев подъёма ST</a></li></ul></details><details><summary>Картинки</summary><ul><li>Microsoft Fluent Emoji, лицензия MIT. Текст лицензии лежит в папке img.</li></ul></details></div><div class="rowb" id="rs" style="max-width:420px"><button class="btn" id="rz">Сбросить мой прогресс</button></div></div>`;$('rz').onclick=()=>{$('rs').innerHTML='<button class="btn" id="ry">Да, стереть всё</button><button class="btn" id="rn">Отмена</button>';$('rn').onclick=()=>vAb(v);$('ry').onclick=()=>{S=S0();save();location.hash='';location.reload()}}}
