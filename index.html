const MORE={
'Путь импульса':'Проводящая система — это специальные клетки, которые не столько сокращаются, сколько проводят сигнал. По ним импульс бежит в несколько раз быстрее, чем по обычной мышце. Благодаря этому весь желудочек возбуждается почти одновременно и выбрасывает кровь одним мощным толчком. Если импульс идёт мимо этих путей, сокращение становится растянутым, а комплекс на ленте широким.',
'Почему задаёт ритм СА-узел':'Способность клетки самой создавать импульс называется автоматизмом. Клетки-пейсмекеры постепенно деполяризуются в покое, и когда потенциал доходит до порога, рождается импульс. В СА-узле это происходит быстрее всего. Импульс приходит к нижним очагам раньше, чем они успевают разрядиться сами, и сбрасывает их. Если верхний источник молчит, нижний дорабатывает до порога и берёт ритм на себя.',
'АВ-узел: зачем нужна задержка':'АВ-узел проводит медленно, потому что в нём мало быстрых ионных каналов и плотность контактов между клетками ниже. Эта пауза нужна механически: предсердия успевают сократиться и дозаполнить желудочки. Заодно узел работает как фильтр: при очень частых импульсах он пропускает только часть, и это защищает желудочки при трепетании и фибрилляции предсердий.',
'Пучок Гиса и ножки':'Пучок Гиса проходит через фиброзное кольцо и перегородку. Левая ножка почти сразу делится на переднюю и заднюю ветви, потому что левый желудочек больше. Передняя ветвь тонкая и имеет одно кровоснабжение, поэтому страдает чаще. Задняя толще и получает кровь из двух источников. Правая ножка длинная и тонкая, поэтому тоже легко повреждается.',
'Электроды на конечности':'Чёрный электрод на правой ноге не записывает сигнал, он нужен как заземление и снижает помехи. Если перепутать провода на руках, в I отведении всё перевернётся, а aVR станет похож на норму. Это частая ошибка, поэтому странную ось всегда проверяй с этой мысли. На качество записи точное место на конечности влияет мало.',
'Главное правило ЭКГ':'Возбуждённая часть миокарда снаружи заряжена отрицательно, невозбуждённая положительно. Граница между ними движется, как волна, и у этой волны есть направление. Отведение измеряет разность потенциалов, поэтому показывает проекцию этой волны на свою ось. Отсюда простое следствие: вектор вдоль оси даёт высокий зубец, вектор поперёк оси даёт почти ноль.',
'Зубец P: два предсердия':'Импульс выходит из СА-узла в правом предсердии, поэтому оно возбуждается раньше. По межпредсердному пучку Бахмана волна уходит в левое предсердие. Волны перекрываются и сливаются в один пологий зубец. Предсердия тонкие, поэтому P маленький, обычно не выше 2,5 мм.',
'QRS: слово ПоВОрот':'Перегородка возбуждается первой, слева направо, поэтому в левых отведениях часто виден маленький q. Потом волна проходит массу желудочков от эндокарда к эпикарду. Это даёт большой R. Последними возбуждаются базальные отделы, что рисует S. Весь процесс занимает меньше 0,1 с, потому что волна бежит по волокнам Пуркинье.',
'ST и T: уборка':'В сегмент ST почти все клетки желудочков находятся в одинаковой фазе плато, разницы потенциалов нет, поэтому линия ровная. Реполяризация идёт в обратном порядке, от эпикарда к эндокарду, поэтому T обычно смотрит в ту же сторону, что и QRS, хотя процесс противоположный.',
'Интервал или сегмент':'Интервал PQ показывает всё время от начала возбуждения предсердий до начала возбуждения желудочков. Если он длиннее 0,2 с, задержка выросла. Если короче 0,12 с, импульс нашёл обходной путь. Сегмент ST ценен другим: мы оцениваем не длину, а положение относительно изолинии.',
'Смотри в клетки, а не в секунды':'При 25 мм/с за секунду протягивается 25 мм ленты, то есть пять больших клеток. Поэтому большая равна 0,2 с, а малая 0,04 с. При 50 мм/с всё вдвое шире: большая клетка уже 0,1 с. Вольтаж стандартно 10 мм на 1 мВ, значит малая клетка по высоте равна 0,1 мВ.',
'Сначала паспорт ленты':'Калибровочная метка — это импульс 1 мВ, который аппарат подаёт в начале записи. При стандартной настройке его высота 10 мм. Если вольтаж снижен вдвое, все зубцы кажутся маленькими, и можно ошибочно увидеть низкий вольтаж или пропустить гипертрофию. Поэтому сначала проверяем инструмент, а потом делаем выводы.',
'РЫЧАГ на ОСИ':'Порядок не случаен. Ритм и частота сразу говорят, срочная ли ситуация. Ось подсказывает, где искать проблему. Проход по зубцам ловит остальное. Пропущенный шаг обычно и даёт ошибку: например, можно увидеть подъём ST и не заметить, что это широкий ритм, при котором ST читается иначе.',
'ЧСС за три секунды':'Метод работает, потому что при 25 мм/с в минуте 300 больших клеток. Если между R одна клетка, ЧСС 300, если две, то 150, и так далее. При неправильном ритме метод не работает: посчитай комплексы за 6 секунд, это 30 больших клеток, и умножь на 10.',
'Синусовый ли ритм':'Импульс из СА-узла идёт сверху вниз и справа налево, поэтому смотрит на II отведение и от aVR. Если P положительный во II и отрицательный в aVR, источник наверху справа. Если P перевёрнут во II, импульс идёт снизу вверх, то есть источник ниже. Частота при этом ничего не доказывает.',
'Две команды отведений':'Отведения рядом смотрят на сердце с похожих сторон, поэтому изменения в них совпадают. Если признак есть только в одном отведении, это чаще артефакт или случайность. Если в двух соседних одной группы, это настоящая находка. Отсюда правило «два соседних отведения» в критериях инфаркта.',
'Ось за секунду':'Точный способ: найди отведение, где QRS почти равен нулю. Ось идёт перпендикулярно ему. Простой способ: смотри на I и aVF. Оба положительные значит ось нормальная. Если сумма зубцов в одном отведении положительна, вектор направлен в его сторону. Отклонение оси само по себе не диагноз, а подсказка.',
'Прогулка по комплексу':'На каждом шаге задавай один вопрос. P: откуда идёт импульс. QRS: узкий или широкий, нет ли патологического Q. ST: на линии ли. T: совпадает ли с QRS. Интервалы: не удлинён ли PQ, не длинный ли QT. Такой чек-лист работает как в авиации: он защищает от усталости.',
'Холм в грудных отведениях':'В V1 электрод смотрит на правый желудочек и перегородку, поэтому там мал R и глубок S. По мере движения к V6 электрод всё больше видит левый желудочек, R растёт, а S уменьшается. Точка, где R равен S, называется переходной зоной, обычно V3–V4. Смещение зоны подсказывает поворот сердца, рубец или гипертрофию.',
'Синусовые аритмии':'Синусовый узел слушает вегетативную нервную систему. Симпатика ускоряет, вагус замедляет. На вдохе тонус вагуса падает и ЧСС немного растёт, на выдохе наоборот. Отсюда дыхательная аритмия. Выраженная она у молодых, с возрастом уменьшается. Причину синусовой тахикардии всегда ищут в пациенте, а не в сердце.',
'Экстрасистола':'Эктопический очаг выдаёт импульс раньше очередного синусового. Если импульс родился выше разветвления пучка Гиса, он входит в желудочки по обычным путям. Если внутри желудочка, идёт от клетки к клетке, это в несколько раз медленнее. Отсюда главное правило ширины QRS.',
'Посмотри на всех троих':'После предсердной экстрасистолы пауза обычно неполная: импульс успевает сбить ритм СА-узла. После желудочковой пауза полная: узел продолжает свой ритм, но очередной импульс приходит в рефрактерные желудочки. Иногда предсердная экстрасистола проводится с аберрацией и даёт широкий QRS, тогда помогает ранний P.',
'Где очаг в предсердии':'Работает тот же принцип вектора. Смотрим на II отведение: положительный полюс внизу слева. Очаг вверху отправляет волну к нему, очаг внизу от него. Значит, отрицательный P в обычном цикле говорит о нижнепредсердном или узловом источнике.',
'Как они ходят':'Бигеминия важна практически: половина комплексов может давать слабый выброс, и пульс на запястье окажется вдвое реже, чем на мониторе. Три и более желудочковых комплекса подряд уже считают пробежкой ЖТ. Политопные экстрасистолы говорят о нескольких очагах и более выраженном поражении.',
'Три вопроса к любой тахикардии':'Узкий QRS почти всегда значит, что импульс прошёл через систему Гиса–Пуркинье. Широкий бывает при ЖТ, при наджелудочковой тахикардии с блокадой ножки и при предвозбуждении. Широкая регулярная тахикардия у больного с инфарктом в анамнезе почти всегда ЖТ. Ошибка в сторону ЖТ безопаснее обратной.',
'Узкие тахикардии':'При трепетании частота волн обычно около 300, и АВ-узел часто пропускает каждую вторую, поэтому ЧСС близка к 150. Волны лучше видны во II, III, aVF и V1. Фибрилляцию отличают по абсолютной неправильности R-R. Если R-R при «фибрилляции» вдруг ровные и редкие, подумай о полной АВ-блокаде на её фоне.',
'Широкие: тут счёт на минуты':'ЖТ бывает мономорфной, когда все комплексы одинаковые, и полиморфной. Трепетание и фибрилляция желудочков обычно не дают эффективного выброса. Первый шаг всегда один: проверь пациента и пульс. Если на мониторе хаос, а человек разговаривает, это артефакт.',
'Степени всегда одни и те же':'Степень описывает, сколько импульсов теряется, а не насколько плохо пациенту. Чувствует себя человек по частоте желудочков и уровню блока. Поэтому блокада II степени с высоким блоком бывает опаснее, чем III степень с устойчивым узким ритмом.',
'Главное отличие':'Зубец P — первое, что видно на ленте. Если он есть, импульс вышел из СА-узла и прошёл предсердия. Значит, проблема ниже. Если его нет там, где он должен быть, импульс не вышел или не дошёл до предсердий. Поэтому в паузе всегда ищи P, в том числе спрятанный на T.',
'АВ-блокады':'Мобитц 1 называют периодикой Самойлова–Венкебаха. Прирост PQ самый большой между первым и вторым комплексом, поэтому R-R могут укорачиваться перед паузой. При Мобитц 2 нарушение обычно ниже АВ-узла, а QRS нередко широкий. АВ-блокаду I степени часто находят случайно у спортсменов, она обычно безобидна.',
'Если выпал каждый второй':'Запись 2 : 1 значит два зубца P на один QRS. Чтобы определить тип, нужны как минимум два проведённых подряд комплекса. Подсказка: узкий QRS чаще говорит об уровне АВ-узла, широкий о более низком уровне.',
'СА-блокады':'СА-блокады видны только косвенно, потому что импульс из узла на ленте не записывается. Паузу кратную R-R трудно объяснить чем-то другим, кроме выпавшего импульса. Если пауза не кратна, подумай об остановке синусового узла: она похожа, но арифметика не сходится.',
'Если СА-узел молчит':'Выскальзывающий комплекс — это защита. Нижний очаг ждёт и срабатывает, когда сверху ничего нет. Поэтому такой комплекс приходит поздно, а не рано, и это главное отличие от экстрасистолы. Подавлять его нельзя: это последняя страховка.',
'Почему QRS становится широким':'При блокаде ножки импульс сначала идёт по здоровой стороне. На другую сторону он попадает через мышцу перегородки, а это в разы медленнее. Поэтому конец QRS рисует запоздалый желудочек, и направление этого конца показывает, какая сторона опоздала.',
'Буква М живёт там, где блокада':'В V1 при блокаде правой ножки сначала идёт обычный маленький r от перегородки, потом S от левого желудочка, потом большой R′ от запоздавшего правого. При блокаде левой ножки перегородка возбуждается наоборот, поэтому в V5–V6 пропадает q, а R становится широким и зазубренным.',
'Поворотник в V1':'Это упрощение правила направления: поздний вектор идёт к запоздавшему желудочку. Правый желудочек лежит ближе к V1, поэтому при блокаде правой ножки конец QRS в V1 положительный. Левый лежит дальше, поэтому при блокаде левой ножки конец QRS отрицательный.',
'Полная или неполная':'Границу в 0,12 с используют почти все рекомендации. Неполная блокада правой ножки встречается и у здоровых молодых людей. Новая блокада левой ножки всегда требует внимания: важно понять, не связана ли она с острым событием. Старая плёнка здесь ценнее любого критерия.',
'Ветви левой ножки':'Передняя ветвь идёт вверх и вперёд. Если она заблокирована, верхне-боковая часть левого желудочка возбуждается последней, и вектор уходит вверх и влево. Поэтому ось резко влево. При блокаде задней ветви ось уходит вправо, но сначала исключают гипертрофию правого желудочка.',
'Перекачанная мышца':'Гипертрофия увеличивает массу, а значит и вектор. Кровоснабжение не успевает, поэтому внутренние слои страдают от недостатка кислорода. Отсюда изменения ST и T в сторону, противоположную QRS. Эту картину называют систолической перегрузкой, или strain.',
'Предсердия: пик или верблюд':'В V1 зубец P двухфазный: первая часть от правого предсердия, вторая от левого. Глубокая широкая отрицательная фаза говорит о левом предсердии, высокая положительная о правом. Поэтому при подозрении всегда смотри V1 вместе со II.',
'Левый желудочек':'У индекса Соколова–Лайона высокая специфичность и низкая чувствительность: если он положительный, гипертрофия вероятна, но при отрицательном она всё равно может быть. Есть и другие критерии, например Корнельский. Они считают иначе, и ни один не заменяет эхокардиографию.',
'Правый желудочек':'В норме в V1 зубец S больше R. Если R стал больше S, это повод подумать о гипертрофии правого желудочка, задней стенке, блокаде правой ножки или WPW. Признаки вместе с отклонением оси вправо и P pulmonale делают вывод надёжнее.',
'Два правила вместо девяти рисунков':'Правило про ST следует из тока повреждения: повреждённая зона заряжена иначе, чем здоровая, и ток идёт к ней, поэтому вектор ST направлен в зону поражения. Правило про T следует из того, что ишемия удлиняет реполяризацию и меняет её направление. Запомнив только это, ты выведешь все рисунки сам.',
'Ишемия меняет T':'Высокий острый T бывает в первые минуты инфаркта и называется сверхострым. Он легко пропускается, поэтому при боли ЭКГ повторяют. Отрицательный симметричный T называют коронарным. Изменения T малоспецифичны и всегда требуют сравнения с клиникой.',
'Повреждение меняет ST':'Смотрят смещение относительно изолинии в точке J, в месте, где заканчивается S. Подъём важен как знак полной окклюзии. Депрессия чаще означает субэндокардиальную ишемию или зеркало подъёма на другой стенке. Форма тоже важна: выпуклый подъём подозрительнее вогнутого.',
'Некроз меняет Q':'Мёртвая ткань не создаёт потенциалов. Электрод над ней словно смотрит в окно и видит движение волны на противоположной стенке, которая уходит от него. Отсюда отрицательный зубец Q. Q появляется не сразу: иногда через часы. Узкий маленький q в I, aVL, V5, V6 бывает нормой.',
'Цифры и ловушки':'Пороги подъёма ST взяты из универсального определения инфаркта. Они различаются для V2–V3, потому что там ST у здоровых людей выше. Отсутствие подъёма не исключает окклюзию: бывает задний инфаркт, поэтому при боли смотрят тропонин, повторяют ЭКГ и сравнивают с прошлой.',
'Пол, стена, фасад':'Нижнюю стенку чаще питает правая коронарная артерия, переднюю и перегородку — передняя нисходящая, боковую — огибающая или диагональные ветви. При нижнем инфаркте проверяют правый желудочек: от этого зависит тактика.',
'Зеркало':'Реципрокные изменения подтверждают, что подъём ST настоящий, а не вариант нормы. Лучший пример: подъём в III и депрессия в aVL. Эта пара возникает рано, иногда раньше, чем подъём достигает порога.',
'Смотри все двенадцать':'Задний инфаркт не даёт подъёма в обычных отведениях. Подсказка: депрессия ST в V1–V3 с высоким R и положительным T. Подтверждают отведениями V7–V9. Правый желудочек смотрят в V3R–V4R, особенно при нижнем инфаркте.',
'Обходной путь':'Дополнительные пути формируются ещё внутриутробно. Они не обладают задержкой АВ-узла. Сейчас диагноз LGL считают спорным: у части людей короткий PQ просто вариант нормы и быстрое проведение через АВ-узел.',
'Посмотри разницу':'Дельта-волна может быть положительной или отрицательной и иногда похожа на патологический Q. Степень предвозбуждения непостоянна: зависит от того, какой путь сработал быстрее. Поэтому на разных плёнках картина у одного человека может выглядеть по-разному.',
'Откуда берётся дельта':'Импульс через пучок Кента приходит в желудочек раньше, но дальше ему приходится ползти по обычной мышце, поэтому подъём пологий. Через АВ-узел он приходит позже, зато быстро разбегается по Пуркинье и дорисовывает QRS. Такой комплекс называют сливным.',
'Почему это важно':'Чаще всего импульс идёт вниз через АВ-узел и возвращается вверх через дополнительный путь, это ортодромная тахикардия с узким QRS. При фибрилляции предсердий импульсы могут идти к желудочкам через пучок без фильтра. Частота тогда очень высокая, QRS широкие и разные, и это опасно.',
'Высокий калий: лестница':'Рост калия сначала ускоряет реполяризацию, поэтому T становится острым. Затем клетки хуже проводят: уплощается P, удлиняется PQ, расширяется QRS. Лента не всегда идёт по ступеням и может сразу дойти до опасной стадии, поэтому при подозрении ждать анализа не стоит, а тактику сверяют с протоколом.',
'Палатка или ишемия':'При гиперкалиемии изменения обычно диффузные, во многих отведениях. При ишемии они ограничены зоной артерии. Широкий QRS с брадикардией у пациента с почечной недостаточностью — повод сначала думать о калии, а уже потом о других причинах.',
'Низкий калий':'При снижении калия реполяризация удлиняется. Зубец U становится заметным и может слиться с T, поэтому QT кажется длинным. Часто рядом снижен магний, и без его коррекции калий восполняется плохо.',
'Длинный QT':'QT измеряют от начала QRS до конца T, обычно во II или V5. Если ритм неправильный, берут среднее из нескольких циклов. При широком QRS QT удлинён и без проблем с реполяризацией, это нужно учитывать.',
'Пируэт':'Запускается ранней постдеполяризацией на фоне длинного QT, особенно после паузы. Часто начинается с феномена короткий-длинный-короткий цикл. Эпизоды бывают короткими, но могут перейти в ФЖ.',
'Перикардит или инфаркт':'Воспаление затрагивает эпикард почти всего сердца, поэтому подъём ST широкий и вогнутый. Снижение PQ связано с поражением предсердий. В aVR наоборот: PQ приподнят, ST опущен. Позже ST возвращается, а T может стать отрицательной, но обычно не раньше этого.',
'ТЭЛА':'Острая нагрузка на правый желудочек вызывает перегрузку и задержку проведения. Отсюда признаки правых отделов. Эти находки неспецифичны, поэтому ЭКГ помогает заподозрить, но не подтвердить ТЭЛА.'};
/* разбор ответов: развёрнутое объяснение */
const WHYQ={
'Какой цвет на левой ноге?':'Иди от правой руки по часовой стрелке: правая рука, левая рука, левая нога, правая нога. Цвета идут как на светофоре сверху вниз, а чёрный — корпус.',
'Где стоит V4?':'Найди угол Людовика, под ним второе ребро, отсчитай вниз до 5-го межреберья и веди к среднеключичной линии. От этой точки считают всё остальное.',
'Что рисует сегмент PQ?':'В это время импульс идёт через АВ-узел и пучок Гиса. Эти структуры слишком малы, чтобы дать видимый сигнал на коже.',
'СА-узел замолчал. Кто возьмёт ритм первым при здоровой системе?':'Чем ниже очаг, тем реже его собственная частота. АВ-соединение обычно даёт 40–60 ударов и узкий QRS.',
'Какие участки поражаются чаще всего?':'Правая ножка длинная и тонкая. Передняя ветвь левой ножки тонкая и зависит от одного источника кровоснабжения. Задняя получает кровь из двух бассейнов.',
'Что отражает подъём зубца P?':'Импульс рождается в правом предсердии, поэтому оно начинает возбуждаться первым и формирует начало зубца.',
'Что отражает зубец Q?':'Импульс идёт по пучку Гиса и разворачивается в перегородке, поэтому первый вектор направлен от большинства левых отведений.',
'PQ занимает 6 малых клеток при 25 мм/с. Что это значит?':'Норма до 5 клеток. Шесть значит лишнюю задержку в АВ-узле. Это АВ-блокада I степени.',
'Что входит в интервал QT?':'QT начинается с QRS и заканчивается концом T. Это вся электрическая систола желудочков, поэтому он важен при препаратах и электролитных нарушениях.',
'Что значит сегмент ST на изолинии?':'В это время все клетки желудочков находятся на плато потенциала действия, поэтому разности потенциалов почти нет.',
'Что проверить до анализа зубцов?':'Если скорость 50 мм/с, все длительности покажутся вдвое больше. Если вольтаж снижен, зубцы покажутся низкими. Поэтому сначала проверяем инструмент.',
'R-R 30 мм при 25 мм/с. Какая ЧСС?':'Делим 1500 на 30 и получаем 50. Это брадикардия.',
'R-R 30 мм при 50 мм/с. Какая ЧСС?':'При скорости 50 мм/с лента идёт вдвое быстрее, поэтому делим 3000 на 30.',
'Какие отведения смотрят на боковую стенку?':'I и aVL смотрят на верхне-боковую часть, V5 и V6 на нижне-боковую. Вместе это левая команда.',
'Что обязательно для синусового ритма?':'Частота может быть любой. Важен источник: P положительный во II, отрицательный в aVR, стоит перед каждым QRS и одной формы.',
'R в V1–V4 не растёт, вершина холма исчезла. О чём подумать?':'Плохая прогрессия R бывает при рубце передней стенки и при неверно поставленных электродах. Проверка электродов занимает секунду, поэтому начинай с неё.',
'Что общего у всех экстрасистол?':'Экстрасистола приходит раньше очередного синусового импульса. Отсюда короткий R-R перед ней, а форма P и QRS зависит от места очага.',
'Ранний узкий QRS без зубца P. Откуда?':'Импульс родился в АВ-узле и сразу пошёл вниз обычным путём, поэтому QRS узкий. Предсердия возбудились почти одновременно, поэтому P скрыт.',
'Частота 110, P перед каждым QRS, форма обычная. Что это?':'Источник на месте, просто чаще. Ищи причину в пациенте: боль, лихорадка, анемия, гиповолемия.',
'R-R плавно меняются вместе с дыханием, остальное в норме. Что это?':'На вдохе тонус вагуса падает и ЧСС растёт, на выдохе наоборот. Это вариант нормы, особенно у молодых.',
'Какие условия нужны для re-entry?':'Нужны два пути с разной скоростью и разным рефрактерным периодом. Тогда внеочередной импульс может пойти по кругу.',
'Узко, ровно, 190 в минуту, P не виден. Что это?':'QRS узкий значит импульс прошёл обычным путём. Ровный ритм и невидимый P типичны для тахикардии из АВ-соединения. Вместе с предсердной её называют наджелудочковой.',
'Можно ли по одной ленте отличить постоянную форму от пароксизмальной?':'Лента показывает один момент, а форма аритмии определяется течением: как часто, сколько длилось, проходит ли само.',
'Какая блокада опаснее?':'Мобитц 2 обычно лежит ниже АВ-узла, поэтому нижний водитель ненадёжен, и блокада может внезапно стать полной.',
'Почему СА-блокаду I степени нельзя увидеть?':'Первое, что видит ЭКГ, это возбуждение предсердий. Задержка внутри и сразу за СА-узлом до появления P не записывается.',
'Каждый второй P без QRS. Какой тип блокады?':'Чтобы отличить типы, надо сравнить PQ двух подряд проведённых комплексов. При 2 : 1 таких пар нет.',
'Что значит QRS 0,11 с с формой rsR′ в V1?':'Форма rsR′ показывает правую сторону, а ширина 0,10–0,12 с говорит, что блокада неполная.',
'Почему при блокаде ветви QRS почти не расширен?':'Ветви соединены сетью анастомозов. Импульс быстро обходит препятствие, поэтому меняется в основном направление, а не длительность.',
'Какая комбинация блокад самая частая?':'Это два самых ранимых участка проводящей системы. Сочетание называют двухпучковой блокадой.',
'ST вниз и T минус в V5–V6 при полной блокаде левой ножки. Что это?':'Когда возбуждение идёт необычным путём, реполяризация тоже меняется. Это вторичные изменения, но инфаркт на их фоне не исключён.',
'Какие признаки общие для гипертрофий?':'Больше мышцы значит сильнее вектор и выше зубцы. Сосуды отстают, поэтому внутренние слои голодают и меняются ST и T. Проводящие пути страдают, поэтому комплекс шире. Ось тянется к большей массе.',
'Почему при гипертрофии бывает депрессия ST?':'Кровь идёт в стенку снаружи внутрь. Когда стенка становится толще, а сосуды не успевают за ней, внутренний, субэндокардиальный слой получает меньше кислорода. Там возникает ишемия, и ST уходит вниз.',
'Почему ГПЖ видна поздно?':'Вектор левого желудочка намного больше. Пока правый желудочек не перевесит его, на ЭКГ его почти не видно.',
'Что такое P mitrale?':'Левое предсердие даёт конец P. Если оно увеличено, возбуждение затягивается, и зубец становится широким и двугорбым. Часто бывает при митральных пороках.',
'R V6 > R V5 > R V4. О чём это говорит?':'В норме самый высокий R стоит в V4. Если вершина сместилась к V6, значит левый желудочек стал мощнее и вектор сильнее тянется влево. Это один из признаков ГЛЖ.',
'Какая зона меняет только реполяризацию?':'Клетки при ишемии живые и возбуждаются нормально. Нарушено только восстановление, а его показывает T.',
'Подъём ST и отрицательный T. Что лежит под электродом?':'ST тянется к ране, значит рана рядом. T убегает от дыма, значит и ишемия рядом. Оба процесса лежат ближе к эпикарду.',
'Что значит Q патологический, ST вверх и T минус?':'Некроз уже сформирован, огонь ещё горит, но слабее, а вокруг дым. Такая смесь бывает в острую стадию.',
'Боль есть, ЭКГ нормальная. Инфаркт исключён?':'В первые часы ЭКГ может быть нормальной, а некоторые стенки обычные отведения не видят. Поэтому смотрят динамику ЭКГ и тропонин.',
'Подъём ST во II, III, aVF. Какая стенка?':'Это отведения снизу. Обычно здесь бассейн правой коронарной артерии, поэтому проверяют и правый желудочек.',
'Признаки в V1–V3. Какой инфаркт?':'V1–V2 смотрят на перегородку, V3 на переднюю стенку. Обычно это бассейн передней нисходящей артерии.',
'Признаки в V3–V4. Какой инфаркт?':'V3–V4 смотрят на переднюю стенку ближе к верхушке.',
'Признаки в I, aVL и всех V1–V6. Какой инфаркт?':'Захвачена большая зона, обычно это проксимальная окклюзия передней нисходящей артерии.',
'Почему задняя ишемия даёт высокий T в V1–V2?':'V1–V2 смотрят на заднюю стенку через всё сердце. То, что происходит там, выглядит наоборот.',
'Три признака WPW?':'Импульс обходит АВ-узел, поэтому PQ короткий. Часть желудочка возбуждается через мышцу, поэтому появляются дельта и широкий QRS.',
'Какой пучок при WPW?':'Пучок Кента связывает предсердие и желудочек напрямую, минуя АВ-узел.',
'Почему при LGL QRS нормальный?':'Пропущена только задержка. Желудочки возбуждаются обычным путём, поэтому QRS узкий.',
'Почему опасна ФП при WPW?':'АВ-узел обычно фильтрует импульсы. Пучок Кента этого не делает, поэтому ЧСС может стать очень высокой и перейти в ФЖ.',
'Какой QTc считается зоной высокого риска?':'Чем длиннее QTc, тем выше риск полиморфной ЖТ. Граница 0,50 с часто используется для решения о препаратах.',
'Самая частая находка при ТЭЛА?':'S1Q3T3 встречается реже, чем думают. Нормальная ЭКГ или обычная тахикардия ТЭЛА не исключают.',
'Что на ленте при пропущенном диализе?':'Широкий QRS, сливающийся с T, — поздняя стадия гиперкалиемии. Это неотложное состояние.'};

'Кто что видит':'Шесть отведений от конечностей смотрят на сердце во фронтальной плоскости, сверху, снизу и с боков. Шесть грудных смотрят в горизонтальной плоскости, как разрез вокруг грудной клетки. Вместе они дают трёхмерную картину.',
'Покрути электрическую ось':'Высота R в отведении — это проекция вектора на ось отведения. Поэтому ось определяют, сравнивая высоту зубцов. В норме вектор идёт вниз и влево, к верхушке, и сильнее всего совпадает с II отведением.',
'Откуда берутся тахикардии':'Рефрактерный период — время, когда клетка не может возбудиться заново. Круг возможен, только если импульс возвращается к началу пути, когда тот уже вышел из рефрактерности. Поэтому короткий рефрактерный период и медленное проведение делают re-entry вероятнее.',
'Лестница частот':'АВ-узел после каждого импульса какое-то время рефрактерен, поэтому пропускает ограниченное число импульсов. Предел разный у разных людей и зависит от тонуса и препаратов, поэтому 220 — только учебная цифра. Дополнительный пучок этому ограничению не подчиняется.',
'Три зоны инфаркта':'В реальном инфаркте зоны лежат друг вокруг друга: в центре некроз, вокруг повреждение, снаружи ишемия. Поэтому разные электроды над одной областью показывают разные признаки. Зона повреждения — главная цель лечения: её ещё можно спасти.',
'Как инфаркт идёт во времени':'Подъём ST появляется в первые минуты и обычно уходит за дни. Q формируется за часы. T отрицательный может держаться месяцами. Если подъём ST держится недели, думай об аневризме. Сроки у разных людей отличаются.',
'Карта инфарктов':'Признаки считаются значимыми, если они есть хотя бы в двух соседних отведениях одной группы. Поэтому сначала находим группу, а потом называем стенку.'});

MORE['Грудные электроды: этажи']='Рёбра считают от угла Людовика, выступа на грудине: рядом со вторым ребром. Смещение электрода на одно межреберье меняет форму комплекса и может имитировать патологию. У женщин электроды ставят под молочную железу, ориентируясь на те же линии.';

MORE['Как бежит возбуждение']='В покое клетка заряжена: внутри минус, снаружи плюс. Когда приходит импульс, ионы натрия входят внутрь, заряд меняется, и это деполяризация. Соседняя клетка получает толчок, и волна идёт дальше. Потом ионы возвращаются на места, это реполяризация. Пока этого не произошло, клетка не может ответить на новый импульс: это рефрактерный период.';

/* ---------- как запомнить: что запомнить, образ с картинкой, как запомнить по шагам, проверь себя ---------- */
/* w: строки разделены знаком |, строка с «• » становится пунктом списка */
const HOW={
'Путь импульса':{i:'spark_button',o:'Красная кнопка, искра и вспышка',f:'Порядок: СА-узел → предсердия → АВ-узел → пучок Гиса → правая и левая ножки → волокна Пуркинье.',w:'Одна искра — один удар сердца ⚡.|Заведующий жмёт <b>кнопку</b> → искра летит в <b>предоперационную</b> → <b>санитар</b> в шлюзе держит её мгновение → искра мчится по <b>коридору</b> → делится на <b>две двери</b> → в обеих операционных разом <b>вспыхивают лампы</b>.|Считалочка: <b>кнопка — пауза — коридор — двери — вспышка!</b>',d:'Закрой экран и пройди маршрут искры вслух: кнопка заведующего → предоперационная → санитар в шлюзе → коридор → две двери → две операционные → вспышка ламп. Потом скажи терминами. (Ответ: СА-узел → предсердия → АВ-узел → пучок Гиса → правая и левая ножки → желудочки, волокна Пуркинье.)'},
'Как бежит возбуждение':{i:'books',o:'Ряд книг на полке',f:'Деполяризация — волна возбуждения. Реполяризация — восстановление. Рефрактерный период — время, когда клетку нельзя возбудить снова.',w:'Поставь книги в ряд и толкни первую 📚.|Книги <b>падают</b> одна за другой — это деполяризация.|Ты их <b>поднимаешь</b> обратно — реполяризация.|Пока книга лежит, толкать её бесполезно — это <b>рефрактерный период</b>.',d:'Объясни на книгах три слова: блокада, рефрактерный период, re-entry. (Ответ: вынули книгу — волна встала; упавшую книгу нельзя уронить, пока её не подняли; книги по кругу — волна бежит без конца.)'},
'Почему задаёт ритм СА-узел':{i:'doctor',o:'Заведующий, зам и дежурный',f:'Собственная частота импульсов в минуту: СА-узел 60–90, АВ-узел 40–60, желудочки 20–40.',w:'В больнице командует тот, кто <b>быстрее всех</b> отдаёт приказы.|Заведующий (СА-узел) — 60–90 в минуту, зам (АВ-узел) — 40–60, дежурный (желудочки) — 20–40.|Пока заведующий на месте, остальные молчат. Ушёл — командует зам, только медленнее 🐢.',d:'Пульс 50 в минуту, QRS узкий — чья кнопка работает? Пульс 30, QRS широкий — чья? (Ответ: зама у шлюза, АВ-узел; дежурного в операционной, желудочки.)'},
'АВ-узел: зачем нужна задержка':{i:'sanitar',o:'Санитар ловит искру и держит, пока закатят пациента',f:'Импульс задерживается в АВ-узле примерно на 0,08 с. На ленте это ровный сегмент PQ.',w:'Санитар не пускает искру сразу: «Подожди, пациента ещё закатывают!» ✋|Держит её около <b>0,08 с</b> — предсердия успевают долить кровь в желудочки.|На ленте эта пауза — <b>ровная линия после P</b>.',d:'Почему после зубца P линия ровная? Что случится с ней, если санитар станет держать искру дольше? (Ответ: АВ-узел маленький, его ток не виден; линия станет длиннее — АВ-блокада.)'},
'Пучок Гиса и ножки':{i:'corridor',o:'Коридор и две двери в операционные',f:'Правая ножка одна. Левая делится на переднюю и заднюю ветви. Чаще страдают правая ножка и передняя ветвь левой.',w:'Из шлюза ведёт <b>один коридор</b> (пучок Гиса), в конце — <b>две двери</b> 🚪.|Правая дверь <b>одностворчатая</b> — правая ножка одна. Левая — <b>двустворчатая</b>: передняя и задняя ветви.|Одинокая правая дверь и узкая передняя створка ломаются чаще всего.',d:'Назови три пути после коридора и скажи, какой ломается реже всех и почему. (Ответ: правая ножка, передняя и задняя ветви левой; реже всех задняя — она толстая и с двойным кровоснабжением.)'},
'Электроды на конечности':{i:'stoplight',o:'Светофор по часовой стрелке',f:'Правая рука — красный. Левая рука — жёлтый. Левая нога — зелёный. Правая нога — чёрный.',w:'Светофор 🚦 начинается с правой руки и идёт по часовой стрелке:|<b>красный</b> — правая рука → <b>жёлтый</b> — левая рука → <b>зелёный</b> — левая нога.|А <b>чёрный</b> — на правой ноге: это «земля», он не светится.',d:'Покажи на себе по кругу и назови цвета три раза подряд без запинки. (Ответ: правая рука — красный, левая рука — жёлтый, левая нога — зелёный, правая нога — чёрный.)'},
'Грудные электроды: этажи':{i:'chest_house',o:'Дом на груди: два этажа и лестница',f:'V1, V2 — 4-е межреберье у края грудины. V4 — 5-е межреберье, среднеключичная линия. V5, V6 — та же высота, передняя и средняя подмышечные линии. V3 — между V2 и V4.',w:'На груди стоит <b>дом</b> 🏠 с двумя этажами — это межреберья.|<b>4 этаж</b>: у самой грудины две квартиры — V1 справа, V2 слева.|<b>5 этаж</b>: V4 под серединой ключицы, V5 у переднего края подмышки, V6 под серединой подмышки — все на одной высоте.|<b>V3</b> стоит на лестнице между V2 и V4.|Цвета: красный, жёлтый, зелёный, коричневый, чёрный, фиолетовый.',d:'Покажи пальцем на себе все шесть точек в порядке установки. (Ответ: V1 и V2 — 4-е межреберье по краям грудины, V4 — 5-е межреберье под серединой ключицы, V3 — между V2 и V4, V5 и V6 — на высоте V4 ближе к подмышке.)'},
'Главное правило ЭКГ':{i:'oncar',o:'Фары машины ночью на трассе',f:'Вектор идёт к электроду — зубец вверх. Уходит от электрода — зубец вниз. Идёт поперёк — зубец маленький или двухфазный.',w:'Ночью на тебя едет машина — фары <b>слепят</b>: зубец вверх 🚗.|Машина уезжает — видишь только <b>красные огни</b> сзади: зубец вниз.|Едет мимо, боком — почти ничего не видно: зубец <b>маленький</b> или двухфазный.',d:'Почему в отведении aVR почти все зубцы смотрят вниз? (Ответ: aVR смотрит с правого плеча, а волна в сердце идёт вниз и влево — машина уезжает.)'},
'Зубец P: два предсердия':{i:'aheart',o:'Правое — Первое',f:'Начало зубца P — правое предсердие, конец — левое. Норма P: до 0,10 с, до 2,5 мм.',w:'<b>П</b>равое — <b>П</b>ервое.|Искра стартует в правом предсердии, поэтому оно рисует <b>начало P</b>, а левое — конец.|Нормальный P — скромный холмик: не шире <b>2,5 маленькой клетки</b> (0,10 с) и не выше <b>2,5 мм</b>.',d:'Нарисуй зубец P и подпиши, какая половина от какого предсердия. (Ответ: начало — правое, конец — левое.)'},
'QRS: слово ПоВОрот':{i:'uturn',o:'Импульс делает поворот',f:'Q — перегородка. R — верхушка. S — основание сердца.',w:'Произнеси слово <b>ПоВОрот</b> — и импульс сам покажет дорогу ↩️.|Маленький шаг по <b>перегородке</b> — Q.|Мощный рывок к <b>верхушке</b> — R.|Поворот обратно к <b>основанию</b> — S.',d:'Нарисуй сердце и стрелками покажи три шага. Подпиши, какой шаг рисует Q, какой R, какой S. (Ответ: перегородка — Q, верхушка — R, основание — S.)'},
'ST и T: уборка':{i:'books',o:'Книги упали, лежат, их поднимают',f:'ST — момент равновесия, линия ровная. T — реполяризация желудочков.',w:'Книги упали 📚 — и полежали. Пока лежат, всё спокойно: <b>ST — ровная линия</b>.|Потом их поднимают обратно — это <b>T</b>: желудочки восстанавливаются.',d:'Покажи на ленте, где книги падают, где лежат и где их поднимают. (Ответ: падают — QRS, лежат — сегмент ST, поднимают — зубец T.)'},
'Интервал или сегмент':{i:'ruler',o:'В интервале зубец внутри',f:'Сегмент — только ровная линия. Интервал — зубец вместе с линией.',w:'<b>Сегмент</b> — только дорожка между домиками. <b>Интервал</b> — дорожка вместе с домиком 🏠.|Подсказка: <b>И</b>нтервал = <b>И</b> зубец, <b>И</b> линия.|Поэтому интервал PQ включает зубец P, а сегмент PQ — нет.',d:'Что длиннее: сегмент PQ или интервал PQ? Почему? (Ответ: интервал — в нём есть ещё зубец P.)'},
'Смотри в клетки, а не в секунды':{i:'stopwatch',o:'Одна большая клетка — 0,2 с',f:'При 25 мм/с: малая клетка 0,04 с, большая 0,2 с. P и QRS до 0,10 с. PQ 0,12–0,20 с. QT 0,35–0,44 с.',w:'Забудь секунды — считай клетки 🔲.|<b>Маленькая — 0,04 с, большая — 0,2 с.</b>|P и QRS — до 2,5 маленьких. PQ — от 3 до 5 маленьких, то есть около одной большой. QT — около двух больших.',d:'QRS занимает 4 маленькие клетки. Он узкий или широкий? (Ответ: 4 × 0,04 = 0,16 с — широкий, больше 0,12 с.)'},
'Сначала паспорт ленты':{i:'calendar',o:'Дата 25.10.12',f:'Стандарт: скорость 25 мм/с, вольтаж 10 мм/мВ, 12 отведений.',w:'Перед чтением проверь «паспорт» ленты, как дату рождения: <b>25.10.12</b> 📅.|<b>25</b> мм/с — скорость, <b>10</b> мм/мВ — вольтаж, <b>12</b> отведений.|Цифры другие — все нормы поплывут.',d:'Ступенька в начале ленты высотой 5 мм. Что это значит для всех зубцов? (Ответ: запись в половинном масштабе, настоящие зубцы вдвое больше нарисованных.)'},
'РЫЧАГ на ОСИ':{i:'clipboard',o:'Чек-лист: РЫтм, ЧАстота, ОСь',f:'Порядок: ритм, ЧСС, ось, затем P, QRS, ST, T и интервалы.',w:'Тянешь <b>РЫЧАГ на ОСИ</b> — и лента читается сама 🛠️.|<b>РЫ</b>тм → <b>ЧА</b>стота → <b>ОСЬ</b> → дальше по порядку P, QRS, ST, T и интервалы.|Каждый раз один и тот же порядок — ничего не пропустишь.',d:'Назови порядок чтения ЭКГ по слову РЫЧАГ на ОСИ. (Ответ: ритм, частота, ось, затем P, QRS, ST, T, интервалы.)'},
'ЧСС за три секунды':{i:'abacus',o:'300 делим на число клеток',f:'ЧСС в минуту = 300 / число больших клеток между R. Или 1500 / R-R в мм при 25 мм/с.',w:'Считалочка: <b>300 — 150 — 100 — 75 — 60 — 50</b> ✋.|Найди R на толстой линии и считай большие клетки до следующего R: одна — 300, две — 150, три — 100…|Точнее: 1500 делим на R-R в миллиметрах.',d:'Между соседними R четыре большие клетки. Какая ЧСС? (Ответ: 300 : 4 = 75 в минуту.)'},
'Синусовый ли ритм':{i:'check',o:'Во II да, в aVR нет',f:'P положительный во II, отрицательный в aVR, стоит перед каждым QRS, одной формы.',w:'Синусовый P — <b>вежливый гость</b> 🙂:|во II отведении <b>кивает «да»</b> (вверх), в aVR <b>мотает «нет»</b> (вниз),|всегда <b>входит перед</b> каждым QRS и каждый раз выглядит одинаково.',d:'P во II отрицательный, а в aVR положительный. Командует ли заведующий? (Ответ: нет — волна идёт снизу вверх, очаг в нижней части предсердий, ритм не синусовый.)'},
'Кто что видит':{i:'eyes',o:'Электрод видит то, что под ним',f:'II, III, aVF — низ. I, aVL, V5, V6 — левый бок. V1, V2 — правые отделы и перегородка. V3, V4 — передняя стенка и верхушка.',w:'Каждый электрод — <b>камера</b> 📷, снимает стенку прямо под собой.|II, III, aVF смотрят <b>снизу</b>, на пол.|I, aVL, V5, V6 — на <b>левый бок</b>.|V1, V2 — на перегородку, V3, V4 — <b>вперёд</b>, на верхушку.',d:'Изменения в II, III и aVF. Какую стенку сердца видят эти отведения? (Ответ: нижнюю.)'},
'Две команды отведений':{i:'scale',o:'Левая команда против правой',f:'Левая команда: I, aVL, V5, V6. Правая команда: III, aVF, V1, V2.',w:'Перетягивание каната 🪢.|<b>Левая команда</b> — I, aVL, V5, V6 (в aVL даже буква L — Left).|<b>Правая команда</b> — III, aVF, V1, V2.|Команды часто рисуют наоборот: у одних зубец вверх — у других вниз, как качели.',d:'Назови обе команды. В какой из них V6, а в какой V1? (Ответ: левая — I, aVL, V5, V6; правая — III, aVF, V1, V2.)'},
'Покрути электрическую ось':{i:'magnet',o:'Мышца притягивает ось, как магнит',f:'Ось — суммарное направление возбуждения. В норме она идёт вниз и влево.',w:'Ось — стрелка компаса 🧲, а магнит — мышца сердца.|Больше всего мышцы у левого желудочка, внизу слева — туда и смотрит стрелка.|Мышца растолстела — магнит сильнее, стрелку <b>тянет к ней</b>. Рубец — магнит пропал, стрелка <b>отходит</b>.',d:'Ось ушла вправо. Назови одну возможную причину. (Ответ: например, гипертрофия правого желудочка или блокада задней ветви левой ножки.)'},
'Ось за секунду':{i:'numbers',o:'Счёт 1-2-3 и обратный отсчёт 3-2-1',f:'Нормальная: R во II выше, чем в I, а в I выше, чем в III. Влево: I > II > III. Вправо: III > II > I.',w:'Построй R в I, II, III по росту, как детей 📏.|<b>Норма</b>: выше всех двойка — II > I > III.|<b>Влево</b>: обычный счёт — 1, 2, 3 (I > II > III).|<b>Вправо</b>: обратный отсчёт — 3, 2, 1 (III > II > I).',d:'R в I самый высокий, потом II, потом III. Куда ось? (Ответ: влево — порядок один, два, три.)'},
'Прогулка по комплексу':{i:'magnifier',o:'Пять вопросов слева направо',f:'P до 0,10 с и до 2,5 мм. QRS до 0,10 с, Q меньше ¼ R. ST на изолинии (допустимо до 0,5 мм вниз в V5–V6 и до 2 мм вверх в V1–V2). PQ 0,12–0,20 с. QT 0,35–0,44 с.',w:'Иди по комплексу слева направо, как по улице, и задай <b>пять вопросов</b> 🔍:|P скромный? QRS узкий? Q крошечный? ST ровный? Интервалы в норме?|Цифры — в «Что запомнить» выше. Главное — не пропустить ни один дом.',d:'Назови пять вопросов по порядку. (Ответ: P — откуда приказ; QRS — узкий ли; ST — на линии ли; T — туда же, куда QRS; интервалы — PQ и QT в норме ли.)'},
'Холм в грудных отведениях':{i:'mountain',o:'Вершина горы на V4',f:'R растёт от V1 к V4, потом снижается. S наоборот уменьшается.',w:'Грудные отведения — прогулка по горе ⛰️.|От V1 <b>поднимаешься</b> (R растёт), на V4 — <b>вершина</b>, к V6 спускаешься.|Горы нет, R не растёт — подумай о рубце спереди. Вершина уехала к V5–V6 — о толстом левом желудочке.',d:'R в V1–V3 не растёт, везде маленький. О чём подумать? (Ответ: о рубце передней стенки.)'},
'Синусовые аритмии':{i:'sloth',o:'Тахометр и ленивец-брадипод',f:'Тахикардия — больше 90 в минуту. Брадикардия — меньше 60 в минуту. Командует заведующий.',w:'Командует всё тот же заведующий, просто у него разное настроение.|Разогнался больше 90 — <b>тахикардия</b> 🏎️, как стрелка тахометра.|Еле ползёт, как ленивец-брадипод 🦥, — меньше 60, <b>брадикардия</b>.',d:'Пульс 110 в минуту, обычный P перед каждым QRS. Как назвать ритм? (Ответ: синусовая тахикардия.)'},
'Экстрасистола':{i:'collision',o:'Кто-то нажал свою кнопку раньше заведующего',f:'R-R перед ней короче. Предсердная: P другой, QRS узкий. Из АВ-узла: P нет, QRS узкий. Желудочковая: P нет, QRS шире 0,12 с.',w:'Кто-то нажал свою кнопку <b>раньше заведующего</b> — удар приходит раньше времени 💥.|Узкий и с чужим P — нажали в <b>предсердии</b>.|Узкий без P — нажал <b>санитар в шлюзе</b>.|Широкий и без P — нажали прямо <b>в операционной</b> (желудочек).',d:'Ранний удар, P нет, QRS широкий. Где вспыхнула искра? (Ответ: прямо в операционной — желудочковая экстрасистола.)'},
'Где очаг в предсердии':{i:'updown',o:'Очаг сверху — P вверх, снизу — вниз',f:'Очаг вверху — P положительный. В середине — двухфазный. Внизу — отрицательный.',w:'Искра бежит <b>сверху вниз</b> — P смотрит вверх ⬆️.|Очаг внизу — искра бежит <b>снизу вверх</b>, P переворачивается ⬇️.|Очаг посередине — бежит в обе стороны, P <b>двухфазный</b>.',d:'P во II отведении отрицательный. Где очаг? (Ответ: в нижней части предсердий.)'},
'Как они ходят':{i:'muscle',o:'Бицепс и трицепс',f:'Бигеминия: чередование 1 : 1. Тригеминия: экстрасистола после двух нормальных комплексов. Парные: две подряд. Политопные: из разных очагов.',w:'Бицепс 💪 — две головки: <b>бигеминия</b>, каждый второй удар лишний (тук-ТУК).|Трицепс — три головки: <b>тригеминия</b>, два обычных и лишний (тук-тук-ТУК).|<b>Парные</b> — две подряд, как пара обуви. <b>Политопные</b> — кричат из разных мест, все разной формы.',d:'Повторяется: обычный, обычный, экстрасистола. Как это называется? (Ответ: тригеминия.)'},
'Откуда берутся тахикардии':{i:'repeat',o:'Книги, поставленные по кругу',f:'Re-entry — импульс ходит по кругу. Нужны два пути с разной скоростью и разным рефрактерным периодом.',w:'Поставь книги <b>по кругу</b> 📚 и толкни одну. Волна обходит круг, а первые книги уже снова стоят — и она бежит дальше, без конца. Это <b>re-entry</b>.|Чтобы круг работал, нужен <b>медленный участок</b> (книги успевают встать) и <b>дверь в одну сторону</b>.',d:'Зачем кольцу re-entry медленный участок? (Ответ: пока волна там ползёт, остальные клетки успевают восстановиться; иначе волна упрётся в невосстановленные клетки и погаснет.)'},
'Лестница частот':{i:'ladder',o:'Двести, триста, четыреста с лишним',f:'В минуту: предсердная тахикардия 120–220, трепетание предсердий 240–340, фибрилляция предсердий 350–600.',w:'Три ступеньки — считай сотнями 🪜:|<b>двести</b> — предсердная тахикардия (120–220),|<b>триста</b> — трепетание (240–340),|<b>четыреста с лишним</b> — фибрилляция (350–600).|Чем выше ступенька, тем больше хаоса.',d:'Ровная пила около 300 в минуту. Какая ступенька? (Ответ: трепетание предсердий.)'},
'Три вопроса к любой тахикардии':{i:'stethoscope',o:'Три взгляда врача приёмного отделения',f:'Три вопроса: какой QRS, какие R-R, что вместо P.',w:'Как врач приёмного 🩺, задай любой тахикардии три вопроса:|QRS <b>узкий или широкий</b>?|R-R <b>ровные или разные</b>?|<b>Что вместо P</b> — пила, рябь, чужой P или ничего?',d:'QRS широкий, ритм ровный, 160 в минуту, P не видно. О чём думать в первую очередь? (Ответ: о желудочковой тахикардии.)'},
'Узкие тахикардии':{i:'megaphone',o:'Один мегафон или кричащая толпа',f:'Трепетание: пила F, ровно. Фибрилляция (мерцательная аритмия): рябь f, все R-R разные. Предсердная: другой P. АВ-тахикардия: P не видно.',w:'<b>Трепетание</b> — один человек с мегафоном 📢: кричит громко и ровно, на ленте пила.|<b>Фибрилляция</b> — галдящая толпа: рябь вместо P, все R-R разные.|<b>Предсердная</b> — кричит не заведующий, а чужой врач: P есть, но другой.|<b>АВ-тахикардия</b> — кричат прямо из шлюза: P спрятался.',d:'Узкий QRS, все R-R разные, вместо P мелкая рябь. Что это? (Ответ: фибрилляция предсердий.)'},
'Широкие: тут счёт на минуты':{i:'ambulance',o:'Лестница вниз к остановке сердца',f:'Желудочковая тахикардия: широкие одинаковые QRS, ровные R-R, больше 100 в минуту. Трепетание желудочков: синусоида. Фибрилляция желудочков: хаос без комплексов.',w:'Лестница вниз к остановке сердца 🚑 — каждая ступенька опаснее:|<b>ЖТ</b> — широкие одинаковые комплексы, идут строем.|<b>Трепетание желудочков</b> — ровные волны, синусоида.|<b>Фибрилляция желудочков</b> — хаос, сердце не качает. Тут счёт на минуты.',d:'Расставь от лучшего к худшему: фибрилляция желудочков, желудочковая тахикардия, трепетание желудочков. (Ответ: желудочковая тахикардия → трепетание желудочков → фибрилляция желудочков.)'},
'Степени всегда одни и те же':{i:'lock',o:'Шлюз медленный, капризный, запертый',f:'I степень — задержка. II степень — часть импульсов теряется. III степень — не проходит ни один.',w:'Шлюз бывает трёх видов 🔒:|<b>I</b> — медленный: проходят все, но с задержкой.|<b>II</b> — капризный: часть пропускает, часть теряет.|<b>III</b> — запертый: не проходит никто.|Правило одинаково для СА- и АВ-блокад.',d:'Своими словами: чем II степень отличается от III? (Ответ: при II теряется часть приказов, при III — все, и работает запасной водитель ритма.)'},
'Главное отличие':{i:'pause',o:'Приказ не вышел из кабинета или застрял в шлюзе',f:'СА-блокада: выпадает весь цикл вместе с P. АВ-блокада: P остаётся, выпадает только QRS.',w:'Приказ <b>не вышел из кабинета</b> (СА-блокада) — пропал весь удар, и P, и QRS ⏸️.|Приказ <b>застрял в шлюзе</b> (АВ-блокада) — P есть, а QRS за ним нет.|Видишь одинокий P — виноват шлюз.',d:'В паузе стоит одинокий P без QRS. Какая это блокада? (Ответ: АВ-блокада — искра вылетела, но застряла у санитара в шлюзе.)'},
'АВ-блокады':{i:'sanitar',o:'Санитар в шлюзе оперблока',f:'I степень: PQ больше 0,20 с. Мобитц 1: PQ растёт, потом выпал QRS. Мобитц 2: PQ постоянный, QRS выпал внезапно. III степень: P и QRS не связаны.',w:'Санитар в шлюзе 🙌:|<b>I степень</b> — тугодум: держит искру дольше, PQ больше 0,20 с.|<b>Мобитц 1</b> — устаёт: держит всё дольше и дольше, потом роняет.|<b>Мобитц 2</b> — держит ровно, но вдруг роняет без предупреждения.|<b>III степень</b> — ушёл: предсердия и желудочки живут каждый сам по себе.',d:'PQ: 0,20 → 0,26 → 0,32 с, потом P без QRS, и всё сначала. Какая блокада? (Ответ: II степень, Мобитц 1 — Венкебах.)'},
'Если выпал каждый второй':{i:'question',o:'Сравнить не с чем',f:'При блокаде 2 : 1 тип по ленте не определить.',w:'Если выпадает каждый второй QRS, PQ не с чем сравнить: ему негде «расти» ❓.|Мобитц 1 это или Мобитц 2 — по такой ленте не скажешь. Пиши честно: <b>АВ-блокада 2 : 1</b>.',d:'Почему при блокаде 2 : 1 нельзя сказать, Мобитц 1 это или Мобитц 2? (Ответ: нет двух проведённых ударов подряд — нечего сравнивать.)'},
'СА-блокады':{i:'door',o:'Приказ застрял в кабинете заведующего',f:'Тип 1: R-R перед паузой укорачиваются, пауза меньше 2 R-R. Тип 2: пауза ровно 2 R-R, если выпал один цикл. I степень на ЭКГ не видна.',w:'Приказ застрял в кабинете заведующего 🚪 — на ленте пропадает целый удар.|<b>Тип 1</b>: перед паузой R-R укорачиваются, пауза <b>меньше двух</b> обычных.|<b>Тип 2</b>: пауза ровно <b>два</b> обычных R-R — будто один удар просто вырезали.|I степень на ЭКГ не видна.',d:'Обычный R-R 1 с, пауза ровно 2 с, в паузе нет ни P, ни QRS. Что это? (Ответ: СА-блокада II степени, тип 2.)'},
'Если СА-узел молчит':{i:'buoy',o:'Спасательный круг: ниже должность — реже команды',f:'Ритм берёт нижний очаг: АВ-узел 40–60 в минуту, узкий QRS. Желудочки 20–40 в минуту, широкий QRS.',w:'Заведующий замолчал — кнопку жмёт тот, кто ниже по должности 🛟. Чем ниже должность, тем реже команды.|<b>Зам у шлюза</b> (АВ-узел) — 40–60 в минуту, QRS узкий.|<b>Дежурный в операционной</b> (желудочки) — 20–40, QRS широкий.|Это спасатели: приходят поздно, после паузы.',d:'Удар пришёл после длинной паузы, QRS узкий, 45 в минуту. Это экстрасистола? (Ответ: нет — это выскальзывающий ритм из АВ-соединения, кнопка зама: он приходит поздно и страхует.)'},
'Почему QRS становится широким':{i:'door_locked',o:'Одна дверь заперта — идут через соседнюю',f:'Блокада ножки: QRS шире, конец комплекса показывает на больную сторону.',w:'Одна дверь в операционную <b>заперта</b> 🔒. Искра входит в соседнюю и медленно пробирается через стену — QRS <b>расширяется</b>.|Запертая сторона загорается последней, поэтому <b>конец комплекса показывает на больную сторону</b>.',d:'Почему при блокаде ножки QRS становится широким? (Ответ: в одну операционную искра прожигает стену и ползёт по мышце мимо проводки — один желудочек опаздывает.)'},
'Буква М живёт там, где блокада':{i:'rabbit',o:'WiLLiaM и MaRRoW',f:'Правая ножка: rsR′ в V1, широкий S в V6. Левая ножка: широкий R в V5–V6, глубокий S в V1.',w:'<b>WiLLiaM</b> — в середине LL, Left: левая ножка. W в V1, M в V6.|<b>MaRRoW</b> — в середине RR, Right: правая ножка. M в V1 (заячьи уши 🐰), W в V6.|Короче: <b>буква М живёт там, где блокада</b> — справа в V1 или слева в V6.',d:'В V1 «заячьи уши» rsR′. Какая ножка заблокирована? (Ответ: правая.)'},
'Поворотник в V1':{i:'car',o:'Рычаг поворотника в машине',f:'Конец QRS в V1 вверх — правая ножка. Вниз — левая ножка.',w:'Рычаг поворотника 🚗: смотри на конец широкого QRS в V1.|Конец <b>вверх</b> — правая ножка (рычаг вверх — направо).|Конец <b>вниз</b> — левая ножка (рычаг вниз — налево).',d:'QRS широкий, в V1 конец комплекса смотрит вниз. Какая блокада? (Ответ: блокада левой ножки.)'},
'Полная или неполная':{i:'three',o:'Три малые клетки',f:'Неполная: QRS 0,10–0,12 с. Полная: QRS больше 0,12 с.',w:'Считай маленькие клетки ширины QRS 3️⃣:|<b>до трёх</b> (0,10–0,12 с) — неполная блокада,|<b>больше трёх</b> (больше 0,12 с) — полная.',d:'Форма блокады правой ножки, QRS 0,11 с. Полная или неполная? (Ответ: неполная — меньше 0,12 с.)'},
'Ветви левой ножки':{i:'door_double',o:'Передняя — влево вверх, задняя — вправо вниз',f:'Передняя ветвь: ось ≤ −60° (в зарубежных критериях от −45°), S больше R во II, III, aVF. Задняя ветвь: ось ≥ +120°, S больше R в I, aVL.',w:'Левая дверь двустворчатая 🚪🚪. Закрыли одну створку — QRS почти не расширяется, только <b>уезжает ось</b>.|<b>Передняя</b> закрыта — ось улетает <b>влево вверх</b>.|<b>Задняя</b> закрыта — ось уходит <b>вправо вниз</b>.|Как машина задним ходом: водитель смотрит через правое плечо — задняя → вправо.',d:'Ось −70°, QRS узкий. Какая ветвь заблокирована и где S больше R? (Ответ: передняя ветвь левой ножки; во II, III, aVF.)'},
'Перекачанная мышца':{i:'muscle',o:'Громче, голоднее, медленнее, тянет',f:'Признаки гипертрофии: выше зубцы, ST вниз, шире комплекс, ось в сторону гипертрофии.',w:'Сердце-качок 💪 — четыре слова:|<b>Громче</b> — зубцы выше.|<b>Голоднее</b> — ST вниз, T отрицательный.|<b>Медленнее</b> — комплекс чуть шире.|<b>Тянет</b> — ось уходит к толстой стенке.',d:'Назови четыре признака гипертрофии и что каждый значит на ленте. (Ответ: громче — зубцы выше; голоднее — ST вниз, T отрицательный; медленнее — комплекс шире; тянет — ось смещается к утолщённому желудочку.)'},
'Предсердия: пик или верблюд':{i:'camel2',o:'Горный пик и двугорбый верблюд',f:'P pulmonale: правое предсердие, высокий острый, больше 2,5 мм. P mitrale: левое предсердие, двугорбый, шире 0,10 с.',w:'<b>Правое</b> предсердие — <b>острая горная вершина</b> ⛰️: P высокий, выше 2,5 мм (P pulmonale).|<b>Левое</b> — <b>двугорбый верблюд</b> 🐫: P широкий, с двумя горбами (P mitrale).|<b>П</b>равое — <b>П</b>ик.',d:'P широкий, 0,12 с, с двумя горбами. Какое предсердие увеличено? (Ответ: левое — P mitrale.)'},
'Левый желудочек':{i:'seven',o:'Семь больших клеток',f:'Индекс Соколова–Лайона: S в V1 + R в V5 или V6 ≥ 35 мм. Признак: R в V6 > R в V5 > R в V4.',w:'<b>Семь больших клеток</b> 7️⃣ — ключ к левому желудочку.|Сложи S в V1 и R в V5 или V6. Набралось 35 мм (7 больших клеток) и больше — думай о гипертрофии левого.|Пара: семь <b>больших</b> — слева, семь <b>маленьких</b> — справа.',d:'S в V1 — 15 мм, R в V5 — 25 мм. Есть признак гипертрофии левого желудочка? (Ответ: 15 + 25 = 40 мм — больше 35, признак есть.)'},
'Правый желудочек':{i:'microscope',o:'Семь малых клеток в V1',f:'Гипертрофия правого желудочка: R в V1 больше 7 мм. R в V1 + S в V5 или V6 больше 10,5 мм.',w:'Правый желудочек обычно тихоня 🤫 — даже небольшой рост заметен.|<b>R в V1 больше 7 маленьких клеток</b> (7 мм) — думай о гипертрофии правого.|Семь <b>маленьких</b> — справа, семь <b>больших</b> — слева.',d:'R в V1 — 9 мм, ось вправо. О чём думаешь? (Ответ: о гипертрофии правого желудочка — R в V1 больше 7 мм.)'},
'Три зоны инфаркта':{i:'fire',o:'Дым, огонь и угли',f:'Ишемия меняет T. Повреждение меняет ST. Некроз меняет Q и снижает R.',w:'Инфаркт — как пожар в доме 🔥:|<b>Дым</b> — ишемия, меняет <b>T</b>.|<b>Огонь</b> — повреждение, меняет <b>ST</b>.|<b>Угли</b> — некроз, оставляет <b>Q</b>, R становится ниже.|Дым — огонь — угли = T — ST — Q.',d:'Какая зона меняет ST и можно ли её спасти? (Ответ: повреждение — огонь; да, если быстро восстановить кровоток.)'},
'Два правила вместо девяти рисунков':{i:'magnet',o:'ST тянется к огню, T отворачивается от дыма',f:'Повреждение тянет ST к себе. От ишемии T отворачивается.',w:'Всего два правила 🧲:|<b>ST тянется к огню</b>: огонь рядом с электродом — ST вверх, далеко — вниз.|<b>T отворачивается от дыма</b>: дым рядом — T вниз, далеко — T высокий.',d:'Повреждение у внутренней стенки — куда сдвинется ST? Ишемия у наружной стенки — каким будет T? (Ответ: ST вниз; T отрицательный.)'},
'Ишемия меняет T':{i:'smoke',o:'От дыма отворачиваются',f:'Субэндокардиальная: высокий острый T. Субэпикардиальная: T отрицательный. Трансмуральная: T глубокий отрицательный.',w:'От дыма отворачиваются 🌫️.|Дым <b>внутри</b>, далеко от электрода (субэндокардиально) — T высокий острый.|Дым <b>снаружи</b>, близко (субэпикардиально) — T отрицательный.|Дым <b>по всей стене</b> — T глубокий отрицательный.',d:'T высокий и острый в нескольких грудных отведениях. Где лежит дым, если это ишемия? (Ответ: у внутренней стенки — субэндокардиально.)'},

/* случаи: q вопрос, o варианты [ответ, почему], a верный, z заключение, tr почему легко ошибиться, hw как не ошибиться */
const ZG=['Помехи и артефакты','Ритм не такой, каким кажется','Блокады и паузы','Опасное: не пропусти'];

const REAL=[
Z('r_wander',0,'Плывущая изолиния','Плановая ЭКГ, пациент кашляет и глубоко дышит. Что на ленте?',[['Синусовый ритм, изолиния плывёт','Перед каждым QRS обычный P, R-R ровные. Волнами ходит только изолиния: это дыхание и движение.'],['Фибрилляция предсердий','При ФП нет P и R-R разные. Здесь P на месте, R-R ровные.'],['Подъём и депрессия ST','ST кажется то выше, то ниже, потому что плывёт вся линия. ST меряют от уровня PQ того же комплекса.']],0,'Ритм синусовый, правильный, ЧСС около 73 в минуту. Дрейф изолинии.','Плывущая линия делает ST то приподнятым, то опущенным, и можно «найти» ишемию там, где её нет.','Сравнивай ST с отрезком PQ в том же комплексе, а не с краем бумаги. Попроси пациента лежать спокойно и дышать ровно, проверь контакт электродов и перезапиши.'),
Z('r_tremor',0,'Дрожь вместо ряби','Пожилой пациент, руки дрожат, в палате холодно. Что на ленте?',[['Фибрилляция предсердий','Мелкая дрожь похожа на рябь f. Но приложи край бумаги к R: интервалы ровные, а при ФП они разные.'],['Синусовый ритм с мышечной дрожью','R-R ровные, местами виден P. Дрожат мышцы, а не предсердия.'],['Трепетание предсердий','Пила при трепетании ровная и крупная, около 300 в минуту. Здесь мелкая беспорядочная дрожь.']],1,'Ритм синусовый, правильный, ЧСС около 77 в минуту. Мышечный тремор.','Тремор очень похож на волны фибрилляции, особенно на мониторе.','Главное — R-R: ровные R-R почти исключают ФП. Согрей пациента, положи его руки на опору, электроды на конечностях ставь ближе к туловищу.'),
Z('r_ac',0,'Лохматая линия','Запись в реанимации, рядом много аппаратуры. Линия толстая и «лохматая». Что это?',[['Сетевая наводка, ритм синусовый','Частые одинаковые зубчики по всей ленте — помеха от электросети 50 Гц. Под ней обычный синусовый ритм.'],['Трепетание предсердий','Волны трепетания идут около 5 в секунду, а здесь зубчики гораздо чаще и одинаковы везде, даже на QRS.'],['Фибрилляция желудочков','При ФЖ нет QRS, а здесь они видны чётко.']],0,'Ритм синусовый, ЧСС около 75 в минуту. Сетевая наводка.','Наводка прячет мелкие зубцы P и делает изолинию неровной.','Проверь чёрный электрод (заземление) и контакт всех электродов, отодвинь кабели от сетевых шнуров, включи сетевой фильтр аппарата.'),
Z('r_motion',0,'Монитор кричит «ЖТ»','Монитор тревожит: «желудочковая тахикардия». Пациент в это время чистит зубы и спокойно отвечает. Что на ленте?',[['Желудочковая тахикардия','Сквозь размашистые волны с прежним шагом проходят узкие QRS. При ЖТ их бы не было.'],['Артефакт движения на фоне синусового ритма','Узкие QRS идут сквозь помеху в своём ритме, а размашистые волны — движение руки.'],['Фибрилляция желудочков','При ФЖ человек теряет сознание за секунды. Пациент разговаривает — это главный довод.']],1,'Ритм синусовый, ЧСС около 75 в минуту. Двигательный артефакт.','Двигательный артефакт может очень похоже изображать ЖТ и ФЖ. Это классическая ловушка мониторов.','Сначала посмотри на пациента. Потом найди узкие QRS, которые идут сквозь помеху с прежним интервалом. Сравни с другим отведением.'),
Z('r_off',0,'Внезапная прямая','Ночью на мониторе после нескольких нормальных комплексов идёт идеально прямая линия. Что делать в первую очередь и что вероятнее?',[['Сразу считать асистолией','Сначала пациент: пульс, дыхание, сознание. Идеально прямая линия сразу после нормальных комплексов чаще значит отсоединение. Но решает пациент, а не монитор.'],['Проверить пациента; вероятнее, отошёл электрод','Резкий обрыв ритма и линия без малейшей волны типичны для отсоединения. Но первым делом проверяют пациента.'],['Полная АВ-блокада','При полной блокаде видны зубцы P, а здесь нет ничего.']],1,'Синусовый ритм, затем прямая линия: вероятно, отсоединение электрода. Нужна проверка пациента и подключения.','Прямую линию легко принять за асистолию, а асистолию — за отошедший электрод. Ошибка в любую сторону опасна.','Порядок: пациент → подключение → усиление → другое отведение. Настоящая асистолия почти никогда не бывает идеально ровной: изолиния слегка плывёт.'),
Z('r_armSwap',0,'Всё вверх ногами','Отведение I: и P, и QRS, и T отрицательные. Человек здоров, жалоб нет. Что вероятнее всего?',[['Декстрокардия','Бывает, но редко. При ней ещё и R не растёт в грудных отведениях. Начни с частой причины.'],['Перепутаны электроды на руках','Красный и жёлтый поменяли местами. Отведение I переворачивается целиком, aVR и aVL меняются местами.'],['Инфаркт боковой стенки','Инфаркт не переворачивает зубец P. Отрицательный P в I — подсказка про электроды.']],1,'Вероятно, перепутаны электроды правой и левой руки. Перезаписать ЭКГ.','Перевёрнутое отведение I похоже на тяжёлую патологию: отрицательные T, ось вправо.','Отрицательный P в I — первый повод проверить цвета: красный на правой руке, жёлтый на левой. Перезапиши и сравни.','I'),
Z('r_lowV',0,'Всё мелкое','Все зубцы мелкие, метка калибровки обычная, 10 мм. Что на ленте?',[['Асистолия','QRS есть, они просто низкие. Асистолия — это отсутствие комплексов.'],['Синусовый ритм, низкий вольтаж','P перед каждым QRS, ритм ровный, только амплитуда маленькая.'],['Неправильная калибровка','Метка 10 мм в порядке. Значит, низкие сами зубцы, а не настройка.']],1,'Ритм синусовый, ЧСС около 75 в минуту. Низкий вольтаж QRS.','На мелкой ленте легко не заметить P и решить, что ритм не синусовый.','Сначала проверь метку калибровки. Если она в норме, низкий вольтаж — находка. Он бывает при выпоте в перикарде, ожирении, эмфиземе, отёках. Сопоставь с клиникой.'),
Z('r_afCoarse',1,'Пила или нет','Ритм неровный, между QRS крупные волны. Что это?',[['Трепетание предсердий','Пила при трепетании одинаковая, зуб за зубом, и R-R обычно ровные. Здесь волны разной формы и R-R разные.'],['Крупноволновая фибрилляция предсердий','Волны беспорядочные, разной высоты, R-R все разные.'],['Частые предсердные экстрасистолы','Перед экстрасистолой был бы чёткий P. Здесь вместо P беспорядочные волны.']],1,'Фибрилляция предсердий, крупноволновая форма, ЧСС в среднем около 82 в минуту.','Крупные волны f легко принять за пилу трепетания.','Сравни волны между собой: у пилы все зубья одинаковые. И приложи бумагу к R-R: при фибрилляции они всегда разные.'),
Z('r_afFine',1,'Тихая фибрилляция','Изолиния почти ровная, P не найти, ритм неровный. Что это?',[['Синусовая аритмия','При синусовой аритмии перед каждым QRS есть P. Здесь P нет.'],['Мелковолновая фибрилляция предсердий','Волны f такие мелкие, что почти не видны. Решает неровный R-R без P.'],['Ритм из АВ-узла','Узловой ритм ровный, а здесь R-R все разные.']],1,'Фибрилляция предсердий, мелковолновая форма, ЧСС в среднем около 87 в минуту.','Мелкие волны f легко не увидеть и решить, что предсердия просто «молчат».','Если P нет, а R-R меняются без всякой закономерности, это фибрилляция предсердий, даже когда ряби не видно.'),
Z('r_fl21',1,'Ровно 150','Ровная узкая тахикардия 150 в минуту, P трудно найти. Что надо исключить прежде всего?',[['Синусовую тахикардию','Её можно предположить, но ровно 150 в минуту — классическая ловушка. Посмотри: между QRS по две одинаковые волны.'],['Трепетание предсердий с проведением 2 : 1','Волны F идут около 300 в минуту, к желудочкам проходит каждая вторая. Одна волна прячется в QRS или T.'],['Желудочковую тахикардию','QRS узкий, это не ЖТ.']],1,'Трепетание предсердий с проведением 2 : 1, ЧСС желудочков 150 в минуту.','Половина волн F прячется в комплексах, и лента похожа на синусовую тахикардию.','Ровно около 150 в минуту — ищи вторую волну между QRS. Пилу лучше видно в II, III, aVF и V1.'),
Z('r_sinTach',1,'P прилип к T','Температура 39 °C. Ровная узкая тахикардия около 130 в минуту. Что это?',[['Наджелудочковая тахикардия','При ней P не видно. Здесь P есть перед каждым QRS, он просто прилип к концу T.'],['Синусовая тахикардия','P перед каждым QRS, одинаковый, просто при частом ритме он сливается с концом T.'],['Фибрилляция предсердий','R-R ровные, это не ФП.']],1,'Синусовая тахикардия, ЧСС около 130 в минуту.','При частом ритме P наезжает на T, и его легко не заметить.','Ищи небольшой горбик на спуске T перед каждым QRS. Синусовая тахикардия разгоняется и замедляется постепенно, вместе с причиной: температурой, болью, кровопотерей.'),
Z('r_resp',1,'Неровно, но норма','Подросток. Ритм то чаще, то реже, меняется плавно. Что на ленте?',[['Фибрилляция предсердий','При ФП нет P. Здесь P перед каждым QRS.'],['Синусовая дыхательная аритмия','P на месте, R-R плавно укорачиваются и удлиняются вместе с дыханием. Это норма.'],['СА-блокада','При СА-блокаде выпадают целые циклы, и пауза кратна R-R. Здесь изменения плавные.']],1,'Синусовая (дыхательная) аритмия, ЧСС от 57 до 100 в минуту. Вариант нормы.','Неровный R-R сразу наводит на мысль о фибрилляции.','При неровном ритме сначала ищи P. Есть P перед каждым QRS — ритм синусовый. Попроси задержать дыхание: дыхательная аритмия исчезнет.'),
Z('r_svtTrem',1,'Внезапно и ровно','Сердцебиение началось внезапно 20 минут назад. Узко, ровно, около 180 в минуту, ленту трясёт. Что это?',[['Синусовая тахикардия','Синусовая тахикардия не начинается внезапно, как по щелчку, и перед QRS был бы P.'],['Наджелудочковая (АВ-узловая) тахикардия','Узко, идеально ровно, P не видно, внезапное начало.'],['Фибрилляция предсердий','R-R ровные, при ФП они разные. Дрожь — это мышцы.']],1,'Пароксизмальная наджелудочковая тахикардия, ЧСС около 180 в минуту.','Мышечная дрожь на фоне частого ритма может напоминать фибрилляцию.','R-R решают: ровные — не ФП. Внезапное начало и конец, P не видно — типичная АВ-узловая re-entry тахикардия.'),
Z('r_pvcTrem',1,'Перебой или помеха','Жалобы на «перебои». Ленту трясёт. Что на ней?',[['Предсердная экстрасистола','Комплекс широкий, P перед ним нет. Значит, экстрасистола желудочковая.'],['Желудочковая экстрасистола','Ранний широкий QRS без P, T в обратную сторону, после него пауза.'],['Просто помеха','Помеха не даёт широкий комплекс с обратным T и не меняет ритм.']],1,'Ритм синусовый. Одиночная желудочковая экстрасистола. Мышечный тремор.','Дрожь маскирует детали, и экстрасистолу можно принять за помеху.','Экстрасистола меняет ритм: приходит раньше и оставляет паузу. Помеха ритм не меняет.'),
Z('r_bigemW',1,'Пульс не сходится','Пульс на запястье около 46 в минуту, а монитор насчитывает больше 90. Что на ленте?',[['Синусовая брадикардия','На ленте вдвое больше комплексов, чем ударов пульса: каждый второй — ранний и широкий.'],['Желудочковая бигеминия','После каждого нормального комплекса идёт желудочковая экстрасистола. Ранние сокращения слабые, и пульс их часто не ощущает.'],['Ритм из АВ-узла','Комплексы разные: узкие чередуются с широкими.']],1,'Ритм синусовый. Желудочковая экстрасистолия по типу бигеминии. Дефицит пульса.','Пульс и монитор не совпадают, и можно решить, что неисправен монитор или что это брадикардия.','Если пульс реже, чем комплексы на мониторе, ищи ранние сокращения: они не успевают дать полноценную пульсовую волну.'),
Z('r_av1',2,'Всего на клетку','Плановая ЭКГ, жалоб нет. На что обратить внимание?',[['Норма','Почти: P и QRS обычные, но PQ чуть больше одной большой клетки.'],['АВ-блокада I степени','PQ около 0,24 с, это шесть малых клеток. Норма до 0,20 с, пять клеток.'],['Мобитц 1','При Мобитц 1 PQ растёт и QRS выпадает. Здесь PQ всё время одинаковый.']],1,'Ритм синусовый, ЧСС около 70 в минуту. АВ-блокада I степени, PQ 0,24 с.','PQ удлинён всего на одну малую клетку, глазом это легко пропустить.','Всегда меряй PQ в клетках. Больше одной большой клетки, то есть больше 0,20 с, — АВ-блокада I степени.'),
Z('r_wenck',2,'Незаметное удлинение','Ритм кажется неровным, иногда пауза. Что на ленте?',[['Синусовая аритмия','Перед паузой есть P без QRS. При синусовой аритмии P всегда проводится.'],['АВ-блокада II степени, Мобитц 1','PQ растёт от удара к удару (0,17 → 0,25 → 0,29 с), потом P без QRS, и цикл повторяется.'],['АВ-блокада II степени, Мобитц 2','При Мобитц 2 PQ одинаковый перед выпадением. Здесь он растёт.'],['Блокированная экстрасистола','Непроведённый P пришёл вовремя, а не рано. Значит, это не экстрасистола.']],1,'Ритм синусовый. АВ-блокада II степени, тип Мобитц 1 (периодика Самойлова — Венкебаха), проведение 4 : 3.','Удлинение PQ идёт по 1–2 малые клетки, его легко не заметить. Тогда кажется, что QRS выпал внезапно, как при Мобитц 2.','Сравни PQ сразу после паузы и прямо перед ней. После паузы он самый короткий, перед паузой самый длинный — это Венкебах.'),
Z('r_av21',2,'Лишний P на T','ЧСС 50 в минуту. Между QRS видно по два P. Что это?',[['Синусовая брадикардия','При брадикардии на один QRS один P. Здесь P вдвое больше.'],['АВ-блокада II степени 2 : 1','Каждый второй P не проводится. Он прячется сразу за зубцом T.'],['Полная АВ-блокада','При полной блокаде PQ всё время разный. Здесь перед каждым QRS одинаковый PQ.']],1,'АВ-блокада II степени с проведением 2 : 1, ЧСС желудочков 50 в минуту.','Непроведённый P сливается с концом T, и лента похожа на обычную синусовую брадикардию.','При брадикардии всегда ищи «лишние» P, особенно на спуске T. Тип (Мобитц 1 или 2) при 2 : 1 по одной ленте не определить.'),
Z('r_av3',2,'Каждый сам по себе','ЧСС 46 в минуту, слабость, головокружение. Что на ленте?',[['Синусовая брадикардия','P здесь идут чаще, чем QRS, и не связаны с ними.'],['Полная АВ-блокада (III степени)','P идут своим ритмом около 88 в минуту, QRS — своим около 46. PQ всё время разный, часть P прячется в QRS и T.'],['АВ-блокада I степени','При I степени каждый P проводится с одинаковым длинным PQ.']],1,'Полная АВ-блокада. Предсердия около 88 в минуту, желудочки около 46 в минуту, QRS узкие: замещающий ритм из АВ-соединения.','Часть P скрыта в QRS и T, и кажется, что P нет совсем или что PQ просто длинный.','Отметь на бумаге два соседних P и шагай этим расстоянием по ленте. P окажутся в ровном ритме независимо от QRS — это полная блокада.'),
Z('r_blkPac',2,'Пауза с секретом','Внезапная пауза на ровном ритме. T перед паузой чуть острее соседних. Что это?',[['СА-блокада II степени','Пауза меньше двух R-R, а на T спрятан ранний P.'],['Блокированная предсердная экстрасистола','Ранний P упал на T и не прошёл к желудочкам: АВ-узел ещё не восстановился. Отсюда пауза.'],['АВ-блокада Мобитц 2','При Мобитц 2 не проводится P, пришедший вовремя. Здесь P пришёл рано.']],1,'Ритм синусовый. Блокированная (непроведённая) предсердная экстрасистола.','Это самая частая причина внезапной паузы, и её часто принимают за блокаду.','В любой паузе ищи P, особенно на зубце T перед ней. Сравни этот T с соседними: горбик или заострение — спрятанный P.'),
Z('r_pOnly',2,'Есть P, нет QRS','Остановка кровообращения. На мониторе ровно идут зубцы P, а QRS нет. Что это?',[['Отошёл электрод','При отсоединении не было бы и зубцов P.'],['Асистолия желудочков с сохранёнными P','Предсердия возбуждаются, к желудочкам ничего не проходит, а своего ритма у них нет.'],['Фибрилляция желудочков','При ФЖ видны беспорядочные волны. Здесь ровная линия с P.']],1,'Асистолия желудочков: зубцы P без комплексов QRS.','Видимые P создают ощущение, что ритм есть.','Смотри на QRS: если их нет, кровообращения нет, сколько бы P ни было на ленте. Действуй по протоколу реанимации.'),
Z('r_vt150',3,'Широкая и ровная','Широкая ровная тахикардия около 150 в минуту. Между комплексами местами видны маленькие зубцы. Что это?',[['Наджелудочковая тахикардия с блокадой ножки','Возможно, но доказать это трудно. Широкую тахикардию считают ЖТ, пока не доказано другое, а маленькие зубцы — подсказка.'],['Желудочковая тахикардия','Широкие одинаковые QRS. Маленькие зубцы — это P, которые идут своим ритмом, независимо от QRS. Это АВ-диссоциация, признак ЖТ.'],['Синусовая тахикардия','Перед QRS нет P с постоянным PQ, а комплексы широкие.']],1,'Желудочковая тахикардия, ЧСС около 150 в минуту, АВ-диссоциация.','Пациент с ЖТ может быть в сознании и выглядеть стабильным, а широкие комплексы списывают на блокаду ножки.','Широкая тахикардия — ЖТ, пока не доказано другое. Независимые P среди комплексов почти доказывают ЖТ.'),
Z('r_vfFine',3,'Мелкий хаос','Без сознания, пульса нет. На мониторе мелкие беспорядочные волны. Что это?',[['Асистолия','При асистолии линия почти ровная. Здесь частые беспорядочные волны.'],['Мелковолновая фибрилляция желудочков','Хаотичные волны без комплексов, просто маленькой амплитуды.'],['Артефакт','Без сознания и без пульса — это не артефакт.']],1,'Фибрилляция желудочков, мелковолновая.','Мелкую ФЖ легко принять за асистолию, а тактика у них разная.','Посмотри в другом отведении и увеличь усиление: мелкие волны станут заметнее. Тактику определяй по действующему протоколу реанимации.'),
Z('r_asys',3,'Почти ровно','Без сознания, пульса нет. Линия почти ровная, слегка плывёт. Что это?',[['Асистолия','Комплексов нет, линия лишь медленно колышется.'],['Отошёл электрод','При отсоединении линия была бы идеально прямой. Здесь она живая, слегка плывёт, а пациент без пульса.'],['Мелковолновая ФЖ','При ФЖ видны частые беспорядочные волны. Здесь только медленное колыхание.']],0,'Асистолия.','Асистолию можно перепутать с мелковолновой ФЖ и с отсоединением электрода.','Проверь подключение, увеличь усиление и посмотри во втором отведении. Решение принимай по пациенту и протоколу.'),
Z('r_stInf',3,'Всего два миллиметра','Боль за грудиной 40 минут. Отведение III. Что настораживает?',[['Ничего, это норма','ST поднят примерно на 2 мм и выпуклый. У человека с болью это не норма.'],['Подъём ST: подозрение на инфаркт нижней стенки','ST поднят примерно на 2 мм, выпуклый. Нужна полная ЭКГ: II, aVF и зеркальная депрессия в I, aVL.'],['Перикардит','При перикардите ST вогнутый, «улыбка», и изменения почти во всех отведениях. По одному отведению перикардит не ставят.']],1,'Ритм синусовый, ЧСС около 83 в минуту. Подъём ST в III около 2 мм. Подозрение на острый инфаркт нижней стенки, нужна ЭКГ в 12 отведениях.','Подъём невелик, а изолиния слегка плывёт, и его можно счесть помехой.','Меряй ST от уровня PQ в точке J. Смотри соседние отведения той же стенки и зеркало. При сомнении повтори ЭКГ через 15–30 минут.','III'),
Z('r_hyperT',3,'Подозрительно высокий T','Боль за грудиной 20 минут. Отведение V2, ST почти на линии. Есть ли тревожный признак?',[['Нет, ЭКГ нормальная','Обрати внимание на T: он очень высокий и широкий у основания, выше R.'],['Сверхострые T: возможен самый ранний инфаркт','Высокий T с широким основанием в первые минуты инфаркта может появиться раньше подъёма ST.'],['Гиперкалиемия','При гиперкалиемии T узкий, «палатка», обычно во многих отведениях. Здесь T широкий у основания, а боль началась внезапно.']],1,'Ритм синусовый. Высокие широкие T в V2: подозрение на сверхострую фазу инфаркта. Повторить ЭКГ через 15–30 минут, определить тропонин.','ST ещё не поднят, и ЭКГ выглядит почти нормальной.','Оценивай T вместе с QRS: T выше R и с широким основанием у человека с болью — тревожный знак. Повторяй ЭКГ.','V2'),
Z('r_hyperK',3,'Пропущенный диализ','Пациент на гемодиализе пропустил процедуру. Что на ленте?',[['Сверхострые T при инфаркте','Здесь T узкий и острый, «палатка», P почти исчез, а история с диализом подсказывает калий.'],['Гиперкалиемия','Узкие высокие T, сглаженный P, QRS начинает расширяться.'],['Норма','P почти не виден, а T выше R — это не норма.']],1,'Ритм синусовый, P сглажены. Высокие узкие T. Признаки гиперкалиемии: срочно калий крови.','Высокий T при калии похож на сверхострый T при инфаркте.','Калиевый T узкий и симметричный, виден во многих отведениях, и обычно есть подходящая история. Проверяй калий сразу.'),
Z('r_stDep',3,'Нагрузка и ST','Давящая боль при подъёме по лестнице. Отведение V5, ЧСС 100 в минуту. Что видно?',[['Норма','ST опущен горизонтально примерно на 1,5 мм. В V5 допустимо не больше 0,5 мм.'],['Горизонтальная депрессия ST: субэндокардиальная ишемия','ST опущен горизонтально, это признак ишемии.'],['Подъём ST','ST здесь ниже уровня PQ, а не выше.']],1,'Синусовая тахикардия около 100 в минуту. Горизонтальная депрессия ST в V5 около 1,5 мм — ишемия.','Дрожь и частый ритм делают депрессию менее заметной.','Меряй ST от уровня PQ. Горизонтальная или косонисходящая депрессия — повод думать об ишемии. Проверь, нет ли гипертрофии левого желудочка: при ней тоже бывает депрессия.','V5'),
