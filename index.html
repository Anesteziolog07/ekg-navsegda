const WHYQ={
'Какой цвет на левой ноге?':'Иди от правой руки по часовой стрелке: правая рука, левая рука, левая нога, правая нога. Цвета идут как на светофоре сверху вниз, а чёрный — корпус.',
'Где стоит V4?':'Найди угол Людовика, под ним второе ребро, отсчитай вниз до 5-го межреберья и веди к среднеключичной линии. От этой точки считают всё остальное.',
'Что рисует сегмент PQ?':'В это время импульс идёт через АВ-узел и пучок Гиса. Эти структуры слишком малы, чтобы дать видимый сигнал на коже.',
'СА-узел замолчал. Кто возьмёт ритм первым при здоровой системе?':'Чем ниже очаг, тем реже его собственная частота. АВ-соединение обычно даёт 40–60 ударов и узкий QRS.',
'Какие участки поражаются чаще всего?':'Правая ножка длинная и тонкая. Передняя ветвь левой ножки тонкая и зависит от одного источника кровоснабжения. Задняя получает кровь из двух бассейнов.',
'Что отражает подъём зубца P?':'Импульс рождается в правом предсердии, поэтому оно начинает возбуждаться первым и формирует начало зубца.',
'Что отражает зубец Q?':'Импульс идёт по пучку Гиса и разворачивается в перегородке, поэтому первый вектор направлен от большинства левых отведений.',
'PQ занимает 6 малых клеток при 25 мм/с. Что это значит?':'Норма до 5 клеток. Шесть значит лишнюю задержку в АВ-узле. Это АВ-блокада I степени.',
'Что входит в интервал QT?':'QT начинается с QRS и заканчивается концом T. Это вся электрическая систола желудочков, поэтому он важен при препаратах и электролитных нарушениях.',
'Что значит сегмент ST на изолинии?':'В это время все клетки желудочков находятся на плато потенциала действия, поэтому разности потенциалов почти нет.',
'Что проверить до анализа зубцов?':'Если скорость 50 мм/с, все длительности покажутся вдвое больше. Если вольтаж снижен, зубцы покажутся низкими. Поэтому сначала проверяем инструмент.',
'R-R 30 мм при 25 мм/с. Какая ЧСС?':'Делим 1500 на 30 и получаем 50. Это брадикардия.',
'R-R 30 мм при 50 мм/с. Какая ЧСС?':'При скорости 50 мм/с лента идёт вдвое быстрее, поэтому делим 3000 на 30.',
'Какие отведения смотрят на боковую стенку?':'I и aVL смотрят на верхне-боковую часть, V5 и V6 на нижне-боковую. Вместе это левая команда.',
'Что обязательно для синусового ритма?':'Частота может быть любой. Важен источник: P положительный во II, отрицательный в aVR, стоит перед каждым QRS и одной формы.',
'R в V1–V4 не растёт, вершина холма исчезла. О чём подумать?':'Плохая прогрессия R бывает при рубце передней стенки и при неверно поставленных электродах. Проверка электродов занимает секунду, поэтому начинай с неё.',
'Что общего у всех экстрасистол?':'Экстрасистола приходит раньше очередного синусового импульса. Отсюда короткий R-R перед ней, а форма P и QRS зависит от места очага.',
'Ранний узкий QRS без зубца P. Откуда?':'Импульс родился в АВ-узле и сразу пошёл вниз обычным путём, поэтому QRS узкий. Предсердия возбудились почти одновременно, поэтому P скрыт.',
'Частота 110, P перед каждым QRS, форма обычная. Что это?':'Источник на месте, просто чаще. Ищи причину в пациенте: боль, лихорадка, анемия, гиповолемия.',
'R-R плавно меняются вместе с дыханием, остальное в норме. Что это?':'На вдохе тонус вагуса падает и ЧСС растёт, на выдохе наоборот. Это вариант нормы, особенно у молодых.',
'Какие условия нужны для re-entry?':'Нужны два пути с разной скоростью и разным рефрактерным периодом. Тогда внеочередной импульс может пойти по кругу.',
'Узко, ровно, 190 в минуту, P не виден. Что это?':'QRS узкий значит импульс прошёл обычным путём. Ровный ритм и невидимый P типичны для тахикардии из АВ-соединения. Вместе с предсердной её называют наджелудочковой.',
'Можно ли по одной ленте отличить постоянную форму от пароксизмальной?':'Лента показывает один момент, а форма аритмии определяется течением: как часто, сколько длилось, проходит ли само.',
'Какая блокада опаснее?':'Мобитц 2 обычно лежит ниже АВ-узла, поэтому нижний водитель ненадёжен, и блокада может внезапно стать полной.',
'Почему СА-блокаду I степени нельзя увидеть?':'Первое, что видит ЭКГ, это возбуждение предсердий. Задержка внутри и сразу за СА-узлом до появления P не записывается.',
'Каждый второй P без QRS. Какой тип блокады?':'Чтобы отличить типы, надо сравнить PQ двух подряд проведённых комплексов. При 2 : 1 таких пар нет.',
'Что значит QRS 0,11 с с формой rsR′ в V1?':'Форма rsR′ показывает правую сторону, а ширина 0,10–0,12 с говорит, что блокада неполная.',
'Почему при блокаде ветви QRS почти не расширен?':'Ветви соединены сетью анастомозов. Импульс быстро обходит препятствие, поэтому меняется в основном направление, а не длительность.',
'Какая комбинация блокад самая частая?':'Это два самых ранимых участка проводящей системы. Сочетание называют двухпучковой блокадой.',
'ST вниз и T минус в V5–V6 при полной блокаде левой ножки. Что это?':'Когда возбуждение идёт необычным путём, реполяризация тоже меняется. Это вторичные изменения, но инфаркт на их фоне не исключён.',
'Какие признаки общие для гипертрофий?':'Больше мышцы значит сильнее вектор и выше зубцы. Сосуды отстают, поэтому внутренние слои голодают и меняются ST и T. Проводящие пути страдают, поэтому комплекс шире. Ось тянется к большей массе.',
'Почему при гипертрофии бывает депрессия ST?':'Кровь идёт в стенку снаружи внутрь. Когда стенка становится толще, а сосуды не успевают за ней, внутренний, субэндокардиальный слой получает меньше кислорода. Там возникает ишемия, и ST уходит вниз.',
'Почему ГПЖ видна поздно?':'Вектор левого желудочка намного больше. Пока правый желудочек не перевесит его, на ЭКГ его почти не видно.',
'Что такое P mitrale?':'Левое предсердие даёт конец P. Если оно увеличено, возбуждение затягивается, и зубец становится широким и двугорбым. Часто бывает при митральных пороках.',
'R V6 > R V5 > R V4. О чём это говорит?':'В норме самый высокий R стоит в V4. Если вершина сместилась к V6, значит левый желудочек стал мощнее и вектор сильнее тянется влево. Это один из признаков ГЛЖ.',
'Какая зона меняет только реполяризацию?':'Клетки при ишемии живые и возбуждаются нормально. Нарушено только восстановление, а его показывает T.',
'Подъём ST и отрицательный T. Что лежит под электродом?':'ST тянется к ране, значит рана рядом. T убегает от дыма, значит и ишемия рядом. Оба процесса лежат ближе к эпикарду.',
'Что значит Q патологический, ST вверх и T минус?':'Некроз уже сформирован, огонь ещё горит, но слабее, а вокруг дым. Такая смесь бывает в острую стадию.',
'Боль есть, ЭКГ нормальная. Инфаркт исключён?':'В первые часы ЭКГ может быть нормальной, а некоторые стенки обычные отведения не видят. Поэтому смотрят динамику ЭКГ и тропонин.',
'Подъём ST во II, III, aVF. Какая стенка?':'Это отведения снизу. Обычно здесь бассейн правой коронарной артерии, поэтому проверяют и правый желудочек.',
'Признаки в V1–V3. Какой инфаркт?':'V1–V2 смотрят на перегородку, V3 на переднюю стенку. Обычно это бассейн передней нисходящей артерии.',
'Признаки в V3–V4. Какой инфаркт?':'V3–V4 смотрят на переднюю стенку ближе к верхушке.',
'Признаки в I, aVL и всех V1–V6. Какой инфаркт?':'Захвачена большая зона, обычно это проксимальная окклюзия передней нисходящей артерии.',
'Почему задняя ишемия даёт высокий T в V1–V2?':'V1–V2 смотрят на заднюю стенку через всё сердце. То, что происходит там, выглядит наоборот.',
'Три признака WPW?':'Импульс обходит АВ-узел, поэтому PQ короткий. Часть желудочка возбуждается через мышцу, поэтому появляются дельта и широкий QRS.',
'Какой пучок при WPW?':'Пучок Кента связывает предсердие и желудочек напрямую, минуя АВ-узел.',
'Почему при LGL QRS нормальный?':'Пропущена только задержка. Желудочки возбуждаются обычным путём, поэтому QRS узкий.',
'Почему опасна ФП при WPW?':'АВ-узел обычно фильтрует импульсы. Пучок Кента этого не делает, поэтому ЧСС может стать очень высокой и перейти в ФЖ.',
'Какой QTc считается зоной высокого риска?':'Чем длиннее QTc, тем выше риск полиморфной ЖТ. Граница 0,50 с часто используется для решения о препаратах.',
'Самая частая находка при ТЭЛА?':'S1Q3T3 встречается реже, чем думают. Нормальная ЭКГ или обычная тахикардия ТЭЛА не исключают.',
'Что на ленте при пропущенном диализе?':'Широкий QRS, сливающийся с T, — поздняя стадия гиперкалиемии. Это неотложное состояние.'};

Object.assign(MORE,{
'Кто что видит':'Шесть отведений от конечностей смотрят на сердце во фронтальной плоскости, сверху, снизу и с боков. Шесть грудных смотрят в горизонтальной плоскости, как разрез вокруг грудной клетки. Вместе они дают трёхмерную картину.',
'Покрути электрическую ось':'Высота R в отведении — это проекция вектора на ось отведения. Поэтому ось определяют, сравнивая высоту зубцов. В норме вектор идёт вниз и влево, к верхушке, и сильнее всего совпадает с II отведением.',
'Откуда берутся тахикардии':'Рефрактерный период — время, когда клетка не может возбудиться заново. Круг возможен, только если импульс возвращается к началу пути, когда тот уже вышел из рефрактерности. Поэтому короткий рефрактерный период и медленное проведение делают re-entry вероятнее.',
'Лестница частот':'АВ-узел после каждого импульса какое-то время рефрактерен, поэтому пропускает ограниченное число импульсов. Предел разный у разных людей и зависит от тонуса и препаратов, поэтому 220 — только учебная цифра. Дополнительный пучок этому ограничению не подчиняется.',
'Три зоны инфаркта':'В реальном инфаркте зоны лежат друг вокруг друга: в центре некроз, вокруг повреждение, снаружи ишемия. Поэтому разные электроды над одной областью показывают разные признаки. Зона повреждения — главная цель лечения: её ещё можно спасти.',
'Как инфаркт идёт во времени':'Подъём ST появляется в первые минуты и обычно уходит за дни. Q формируется за часы. T отрицательный может держаться месяцами. Если подъём ST держится недели, думай об аневризме. Сроки у разных людей отличаются.',
'Карта инфарктов':'Признаки считаются значимыми, если они есть хотя бы в двух соседних отведениях одной группы. Поэтому сначала находим группу, а потом называем стенку.'});

MORE['Грудные электроды: этажи']='Рёбра считают от угла Людовика, выступа на грудине: рядом со вторым ребром. Смещение электрода на одно межреберье меняет форму комплекса и может имитировать патологию. У женщин электроды ставят под молочную железу, ориентируясь на те же линии.';

MORE['Как бежит возбуждение']='В покое клетка заряжена: внутри минус, снаружи плюс. Когда приходит импульс, ионы натрия входят внутрь, заряд меняется, и это деполяризация. Соседняя клетка получает толчок, и волна идёт дальше. Потом ионы возвращаются на места, это реполяризация. Пока этого не произошло, клетка не может ответить на новый импульс: это рефрактерный период.';

/* ---------- как запомнить: что запомнить, образ с картинкой, как запомнить по шагам, проверь себя ---------- */
/* w: строки разделены знаком |, строка с «• » становится пунктом списка */
const HOW={
'Путь импульса':{i:'hospital',o:'Сердце — это хирургическое отделение',f:'Порядок: СА-узел → предсердия → АВ-узел → пучок Гиса → правая и левая ножки → волокна Пуркинье.',w:'Представь отделение, где приказ всегда идёт сверху вниз по одной цепочке. Каждому звену проводящей системы соответствует свой человек или место.|• <b>СА-узел — заведующий.</b> Сидит наверху, в правом предсердии, и отдаёт приказ: «Работаем!»|• <b>Предсердия — ординаторская.</b> Приказ сначала слышат здесь. На ленте это зубец P.|• <b>АВ-узел — шлюз оперблока.</b> В операционную можно попасть только через него, и там все задерживаются: переодеться, помыть руки.|• <b>Пучок Гиса — коридор оперблока.</b> Ножки — две двери в операционные, правую и левую.|• <b>Волокна Пуркинье — бригада у стола.</b> Она и делает работу: желудочки сокращаются, на ленте QRS.|Дальше по курсу почти любая патология укладывается в эту картину: кто-то крикнул раньше заведующего, шлюз не пропускает или кто-то прошёл в обход шлюза.',d:'Закрой экран и пройди отделение вслух: заведующий → ординаторская → шлюз → коридор → две двери → бригада. Потом назови то же самое терминами.'},
'Как бежит возбуждение':{i:'books',o:'Ряд книг на полке',f:'Деполяризация — волна возбуждения. Реполяризация — восстановление. Рефрактерный период — время, когда клетку нельзя возбудить снова.',w:'Поставь на полку ряд книг и толкни первую. Дальше всё видно глазами.|• <b>Книги падают одна за другой</b> — волна возбуждения, деполяризация.|• <b>Упавшую книгу нельзя уронить второй раз</b>, сначала её надо поднять — рефрактерный период.|• <b>Книги поднимают обратно</b> — реполяризация.|• <b>Вынь книгу из ряда</b> — волна остановится. Это блокада.|• <b>Поставь книги по кругу</b> — волна побежит без конца. Это re-entry, причина многих тахикардий.|Отделение объясняет, кто командует, а полка — как бежит сама волна. Эти две картинки и есть весь курс.',d:'Объясни вслух на примере полки три слова: блокада, рефрактерный период, re-entry.'},
'Почему задаёт ритм СА-узел':{i:'doctor',o:'Заведующий, зам и дежурный',f:'Собственная частота импульсов в минуту: СА-узел 60–90, АВ-узел 40–60, желудочки 20–40.',w:'В отделении командует тот, кто выше по должности. Если его нет, командует следующий, но реже.|• <b>Заведующий — СА-узел: 60–90 в минуту.</b>|• <b>Зам — АВ-узел: 40–60 в минуту.</b> Командует, только если заведующий замолчал.|• <b>Дежурный ординатор — желудочки: 20–40 в минуту.</b> Последняя страховка.|Все числа складываются в одну цепочку: 90, 60, 40, 20. Каждый следующий начинает там, где закончил предыдущий. Чем ниже должность, тем реже команды. Ведёт тот, кто командует чаще всех: он успевает первым, и остальные просто подчиняются.',d:'Назови цепочку 90, 60, 40, 20. Скажи, кто командует при пульсе 50 в минуту с узким QRS (зам, АВ-узел) и при 30 в минуту с широким QRS (дежурный, желудочки).'},
'АВ-узел: зачем нужна задержка':{i:'soap',o:'В шлюзе оперблока моют руки',f:'Импульс задерживается в АВ-узле примерно на 0,08 с. На ленте это ровный сегмент PQ.',w:'Через шлюз в операционную нельзя пробежать: там переодеваются и моют руки. Пока бригада в шлюзе, в операционной тихо.|• На ленте это <b>ровная линия после P</b>, сегмент PQ.|• Длится она около <b>0,08 с</b>. Цифру не нужно учить отдельно: интервал PQ около 0,18 с минус зубец P 0,10 с = 0,08 с.|• <b>Зачем пауза:</b> предсердия успевают дожать кровь в желудочки, и только потом желудочки сокращаются.|• <b>Почему линия ровная:</b> АВ-узел крошечный, его ток на коже не виден.|Если шлюз работает медленно, пауза растёт: это АВ-блокада I степени. Если есть чёрный ход мимо шлюза, паузы нет: это WPW.',d:'Объясни вслух, почему после P ровная линия и что будет на ленте, если шлюз станет медленным.'},
'Пучок Гиса и ножки':{i:'door',o:'Коридор и две двери в операционные',f:'Правая ножка одна. Левая делится на переднюю и заднюю ветви. Чаще страдают правая ножка и передняя ветвь левой.',w:'После шлюза бригада идёт по коридору оперблока — это пучок Гиса в межжелудочковой перегородке. В конце коридора две двери.|• <b>Правая дверь — правая ножка.</b> Одностворчатая: правая ножка — прямое продолжение пучка.|• <b>Левая дверь двустворчатая — левая ножка.</b> Она сразу делится на переднюю и заднюю ветви. Логично: левый желудочек больше, ему нужны две линии.|• <b>Ломается то, что тоньше и длиннее:</b> правая ножка и передняя ветвь левой.|• <b>Задняя ветвь самая надёжная:</b> она толстая и снабжается кровью из двух артерий.',d:'Назови все три пути после коридора и скажи, какой ломается реже всех. Ответ: задняя ветвь левой ножки.'},
'Электроды на конечности':{i:'stoplight',o:'Светофор по часовой стрелке',f:'Правая рука — красный. Левая рука — жёлтый. Левая нога — зелёный. Правая нога — чёрный.',w:'Встань и вытяни руки. Начни с правой руки и обойди себя по часовой стрелке.|• <b>Правая рука — красный.</b> Проверка: Red и Right начинаются на R.|• <b>Левая рука — жёлтый.</b>|• <b>Левая нога — зелёный.</b>|• <b>Правая нога — чёрный.</b>|Первые три цвета идут как на светофоре: красный, жёлтый, зелёный. Чёрный — корпус светофора. Это заземление, на ЭКГ он не рисует ничего.',d:'Показывай на себе по часовой стрелке и называй цвета, пока не получится три раза подряд без паузы.'},
'Грудные электроды: этажи':{i:'ladder',o:'Два этажа и лестница между ними',f:'V1, V2 — 4-е межреберье у края грудины. V4 — 5-е межреберье, среднеключичная линия. V5, V6 — та же высота, передняя и средняя подмышечные линии. V3 — между V2 и V4.',w:'Думай о доме с двумя этажами.|• <b>4-й этаж:</b> по бокам от грудины живут V1 (справа) и V2 (слева).|• <b>5-й этаж:</b> влево от грудины живут V4, V5, V6. V4 — на среднеключичной линии, V5 и V6 — дальше на ту же высоту, к подмышке.|• <b>V3 стоит на лестнице</b> между этажами, ровно посередине между V2 и V4. Поэтому его ставят после V4: лестницу не найти, пока нет верхней и нижней площадки.|Цвета грудных: красный, жёлтый, зелёный — снова светофор, затем коричневый, чёрный, фиолетовый.',d:'Найди на себе 4-е межреберье и поставь пальцем все шесть точек по порядку: V1, V2, V4, V3, V5, V6.'},
'Главное правило ЭКГ':{i:'oncar',o:'Фары машины ночью на трассе',f:'Вектор идёт к электроду — зубец вверх. Уходит от электрода — зубец вниз. Идёт поперёк — зубец маленький или двухфазный.',w:'Электрод — это человек на обочине ночной трассы, а волна возбуждения — машина.|• <b>Машина едет к тебе</b> — фары растут в глазах. Зубец вверх.|• <b>Машина уезжает</b> — видны только красные огни, они уменьшаются. Зубец вниз.|• <b>Машина проезжает мимо</b> — сначала приближается, потом удаляется. Зубец двухфазный, вверх-вниз.|Поэтому одно и то же сердце в разных отведениях выглядит по-разному: зрители стоят в разных местах трассы.',d:'Объясни, почему в aVR почти всё отрицательное. Ответ: волна уходит от правого плеча вниз и влево, машина уезжает.'},
'Зубец P: два предсердия':{i:'aheart',o:'Правое — Первое',f:'Начало зубца P — правое предсердие, конец — левое. Норма P: до 0,10 с, до 2,5 мм.',w:'Заведующий сидит в правом предсердии, поэтому правое слышит приказ первым.|• <b>Две буквы П: Правое — Первое.</b> Оно рисует начало зубца P.|• <b>Левое подключается следом</b> и рисует конец зубца.|• <b>Норма:</b> P не шире половины большой клетки (0,10 с) и не выше двух с половиной малых (2,5 мм).|Польза на будущее: если перегружено правое, растёт начало, и P становится высоким и острым. Если левое, затягивается конец, и P становится широким, с двумя горбами.',d:'Нарисуй зубец P и подпиши, какая половина от какого предсердия.'},
'QRS: слово ПоВОрот':{i:'uturn',o:'Импульс делает поворот',f:'Q — перегородка. R — верхушка. S — основание сердца.',w:'Проведи пальцем по сердцу так, как идёт импульс в желудочках. Получится маршрут с разворотом.|• <b>П — Перегородка:</b> начало, маленький зубец Q.|• <b>В — Верхушка:</b> главная масса мышцы, большой зубец R.|• <b>О — Основание:</b> разворот наверх, зубец S.|В слове ПоВОрот заглавными стоят именно эти буквы, и идут они в том же порядке, что Q, R и S.',d:'Нарисуй сердце и стрелками покажи три вектора: перегородка, верхушка, основание. Подпиши Q, R, S.'},
'ST и T: уборка':{i:'books',o:'Книги упали, лежат, их поднимают',f:'ST — момент равновесия, линия ровная. T — реполяризация желудочков.',w:'Вернись к ряду книг на полке.|• <b>QRS — книги падают.</b> Желудочки возбуждаются.|• <b>ST — все книги лежат.</b> Ничего не движется, поэтому линия ровная.|• <b>T — книги поднимают обратно.</b> Это восстановление, реполяризация.|Отсюда понятно, почему ST и T первыми страдают при ишемии. Поднимать книги тяжелее, чем ронять, на это нужна энергия. Нет кислорода — первым страдает восстановление.',d:'Покажи на ленте, где книги падают, где лежат и где их поднимают.'},
'Интервал или сегмент':{i:'ruler',o:'В интервале зубец внутри',f:'Сегмент — только ровная линия. Интервал — зубец вместе с линией.',w:'Два слова путают все, поэтому разведи их по смыслу.|• <b>Сегмент — отрезок линии.</b> Как в геометрии: только прямая, без зубцов.|• <b>Интервал — промежуток времени</b> от начала одного события до начала другого. Подсказка по буквам: в ИНтервале зубец ВНутри.|• Поэтому <b>интервал PQ</b> берёт в себя зубец P и линию после него, а <b>сегмент PQ</b> — только линию.|Вывод: интервал всегда длиннее сегмента с тем же названием.',d:'Покажи на ленте сегмент PQ и интервал PQ, потом сегмент ST и интервал QT.'},
'Смотри в клетки, а не в секунды':{i:'stopwatch',o:'Одна большая клетка — 0,2 секунды',f:'При 25 мм/с: малая клетка 0,04 с, большая 0,2 с. P и QRS до 0,10 с. PQ 0,12–0,20 с. QT 0,35–0,44 с.',w:'Секунды на ленте не видны, а клетки видны всегда. Поэтому переведи нормы в клетки один раз.|• <b>За 1 секунду лента проходит 5 больших клеток.</b> Значит, большая клетка — 0,2 с, малая — 0,04 с.|• <b>Половина большой клетки:</b> P и QRS, до 0,10 с.|• <b>Целая большая клетка:</b> верхняя граница PQ, 0,20 с.|• <b>Чуть больше двух больших клеток:</b> QT, до 0,44 с.|• <b>Три малые клетки, 0,12 с:</b> и нижняя граница PQ, и начало широкого QRS. Одно число работает дважды.',d:'Возьми любую ленту и без калькулятора скажи: QRS узкий или широкий, PQ в норме или нет.'},
'Сначала паспорт ленты':{i:'calendar',o:'Дата 25.10.12',f:'Стандарт: скорость 25 мм/с, вольтаж 10 мм/мВ, 12 отведений.',w:'Перед тем как читать ленту, проверь её паспорт. Запомни его как дату: 25.10.12.|• <b>25 мм/с</b> — скорость. Значит, 5 больших клеток в секунду. Бывает и 50 мм/с: тогда всё вдвое шире, и клетки стоят вдвое меньше времени.|• <b>10 мм/мВ</b> — вольтаж. Прямоугольная метка в начале записи высотой две большие клетки.|• <b>12 отведений</b> — шесть от конечностей и шесть грудных.|Если скорость или метка другие, все зубцы на ленте будут обманывать. Поэтому паспорт всегда первым.',d:'Открой любую ЭКГ и найди на ней эти три числа, прежде чем смотреть на зубцы.'},
'РЫЧАГ на ОСИ':{i:'clipboard',o:'Чек-лист: РЫтм, ЧАстота, ОСь',f:'Порядок: ритм, ЧСС, ось, затем P, QRS, ST, T и интервалы.',w:'Как пилот перед взлётом проходит чек-лист, так и ЭКГ читают всегда в одном порядке.|• <b>РЫ — ритм:</b> ровный ли и синусовый ли.|• <b>ЧА — частота:</b> сколько в минуту.|• <b>ОСИ — ось.</b> Рычаг всегда крепится на оси, отсюда фраза «рычаг на оси».|• <b>Дальше комплекс слева направо:</b> P, QRS, ST, T, интервалы.|Порядок логичен: сначала понять, срочно ли (ритм и частота), потом где искать (ось), и только потом детали. Сразу прыгать к ST нельзя: при широком QRS он читается иначе.',d:'Возьми ленту и вслух пройди по шагам, не пропуская ни одного.'},
'ЧСС за три секунды':{i:'abacus',o:'300 делим на число клеток',f:'ЧСС в минуту = 300 / число больших клеток между R. Или 1500 / R-R в мм при 25 мм/с.',w:'Ряд 300, 150, 100, 75, 60, 50 не надо зубрить, его можно получить за секунду.|• <b>В минуте 60 секунд</b>, в каждой 5 больших клеток. Всего 300 клеток в минуту.|• <b>Одна клетка между R</b> — 300 в минуту. Две — 150. Три — 100. Четыре — 75. Пять — 60. Шесть — 50.|• Ты просто делишь 300 на 1, 2, 3, 4, 5, 6.|• <b>Если ритм неровный,</b> посчитай комплексы за 6 секунд (30 больших клеток) и умножь на 10.',d:'Поставь палец на R, переходи по большим клеткам до следующего R и говори 300, 150, 100, 75 на каждой.'},
'Синусовый ли ритм':{i:'compass',o:'Во II да, в aVR нет',f:'P положительный во II, отрицательный в aVR, стоит перед каждым QRS, одной формы.',w:'Заведующий сидит наверху справа, поэтому его приказ идёт вниз и влево. Дальше работает правило фар.|• <b>Во II отведении</b> волна едет прямо к электроду. P вверх.|• <b>В aVR</b> волна уезжает от правой руки. P вниз.|• <b>P стоит перед каждым QRS и одинаковый</b> — значит, командует всё время один и тот же заведующий.|Частота тут ни при чём: синусовый ритм бывает и 40, и 150 в минуту. Коротко: во II да, в aVR нет.',d:'Найди на ленте II и aVR и скажи по зубцу P, откуда идёт импульс.'},
'Кто что видит':{i:'eyes',o:'Электрод видит то, что под ним',f:'II, III, aVF — низ. I, aVL, V5, V6 — левый бок. V1, V2 — правые отделы и перегородка. V3, V4 — передняя стенка и верхушка.',w:'Таблицу учить не нужно. Каждый электрод — глаз, и он видит то, что прямо перед ним.|• <b>II, III, aVF</b> связаны с левой ногой — смотрят снизу.|• <b>I и aVL</b> связаны с левой рукой — смотрят на левый бок.|• <b>Грудные</b> видят то, что под ними. Положи ладонь на грудь и веди от грудины влево: V1 и V2 над правыми отделами и перегородкой, V3 и V4 над передней стенкой и верхушкой, V5 и V6 на левом боку.',d:'Положи ладонь на грудь и назови, что лежит под каждым грудным электродом.'},
'Две команды отведений':{i:'scale',o:'Левая команда против правой',f:'Левая команда: I, aVL, V5, V6. Правая команда: III, aVF, V1, V2.',w:'Отведения делятся на две команды, которые стоят друг напротив друга.|• <b>Левая команда: I, aVL, V5, V6.</b> V5 и V6 лежат на левом боку, I и aVL смотрят с левой руки. В названии aVL буква L — Left.|• <b>Правая команда: III, aVF, V1, V2.</b> V1 и V2 ближе всего к правому желудочку.|• <b>Команды зеркальны:</b> когда одна показывает подъём, другая — спуск.|Поэтому при блокадах ножек и гипертрофиях картина в V1 и V6 противоположная, как на весах.',d:'Закрой экран и перечисли обе команды.'},
'Покрути электрическую ось':{i:'magnet',o:'Мышца притягивает ось, как магнит',f:'Ось — суммарное направление возбуждения. В норме она идёт вниз и влево.',w:'Ось — это сумма всех векторов возбуждения. Проще думать о ней как о стрелке, которую притягивает мышца.|• <b>В норме</b> больше всего мышцы в левом желудочке, поэтому ось смотрит вниз и влево.|• <b>Мышцы стало больше</b> (гипертрофия) — ось тянется к ней.|• <b>Появился рубец</b> — ось уходит от него: мёртвая ткань не притягивает.|• <b>Блокада ветви</b> — ось уходит туда, куда импульс приходит последним.|Так ось подсказывает, где искать проблему.',d:'Поставь ползунок на «вправо» и назови причину, которая могла бы это дать. Например, гипертрофия правого желудочка.'},
'Ось за секунду':{i:'numbers',o:'Счёт 1-2-3 и обратный отсчёт 3-2-1',f:'Нормальная: R во II выше, чем в I, а в I выше, чем в III. Влево: I > II > III. Вправо: III > II > I.',w:'Сравни высоту R в отведениях I, II и III и назови их по убыванию.|• <b>Влево: I > II > III.</b> Прямой счёт 1, 2, 3. Выше всех I — левая рука.|• <b>Вправо: III > II > I.</b> Обратный отсчёт 3, 2, 1.|• <b>Норма: II > I > III.</b> Двойка вырвалась вперёд.|• <b>Способ карандаша из книги:</b> приложи тупой конец карандаша к углу ленты, а острый направь на самый высокий R. Карандаш лежит наклонно — норма, лёг горизонтально — ось влево, встал круче — ось вправо.|Если R везде примерно одинаковые, ось считают точно, по углу.',d:'На любой ленте сравни R в I, II, III и назови порядок цифрами.'},
'Прогулка по комплексу':{i:'magnifier',o:'Пять вопросов слева направо',f:'P до 0,10 с и до 2,5 мм. QRS до 0,10 с, Q меньше ¼ R. ST на изолинии (допустимо до 0,5 мм вниз в V5–V6 и до 2 мм вверх в V1–V2). PQ 0,12–0,20 с. QT 0,35–0,44 с.',w:'Читай комплекс как строчку в книге: слева направо, каждое слово. На каждый элемент один вопрос.|• <b>P:</b> откуда импульс, нормальной ли он высоты и ширины.|• <b>QRS:</b> узкий ли, нет ли глубокого Q (больше четверти R).|• <b>ST:</b> на линии ли. Чуть вниз в V5–V6 и чуть вверх в V1–V2 — допустимо.|• <b>T:</b> смотрит ли туда же, куда QRS.|• <b>Интервалы:</b> не короткий ли PQ, не длинный ли QT.|Пять вопросов в одном порядке работают как чек-лист: ничего не пропустишь.',d:'Прочитай любую ленту вслух по этим пяти вопросам.'},
'Холм в грудных отведениях':{i:'mountain',o:'Вершина горы на V4',f:'R растёт от V1 к V4, потом снижается. S наоборот уменьшается.',w:'Представь, что идёшь по грудным отведениям в гору и с горы.|• <b>V1</b> смотрит на тонкий правый желудочек — R маленький, подножие.|• <b>V2, V3</b> — подъём: под электродом всё больше мышцы.|• <b>V4 — вершина:</b> прямо под ней верхушка сердца, R самый высокий.|• <b>V5, V6</b> — спуск: электрод уходит вбок.|Вершина сползла к V5–V6 — думай о гипертрофии левого желудочка. Холма нет, R не растёт — думай о рубце передней стенки.',d:'На ленте найди, где R выше всего. Если не в V4 или рядом, объясни почему.'},
'Синусовые аритмии':{i:'sloth',o:'Тахометр и ленивец-брадипод',f:'Тахикардия — больше 90 в минуту. Брадикардия — меньше 60 в минуту. Командует заведующий.',w:'Здесь командует сам заведующий, просто темп другой. Слова греческие, и их легко связать с жизнью.|• <b>Тахи — быстрый.</b> В машине тахометр показывает обороты. Синусовая тахикардия — больше 90 в минуту.|• <b>Бради — медленный.</b> Научное название ленивца — брадипод. Синусовая брадикардия — меньше 60 в минуту.|• <b>Дыхательная аритмия — норма:</b> на вдохе ритм чаще, на выдохе реже.|Два числа, 60 и 90, — нижняя и верхняя отметка нормы. P при этом обычный, синусовый.',d:'Посчитай свой пульс на вдохе и на выдохе. Заметишь разницу сам.'},
'Экстрасистола':{i:'speaker',o:'Кто-то крикнул раньше заведующего',f:'R-R перед ней короче. Предсердная: P другой, QRS узкий. Из АВ-узла: P нет, QRS узкий. Желудочковая: P нет, QRS шире 0,12 с.',w:'Экстрасистола — внеочередной приказ: кто-то крикнул «Работаем!» раньше заведующего. По виду бригады сразу понятно, откуда крик.|• <b>Из предсердия.</b> Приказ прошёл через шлюз и коридор как обычно — <b>QRS узкий</b>. Но P другой формы: кричал не заведующий.|• <b>Из АВ-узла.</b> Крикнули прямо в шлюзе — <b>P нет, QRS узкий</b>.|• <b>Из желудочка.</b> Кто-то влез в операционную через окно, мимо коридора. Бригада узнаёт новость по цепочке, от человека к человеку, медленно — <b>QRS широкий, больше 0,12 с, уродливый</b>, P нет.|Общее у всех: приказ пришёл раньше срока, поэтому R-R перед ним короче.',d:'Открой любую экстрасистолу и задай три вопроса: рано ли, какой P, какой QRS.'},
'Где очаг в предсердии':{i:'updown',o:'Очаг сверху — P вверх, снизу — вниз',f:'Очаг вверху — P положительный. В середине — двухфазный. Внизу — отрицательный.',w:'Это снова правило фар. Электрод II смотрит на предсердия снизу.|• <b>Очаг вверху</b> отправляет волну вниз, к электроду. P вверх.|• <b>Очаг внизу</b> отправляет волну вверх, от электрода. P вниз.|• <b>Очаг посередине</b> шлёт волну в обе стороны. P двухфазный.|Запоминать нечего: достаточно мысленно провести стрелку от очага.',d:'Нарисуй предсердие, поставь точку очага и предскажи форму P.'},
'Как они ходят':{i:'muscle',o:'Бицепс и трицепс',f:'Бигеминия: чередование 1 : 1. Тригеминия: экстрасистола после двух нормальных комплексов. Парные: две подряд. Политопные: из разных очагов.',w:'Экстрасистолы иногда ходят по расписанию. Названия подсказывают число ударов в повторяющемся цикле.|• <b>Бигеминия — как бицепс</b>, две головки. Цикл из двух: нормальный, экстрасистола.|• <b>Тригеминия — как трицепс</b>, три головки. Цикл из трёх: два нормальных, экстрасистола.|• <b>Парные</b> — две экстрасистолы подряд, как пара обуви.|• <b>Политопные</b> — поли значит много, топос значит место. Очагов несколько, поэтому экстрасистолы разной формы.|Три и больше желудочковых подряд — это уже пробежка желудочковой тахикардии.',d:'Простучи пальцем: нормальный, ранний, нормальный, ранний. Это бигеминия. Потом: нормальный, нормальный, ранний. Это тригеминия.'},
'Откуда берутся тахикардии':{i:'repeat',o:'Книги, поставленные по кругу',f:'Re-entry — импульс ходит по кругу. Нужны два пути с разной скоростью и разным рефрактерным периодом.',w:'Поставь книги на столе по кругу и толкни одну.|• <b>Волна обходит круг</b>, а за это время первые книги успевают подняться. Волна идёт на новый круг.|• <b>Если круг короткий</b>, волна упрётся в ещё лежащие книги и остановится.|• Поэтому кольцу нужен <b>медленный участок</b>: он даёт остальным время восстановиться.|• Каждый круг — новый приказ. Кольцо командует вместо заведующего, и часто.|Re-entry буквально значит «повторный вход». Второй механизм тахикардий — <b>патологический автоматизм</b>: просто появился чужой очаг, который командует чаще заведующего.',d:'Объясни вслух, зачем в круге нужен медленный участок.'},
'Лестница частот':{i:'ladder',o:'Двести, триста, четыреста с лишним',f:'В минуту: предсердная тахикардия 120–220, трепетание предсердий 240–340, фибрилляция предсердий 350–600.',w:'Три ступени лестницы считай сотнями: двести, триста, четыреста с лишним. Чем хаотичнее, тем чаще.|• <b>Предсердная тахикардия: 120–220.</b> Один чужой очаг.|• <b>Трепетание предсердий: 240–340</b>, обычно около 300. Один большой круг, ровная пила.|• <b>Фибрилляция предсердий: 350–600.</b> Множество мелких волн, рябь.|Шлюз оперблока работает фильтром. Примерно до 220 в минуту он пропускает всех, дальше QRS достаётся не каждому приказу. Поэтому желудочки при трепетании и фибрилляции бьются реже предсердий.',d:'Закрой экран и назови три ступени с частотами в минуту.'},
'Три вопроса к любой тахикардии':{i:'stethoscope',o:'Три взгляда врача приёмного отделения',f:'Три вопроса: какой QRS, какие R-R, что вместо P.',w:'Тахикардии не надо узнавать по картинке. Задай три вопроса по порядку, и ответ сложится сам.|• <b>Какой QRS?</b> Узкий — приказ прошёл через шлюз, очаг выше желудочков. Широкий — тревога: желудочковая тахикардия, пока не доказано другое.|• <b>Какие R-R?</b> Приложи край бумаги к трём зубцам R. Ровные или все разные.|• <b>Что вместо P?</b> Обычный P, другой P, пила, рябь или ничего.|Три ответа дают диагноз. Например: узкий, все R-R разные, рябь — фибрилляция предсердий.',d:'Открой ленту в разделе «Игра» и задай три вопроса, прежде чем нажимать ответ.'},
'Узкие тахикардии':{i:'megaphone',o:'Один мегафон или кричащая толпа',f:'Трепетание: пила F, ровно. Фибрилляция (мерцательная аритмия): рябь f, все R-R разные. Предсердная: другой P. АВ-тахикардия: P не видно.',w:'QRS узкий — значит, приказы проходят через шлюз. Разница в том, кто и как кричит в ординаторской.|• <b>Трепетание предсердий — один человек с мегафоном.</b> Кричит ровно, около 300 раз в минуту. На ленте одинаковые зубья пилы, волны F. Шлюз пропускает каждый второй или третий приказ, поэтому ритм ровный.|• <b>Фибрилляция предсердий — толпа, где все кричат вразнобой.</b> На ленте мелкая рябь f, P нет. Шлюз пропускает приказы как попало: все R-R разные. Старое название — мерцательная аритмия.|• <b>Предсердная тахикардия</b> — командует не заведующий, а другой врач: P есть, но другой формы.|• <b>АВ-тахикардия</b> — кричат прямо из шлюза: P не видно.|Ловушка: ровно около 150 в минуту — поищи скрытую пилу, это может быть трепетание 2 : 1.',d:'На ленте фибрилляции приложи край бумаги к трём R-R и убедись, что они разные.'},
'Широкие: тут счёт на минуты':{i:'ambulance',o:'Лестница вниз к остановке сердца',f:'Желудочковая тахикардия: широкие одинаковые QRS, ровные R-R, больше 100 в минуту. Трепетание желудочков: синусоида. Фибрилляция желудочков: хаос без комплексов.',w:'Широкий частый ритм — значит, командуют сами желудочки, мимо шлюза. Смотри, как разваливается порядок. Это три ступени вниз.|• <b>Желудочковая тахикардия:</b> комплексы широкие, но ещё различимы и одинаковы.|• <b>Трепетание желудочков:</b> комплексы слились в ровную синусоиду, примерно 250–350 в минуту.|• <b>Фибрилляция желудочков:</b> от комплексов не осталось ничего, беспорядочные волны. Кровообращение остановлено.|Первый шаг всегда один: посмотри на пациента. Хаос на мониторе у человека, который с тобой разговаривает, — это артефакт, а не фибрилляция.',d:'Расставь по порядку от лучшего к худшему: фибрилляция желудочков, желудочковая тахикардия, трепетание желудочков.'},
'Степени всегда одни и те же':{i:'lock',o:'Шлюз медленный, капризный, запертый',f:'I степень — задержка. II степень — часть импульсов теряется. III степень — не проходит ни один.',w:'Блокада — это шлюз, который плохо пропускает. Степени одинаковы для любого шлюза: и для двери кабинета заведующего (СА-блокада), и для шлюза оперблока (АВ-блокада).|• <b>I степень — шлюз медленный.</b> Проходят все, но с задержкой.|• <b>II степень — шлюз иногда не пускает.</b> Часть приказов теряется.|• <b>III степень — шлюз заперт.</b> Не проходит никто. Работу ниже берёт на себя зам или дежурный со своим редким ритмом.|Римская цифра растёт вместе с бедой: задержка, потеря части, потеря всех.',d:'Опиши три степени своими словами, не глядя на экран.'},
'Главное отличие':{i:'envelope',o:'Приказ не вышел из кабинета или застрял в шлюзе',f:'СА-блокада: выпадает весь цикл вместе с P. АВ-блокада: P остаётся, выпадает только QRS.',w:'Зубец P — знак, что приказ вышел из кабинета заведующего и дошёл до ординаторской.|• <b>СА-блокада:</b> приказ не вышел из кабинета. Нет ни P, ни QRS — выпадает весь цикл.|• <b>АВ-блокада:</b> приказ вышел (P есть), но застрял в шлюзе. Выпадает только QRS.|Отсюда правило: в любой паузе первым делом ищи P. Он может прятаться на зубце T, поэтому смотри, не стал ли этот T горбатым или острее соседних.',d:'Найди паузу на ленте и скажи, есть ли в ней P. Назови блокаду.'},
'АВ-блокады':{i:'soap',o:'Санитар в шлюзе оперблока',f:'I степень: PQ больше 0,20 с. Мобитц 1: PQ растёт, потом выпал QRS. Мобитц 2: PQ постоянный, QRS выпал внезапно. III степень: P и QRS не связаны.',w:'Представь санитара, который пропускает бригаду через шлюз.|• <b>I степень — санитар медлительный.</b> Пускает всех, но долго: PQ больше 0,20 с, то есть больше одной большой клетки.|• <b>Мобитц 1 (Венкебах) — санитар устаёт.</b> С каждым разом пускает медленнее (PQ растёт), потом одного не пускает, отдыхает и начинает снова.|• <b>Мобитц 2 — дверь внезапно захлопывается.</b> PQ всё время одинаковый, и вдруг QRS выпал без предупреждения. Это опаснее: может перейти в полную блокаду.|• <b>III степень — шлюз заперт.</b> Предсердия работают по приказу заведующего, желудочки — по своему дежурному. P и QRS живут каждый своей жизнью.|Для ритма можно прочитать вслух:|<i>PQ длинный, все дошли — первая, не торопись.<br>Дольше, дольше, дольше — нет: Венкебах даёт ответ.<br>Ровно, ровно — и провал: Мобитц два тебя застал.<br>P и R живут вразброд: третья, полный это блок.</i>',d:'Простучи пальцем по столу: тук, тук-тук, тук-тук-тук, пауза. Это Мобитц 1. Потом ровно: тук, тук, тук, пауза. Это Мобитц 2.'},
'Если выпал каждый второй':{i:'question',o:'Сравнить не с чем',f:'При блокаде 2 : 1 тип по ленте не определить.',w:'Чтобы понять, устаёт санитар или дверь захлопывается внезапно, нужно сравнить два PQ подряд.|• <b>При 2 : 1</b> перед каждой паузой только один проведённый удар. Сравнивать не с чем.|• <b>Подсказка по ширине:</b> узкий QRS чаще значит уровень АВ-узла, широкий — уровень ниже, это опаснее.|• <b>Запись подлиннее</b> иногда показывает участок 3 : 2, и тип становится виден.',d:'Объясни другу в двух предложениях, почему при 2 : 1 нельзя назвать тип.'},
'СА-блокады':{i:'door',o:'Приказ застрял в кабинете заведующего',f:'Тип 1: R-R перед паузой укорачиваются, пауза меньше 2 R-R. Тип 2: пауза ровно 2 R-R, если выпал один цикл. I степень на ЭКГ не видна.',w:'При СА-блокаде заведующий отдаёт приказы, но не каждый выходит из его кабинета.|• <b>I степень</b> — приказ выходит с задержкой внутри кабинета. Снаружи ничего не видно, на обычной ЭКГ она не определяется.|• <b>II степень, тип 2.</b> Заведующий продолжает считать в своём ритме, просто один приказ пропал. Следующий придёт вовремя, поэтому пауза <b>ровно 2 R-R</b>. Цифра в названии совпадает с паузой.|• <b>II степень, тип 1.</b> Выход из кабинета замедляется постепенно: R-R перед паузой укорачиваются, а пауза <b>меньше двух R-R</b>.|• <b>III степень</b> — кабинет заперт. P нет совсем, командует зам или дежурный.|Если пауза не кратна R-R, думай об остановке синусового узла.',d:'Измерь на ленте обычный R-R и паузу. Подели одно на другое и назови тип.'},
'Если СА-узел молчит':{i:'buoy',o:'Спасательный круг: ниже должность — реже команды',f:'Ритм берёт нижний очаг: АВ-узел 40–60 в минуту, узкий QRS. Желудочки 20–40 в минуту, широкий QRS.',w:'Заведующий замолчал — отделение не останавливается. Команду берёт тот, кто ниже.|• <b>Зам, АВ-узел: 40–60 в минуту.</b> Приказ рождается в шлюзе, дальше идёт по коридору — QRS узкий.|• <b>Дежурный, желудочки: 20–40 в минуту.</b> Приказ рождается в операционной, мимо коридора — QRS широкий.|• Такой комплекс называют <b>выскальзывающим</b>. Он приходит поздно, после паузы, а не рано.|Главное отличие от экстрасистолы: экстрасистола спешит, а выскальзывающий комплекс страхует, как спасательный круг. Подавлять его нельзя.',d:'Скажи, чем выскальзывающий комплекс отличается от экстрасистолы по времени.'},
'Почему QRS становится широким':{i:'lock',o:'Одна дверь заперта — идут через соседнюю',f:'Блокада ножки: QRS шире, конец комплекса показывает на больную сторону.',w:'Вернись к двум дверям в операционные.|• В норме бригада входит в обе операционные одновременно: QRS узкий.|• <b>Одна дверь заперта</b> (блокада ножки). В эту операционную бригада идёт через соседнюю и прямо сквозь стену, то есть по мышце, а не по проводящим путям. Это долго.|• Поэтому <b>QRS шире</b>: желудочки возбуждаются не одновременно.|• <b>Опоздавший желудочек рисует конец QRS.</b> Куда смотрит конец комплекса, там и заблокированная сторона.',d:'Посмотри на конец QRS в V1 и назови сторону блокады.'},
'Буква М живёт там, где блокада':{i:'rabbit',o:'WiLLiaM и MaRRoW',f:'Правая ножка: rsR′ в V1, широкий S в V6. Левая ножка: широкий R в V5–V6, глубокий S в V1.',w:'За рубежом форму блокад учат двумя английскими именами. Первая буква — форма QRS в V1, последняя — в V6.|• <b>WiLLiaM</b> — внутри LL, Left: блокада левой ножки. В V1 похоже на W, в V6 на M.|• <b>MaRRoW</b> — внутри RR, Right: блокада правой ножки. В V1 похоже на M, в V6 на W.|• Буква М при правой блокаде в V1 похожа на <b>заячьи уши</b>: два зубца R, второй выше.|Коротко: буква М стоит в том отведении, которое смотрит на больную сторону.',d:'Выпиши оба слова и подпиши под первой буквой V1, под последней V6.'},
'Поворотник в V1':{i:'car',o:'Рычаг поворотника в машине',f:'Конец QRS в V1 вверх — правая ножка. Вниз — левая ножка.',w:'Быстрая проверка, если форма комплекса неясна.|• В машине <b>рычаг поворотника вверх — направо</b>, вниз — налево.|• Посмотри на конец широкого QRS в V1 как на этот рычаг.|• <b>Вверх — блокада правой ножки.</b> Правый желудочек ближе к V1, его опоздание рисует подъём.|• <b>Вниз — блокада левой ножки.</b> Левый дальше, его опоздание уходит вниз.|Работает только при широком QRS.',d:'Покажи рукой поворотник и назови блокаду на двух лентах из этой темы.'},
'Полная или неполная':{i:'ruler',o:'Три малые клетки',f:'Неполная: QRS 0,10–0,12 с. Полная: QRS больше 0,12 с.',w:'Новая цифра не нужна.|• <b>0,12 с — три малые клетки.</b> С этой ширины QRS считается широким.|• <b>Форма показывает сторону</b>, а ширина — степень: меньше трёх клеток — неполная, больше — полная.|• <b>Предупреждение:</b> при полной блокаде ST и T меняются вторично, против конца QRS. Они могут скрыть инфаркт.|Новая блокада левой ножки у человека с болью за грудиной — повод думать об инфаркте.',d:'Посчитай ширину QRS в малых клетках на ленте блокады.'},
'Ветви левой ножки':{i:'compass',o:'Передняя — влево вверх, задняя — вправо вниз',f:'Передняя ветвь: ось ≤ −60° (в зарубежных критериях от −45°), S больше R во II, III, aVF. Задняя ветвь: ось ≥ +120°, S больше R в I, aVL.',w:'Помни левую двустворчатую дверь. Если одна створка закрыта, ось уходит туда, куда импульс приходит последним.|• <b>Передняя ветвь</b> питает верхне-боковую часть. Её блокада тянет ось вверх и влево: резко влево, −60° и дальше. Внизу (II, III, aVF) S глубже R.|• <b>Задняя ветвь</b> питает нижнюю часть. Её блокада тянет ось вниз и вправо: +120° и дальше. Слева (I, aVL) S глубже R.|• <b>QRS при этом почти не расширяется:</b> между ветвями много обходных мостиков, импульс быстро обегает препятствие.|• Для памяти: когда машина едет задним ходом, водитель смотрит через правое плечо. Задняя — вправо, значит, передняя — влево.|Задняя блокируется редко, она самая надёжная. Сначала исключи гипертрофию правого желудочка.',d:'Ось −70°. Скажи, какая ветвь и в каких отведениях S больше R.'},
'Перекачанная мышца':{i:'muscle',o:'Громче, голоднее, медленнее, тянет',f:'Признаки гипертрофии: выше зубцы, ST вниз, шире комплекс, ось в сторону гипертрофии.',w:'Представь спортсмена, который нарастил мышцы, а сосуды за ними не успели. Четыре слова — четыре признака.|• <b>Громче:</b> больше мышцы — сильнее сигнал, зубцы выше.|• <b>Голоднее:</b> кровь идёт снаружи внутрь и не дотягивается до глубоких слоёв. ST вниз, T отрицательный.|• <b>Медленнее:</b> возбуждению дольше идти по толстой стенке. Комплекс шире.|• <b>Тянет:</b> самая большая мышца притягивает ось.',d:'Назови четыре слова и к каждому покажи изменение на ленте.'},
'Предсердия: пик или верблюд':{i:'camel2',o:'Горный пик и двугорбый верблюд',f:'P pulmonale: правое предсердие, высокий острый, больше 2,5 мм. P mitrale: левое предсердие, двугорбый, шире 0,10 с.',w:'Вспомни: правое предсердие рисует начало P, левое — конец.|• <b>Правое увеличено — пик.</b> Начало просто растёт вверх: высокий острый P, выше 2,5 мм. Чаще всего правое сердце перегружено из-за лёгких, отсюда название <b>P pulmonale</b>, «лёгочный».|• <b>Левое увеличено — двугорбый верблюд.</b> Конец опаздывает, появляется второй горб: P широкий, больше 0,10 с, похож на букву М. Классическая причина — митральный порок, отсюда <b>P mitrale</b>. Митральный и М-образный начинаются на одну букву.',d:'Нарисуй оба зубца и подпиши, где какое предсердие.'},
'Левый желудочек':{i:'seven',o:'Семь больших клеток',f:'Индекс Соколова–Лайона: S в V1 + R в V5 или V6 ≥ 35 мм. Признак: R в V6 > R в V5 > R в V4.',w:'Главный критерий удобно считать клетками.|• <b>35 мм — это семь больших клеток.</b>|• Возьми глубину S в V1 и прибавь высоту R в V5 или V6, там, где он выше.|• Дошло до семи больших клеток — думай о гипертрофии левого желудочка.|• Ещё признак: вершина холма сползла, и R в V6 выше, чем в V5 и V4.|Такая же семёрка есть у правого желудочка, только в малых клетках: семь больших слева, семь малых справа.',d:'Сложи S в V1 и R в V5 на ленте из этой темы и переведи в большие клетки.'},
'Правый желудочек':{i:'magnifier',o:'Семь малых клеток в V1',f:'Гипертрофия правого желудочка: R в V1 больше 7 мм. R в V1 + S в V5 или V6 больше 10,5 мм.',w:'Вторая семёрка: семь малых клеток в V1.|• <b>R в V1 больше 7 мм</b> — повод думать о гипертрофии правого желудочка.|• Порог низкий, потому что правый желудочек тонкий и в норме почти не слышен за левым. Чтобы проявиться, ему нужно перевесить левого.|• Поэтому на ленте он виден поздно, а если R в V1 стал больше S, это уже тревожный знак.|• Ось при этом уходит вправо.',d:'Скажи без подсказки: семь больших клеток — где, семь малых клеток — где.'},
'Три зоны инфаркта':{i:'fire',o:'Дым, огонь и угли',f:'Ишемия меняет T. Повреждение меняет ST. Некроз меняет Q и снижает R.',w:'Инфаркт похож на пожар. У него три зоны, от края к центру.|• <b>Ишемия — дым.</b> Неприятно, но обратимо, если проветрить. Меняется T.|• <b>Повреждение — огонь.</b> Ещё можно потушить, именно ради этого спешат. Меняется ST.|• <b>Некроз — угли.</b> Уже не спасти. Появляется Q, R снижается.|Порядок на ленте легко запомнить: иди по комплексу справа налево — T, ST, Q. Чем тяжелее поражение, тем левее след.',d:'Назови три зоны и покажи на ленте, какой элемент меняет каждая.'},
'Два правила вместо девяти рисунков':{i:'magnet',o:'Огонь притягивает ST, от дыма T отворачивается',f:'ST смещается в сторону зоны повреждения. T смотрит в сторону, противоположную зоне ишемии.',w:'Электрод стоит снаружи, у эпикарда. Девять рисунков из учебника выводятся из двух фраз.|• <b>Огонь притягивает: ST тянется к повреждению.</b> Огонь рядом с электродом — ST вверх. Огонь под эндокардом, далеко — ST вниз.|• <b>От дыма отворачиваются: T смотрит прочь от ишемии.</b> Дым рядом с электродом — T отрицательный. Дым под эндокардом — T высокий.|• <b>Трансмуральное поражение</b> — на всю толщу, значит, рядом с электродом: ST вверх, T глубоко вниз.',d:'Закрой рисунки и предскажи ST и T для субэпикардиальной и субэндокардиальной зоны.'},
'Ишемия меняет T':{i:'smoke',o:'От дыма отворачиваются',f:'Субэндокардиальная: высокий острый T. Субэпикардиальная: T отрицательный. Трансмуральная: T глубокий отрицательный.',w:'Используй правило «от дыма отворачиваются».|• <b>Дым у эпикарда</b>, рядом с электродом: T отворачивается, отрицательный.|• <b>Дым в глубине</b>, у эндокарда: T смотрит на электрод, высокий и острый.|• <b>Дым на всю толщу:</b> отрицательный T особенно глубокий.|Изменения T малоспецифичны, поэтому смотри на них вместе с жалобами и другими данными.',d:'Скажи, где лежит дым, если T высокий и острый.'},
'Повреждение меняет ST':{i:'cat',o:'Кошка выгнула спину',f:'Субэндокардиальное: ST вниз. Субэпикардиальное: ST вверх. Трансмуральное: высокий подъём ST, слитый с T.',w:'Используй правило «огонь притягивает».|• <b>Огонь рядом с электродом:</b> ST вверх.|• <b>Огонь в глубине:</b> ST вниз.|• <b>Огонь на всю толщу:</b> ST поднимается так высоко и выпукло, что сливается с T в одну дугу. Её прозвали <b>кошачьей спинкой</b>: представь кошку, которая выгнула спину.|Увидел кошачью спинку у человека с болью — это экстренная ситуация.',d:'Нарисуй кошачью спинку и подпиши, где QRS, где ST, где T.'},
'Некроз меняет Q':{i:'window',o:'Мёртвая ткань — окно в стене',f:'Патологический Q глубже ¼ R и шире 0,03 с. Трансмуральный некроз: комплекс QS.',w:'Мёртвая ткань электрически молчит и работает как окно в стене.|• Электрод смотрит сквозь окно на противоположную стенку и видит, как волна уходит прочь. Отсюда <b>отрицательный зубец Q</b>.|• <b>Чем больше окно, тем глубже Q.</b> Патологический — глубже четверти R и шире 0,03 с (чуть меньше одной малой клетки).|• <b>Окно на всю толщу стены</b> — трансмуральный некроз. Видна только уходящая волна: комплекс <b>QS</b>, без R.',d:'На ленте сравни глубину Q и высоту R. Больше четверти или нет?'},
'Как инфаркт идёт во времени':{i:'spcal',o:'Три тройки: 3 суток, 3 недели, 3 месяца',f:'Стадии по книге: острейшая — до 3 суток, острая — до 3 недель, подострая — до 3 месяцев, рубцовая — на всю жизнь.',w:'Сроки стадий запоминаются тремя тройками, а картинка на ленте — тем, как гаснет пожар.|• <b>Острейшая, до 3 суток.</b> Горит огонь: высокий подъём ST. В первые часы присоединяется Q.|• <b>Острая, до 3 недель.</b> Огонь стихает: ST опускается. Появляется дым: T уходит вниз. Q углубляется.|• <b>Подострая, до 3 месяцев.</b> Огня нет: ST на изолинии. Дым ещё стоит: T глубокий отрицательный.|• <b>Рубцовая, на всю жизнь.</b> Остались угли: Q. T обычный.|Классификация из той же книги: инфаркт бывает с подъёмом ST и без подъёма, с зубцом Q и без Q. Сроки в разных учебниках немного различаются.',d:'Подвинь ползунок и на каждом шаге скажи, что ещё горит, что дымит и сколько примерно прошло времени.'},
'Цифры и ловушки':{i:'ruler',o:'Ступени по полмиллиметра',f:'Подъём ST в точке J в двух соседних отведениях: от 1 мм. В V2–V3: мужчины до 40 лет от 2,5 мм, мужчины от 40 лет от 2 мм, женщины от 1,5 мм.',w:'Запомни одну мысль и одну лесенку.|• <b>Почти везде порог 1 мм</b>, одна малая клетка.|• <b>В V2–V3 порог выше</b>, потому что там ST и в норме немного приподнят.|• Лесенка для V2–V3: <b>женщины 1,5 мм → мужчины 2 мм → мужчины до 40 лет 2,5 мм.</b> Каждая ступень на полмиллиметра.|• <b>Точка J</b> — место, где кончается QRS и начинается ST. Мерить надо именно там.|Изменения должны быть хотя бы в двух соседних отведениях.',d:'Закрой экран и назови четыре порога.'},
'Пол, стена, фасад':{i:'house',o:'Комната: пол, стена, фасад',f:'Нижний: II, III, aVF. Боковой: I, aVL, V5, V6. Передний: V1–V4.',w:'Представь сердце как комнату и вспомни, откуда смотрит каждый электрод.|• <b>Пол — нижняя стенка: II, III, aVF.</b> Они связаны с левой ногой и смотрят снизу.|• <b>Стена — боковая: I, aVL, V5, V6.</b> Левая рука и левый бок.|• <b>Фасад — передняя: V1–V4.</b> Лежат спереди на груди. V1–V2 ещё и перегородка, V3–V4 — верхушка.|Таблицу учить не нужно: войди в комнату мысленно и назови отведения на полу, на стене и на фасаде.',d:'Какая стенка поражена при подъёме ST во II, III, aVF? А в V1–V4?'},
'Зеркало':{i:'mirror',o:'Отражение в зеркале',f:'Изменения на противоположной стенке выглядят наоборот. Подъём ST там, депрессия тут.',w:'Встань перед зеркалом и подними правую руку: отражение поднимет другую.|• Электрод, который стоит напротив поражённой стенки, видит процесс зеркально.|• <b>Подъём ST в нижних отведениях</b> часто сопровождается депрессией в I, aVL — это зеркало.|• <b>Задняя стенка</b> обычными отведениями не видна, зато её зеркало видно в V1–V3: депрессия ST и высокий R.|Зеркало полезно: настоящая реципрокная депрессия подтверждает, что подъём ST настоящий.',d:'Подъём во II, III, aVF и депрессия в aVL. Что первично, а что зеркало?'},
'Смотри все двенадцать':{i:'flashlight',o:'Посвети туда, где темно',f:'Задняя стенка: V7–V9. Правый желудочек: V3R–V4R.',w:'Обычные двенадцать отведений видят не всё. Если подозреваешь инфаркт в тёмном углу, посвети туда дополнительными электродами.|• <b>Задняя стенка:</b> просто продолжи ряд по кругу. После V6 идут V7, V8, V9, на спине.|• <b>Правый желудочек:</b> те же V3 и V4, но зеркально на правой половине груди. В названии буква R, Right: V3R, V4R.',d:'Покажи на себе, где стоял бы V7 и где V4R.'},
'Обходной путь':{i:'elevator',o:'Чёрный ход и служебный лифт мимо шлюза',f:'WPW: PQ меньше 0,12 с, дельта-волна, широкий QRS, пучок Кента. LGL: PQ меньше 0,12 с, обычный QRS, пучок Джеймса.',w:'Иногда в оперблок есть путь мимо шлюза. Тогда никто не задерживается, и PQ короткий, меньше трёх малых клеток.|• <b>WPW — чёрный ход прямо в операционную</b> (пучок Кента). Бригада входит без шлюза и через стену, по мышце. Поэтому PQ короткий, начало QRS пологое (дельта-волна), QRS широкий.|• <b>LGL — служебный лифт</b> (пучок Джеймса). Он ведёт мимо шлюза, но в обычный коридор. PQ короткий, а QRS нормальный: дальше всё идёт обычным путём.|Подсказки по буквам: Кент — Короткий, две буквы К. WPW — Волна Пологая Вначале.',d:'Назови три признака WPW и объясни, почему при LGL QRS обычный.'},
'Откуда берётся дельта':{i:'tri_ruler',o:'Наклонная сторона треугольника Δ',f:'Дельта-волна — пологое начало QRS при WPW.',w:'Греческая буква дельта — треугольник, Δ. Его наклонная сторона и есть пологое начало QRS.|• <b>Часть желудочка возбуждается раньше</b> через чёрный ход, но по мышце, то есть медленно. Это пологий старт.|• <b>Потом приходит импульс через шлюз</b> и быстро дорисовывает остальное.|• Такой комплекс называют <b>сливным</b>: он слит из двух волн.',d:'Нарисуй QRS с дельта-волной и подпиши, какая часть откуда.'},
'Почему это важно':{i:'zap',o:'У чёрного хода нет санитара',f:'Фибрилляция предсердий при WPW опасна: у пучка Кента нет фильтра.',w:'Санитар в шлюзе — это фильтр. Он не пропускает слишком частые приказы.|• <b>У чёрного хода санитара нет.</b>|• При фибрилляции предсердий сотни приказов в минуту могут пройти к желудочкам напрямую и вызвать фибрилляцию желудочков.|• Препараты, которые замедляют АВ-узел, закроют шлюз, но чёрный ход останется открытым. Поток пойдёт только через него, и станет хуже.|Тактику лечения всегда сверяй с действующими рекомендациями.',d:'Объясни, почему препарат, замедляющий АВ-узел, здесь может навредить.'},
'Высокий калий: лестница':{i:'candle',o:'Сначала палатка, потом тающая свеча',f:'Порядок: острый T → плоский P → широкий QRS → синусоида.',w:'Главное правило: калий вверх — T вверх. Дальше лента словно тает, как свеча.|• <b>Шаг 1: острый высокий T</b>, узкий, как палатка. Его так и называют: «палаточный T».|• <b>Шаг 2: P уплощается</b> и исчезает: предсердия первыми перестают проводить.|• <b>Шаг 3: QRS расширяется</b> и расплывается.|• <b>Шаг 4: синусоида</b> — QRS и T сливаются в волну. Дальше остановка сердца.|Представь свечу: сначала острый язычок пламени, потом воск оплывает.',d:'Закрой экран и назови четыре ступени по порядку.'},
'Палатка или ишемия':{i:'tent',o:'Узкая палатка с острым верхом',f:'При гиперкалиемии T узкий, высокий и симметричный, обычно во многих отведениях.',w:'Нарисуй палатку: узкое основание, ровные скаты, острый верх. Это T при высоком калии.|• <b>Калиевый T</b> узкий, симметричный и виден во многих отведениях сразу.|• <b>Ишемический высокий T</b> обычно шире у основания и стоит только в зоне одной артерии.|• Подскажет история болезни: почечная недостаточность, пропущенный диализ, препараты, задерживающие калий.|Увидел узкую палатку и такую историю — сначала проверь калий.',d:'Назови три ситуации, в которых первым делом думаешь о калии.'},
'Низкий калий':{i:'balloon',o:'Сдутый шарик',f:'Плоский T, ST чуть вниз, появляется зубец U, удлиняется QT.',w:'Обратная сторона правила: калий вниз — T вниз.|• <b>T сдувается, как шарик</b>, становится плоским.|• <b>За ним становится виден зубец U</b> — маленькая горка после T.|• <b>ST чуть опускается, QT удлиняется.</b>|Лента выглядит вялой, но сердце при этом раздражительное, риск аритмий растёт. Низкий калий часто идёт в паре с низким магнием.',d:'Нарисуй комплекс с плоским T и зубцом U.'},
'Длинный QT':{i:'hourglass',o:'T должен кончиться до середины',f:'QTc = QT / √R-R, в секундах. Граница около 0,45 с у мужчин и 0,46–0,47 с у женщин. Опасно больше 0,50 с.',w:'QT зависит от частоты, поэтому его исправляют формулой, но сначала можно прикинуть глазами.|• <b>Правило половины:</b> при обычной частоте T должен закончиться раньше середины между двумя R.|• <b>Перешёл середину</b> — считай QTc.|• <b>Опасная граница — полсекунды</b>, 0,50 с, то есть две с половиной большие клетки.|Формула Базетта завышает QTc при тахикардии и занижает при брадикардии.',d:'На ленте найди середину R-R и посмотри, где кончается T.'},
'Пируэт':{i:'cyclone',o:'Скручивание вершин',f:'Пируэт — полиморфная желудочковая тахикардия на фоне длинного QT.',w:'Французское название torsades de pointes значит «скручивание вершин».|• Комплексы то растут, то уменьшаются, будто лента закручивается вокруг линии.|• <b>Пируэт рождается на фоне длинного QT.</b>|• Он может перейти в фибрилляцию желудочков.|Связка, которую надо помнить: длинный QT → пируэт → фибрилляция желудочков. Часто рядом стоит низкий магний и низкий калий.',d:'Объясни, какая связь между QT, магнием и пируэтом.'},
'Перикардит или инфаркт':{i:'smile',o:'Улыбка или хмурая бровь',f:'Перикардит: подъём ST почти везде, вогнутый, PQ снижен, нет зеркала.',w:'Посмотри на форму ST.|• <b>Перикардит — улыбка:</b> ST вогнутый, как улыбающийся рот.|• <b>Инфаркт — хмурая бровь:</b> ST выпуклый, дугой вверх.|• Три П при перикардите: <b>Повсюду, Плавно, PQ снижен.</b>|Логика простая: воспаление покрывает сердце снаружи почти целиком, поэтому изменения во многих отведениях и одинаковые. Инфаркт сидит в зоне одной артерии и даёт зеркало напротив.',d:'Посмотри на форму ST: улыбается он или хмурится?'},
'ТЭЛА':{i:'lungs',o:'Внезапно перегружено правое сердце',f:'Чаще всего синусовая тахикардия. Иногда S1Q3T3 и признаки перегрузки правых отделов.',w:'ТЭЛА — это тромбоэмболия лёгочной артерии. Правому желудочку внезапно приходится качать кровь через забитые сосуды.|• <b>Самая частая находка — просто синусовая тахикардия.</b>|• <b>S1Q3T3:</b> глубокий S в I, а Q и отрицательный T в III. Красивая картинка из учебника, но бывает не всегда.|• Могут появиться признаки справа: блокада правой ножки, отрицательные T в V1–V3, ось вправо.|Нормальная ЭКГ ТЭЛА не исключает.',d:'Расшифруй S1Q3T3 и объясни, почему её отсутствие ничего не исключает.'}};

/* случаи: q вопрос, o варианты [ответ, почему], a верный, z заключение, tr почему легко ошибиться, hw как не ошибиться */
const ZG=['Помехи и артефакты','Ритм не такой, каким кажется','Блокады и паузы','Опасное: не пропусти'];

const REAL=[
Z('r_wander',0,'Плывущая изолиния','Плановая ЭКГ, пациент кашляет и глубоко дышит. Что на ленте?',[['Синусовый ритм, изолиния плывёт','Перед каждым QRS обычный P, R-R ровные. Волнами ходит только изолиния: это дыхание и движение.'],['Фибрилляция предсердий','При ФП нет P и R-R разные. Здесь P на месте, R-R ровные.'],['Подъём и депрессия ST','ST кажется то выше, то ниже, потому что плывёт вся линия. ST меряют от уровня PQ того же комплекса.']],0,'Ритм синусовый, правильный, ЧСС около 73 в минуту. Дрейф изолинии.','Плывущая линия делает ST то приподнятым, то опущенным, и можно «найти» ишемию там, где её нет.','Сравнивай ST с отрезком PQ в том же комплексе, а не с краем бумаги. Попроси пациента лежать спокойно и дышать ровно, проверь контакт электродов и перезапиши.'),
Z('r_tremor',0,'Дрожь вместо ряби','Пожилой пациент, руки дрожат, в палате холодно. Что на ленте?',[['Фибрилляция предсердий','Мелкая дрожь похожа на рябь f. Но приложи край бумаги к R: интервалы ровные, а при ФП они разные.'],['Синусовый ритм с мышечной дрожью','R-R ровные, местами виден P. Дрожат мышцы, а не предсердия.'],['Трепетание предсердий','Пила при трепетании ровная и крупная, около 300 в минуту. Здесь мелкая беспорядочная дрожь.']],1,'Ритм синусовый, правильный, ЧСС около 77 в минуту. Мышечный тремор.','Тремор очень похож на волны фибрилляции, особенно на мониторе.','Главное — R-R: ровные R-R почти исключают ФП. Согрей пациента, положи его руки на опору, электроды на конечностях ставь ближе к туловищу.'),
Z('r_ac',0,'Лохматая линия','Запись в реанимации, рядом много аппаратуры. Линия толстая и «лохматая». Что это?',[['Сетевая наводка, ритм синусовый','Частые одинаковые зубчики по всей ленте — помеха от электросети 50 Гц. Под ней обычный синусовый ритм.'],['Трепетание предсердий','Волны трепетания идут около 5 в секунду, а здесь зубчики гораздо чаще и одинаковы везде, даже на QRS.'],['Фибрилляция желудочков','При ФЖ нет QRS, а здесь они видны чётко.']],0,'Ритм синусовый, ЧСС около 75 в минуту. Сетевая наводка.','Наводка прячет мелкие зубцы P и делает изолинию неровной.','Проверь чёрный электрод (заземление) и контакт всех электродов, отодвинь кабели от сетевых шнуров, включи сетевой фильтр аппарата.'),
Z('r_motion',0,'Монитор кричит «ЖТ»','Монитор тревожит: «желудочковая тахикардия». Пациент в это время чистит зубы и спокойно отвечает. Что на ленте?',[['Желудочковая тахикардия','Сквозь размашистые волны с прежним шагом проходят узкие QRS. При ЖТ их бы не было.'],['Артефакт движения на фоне синусового ритма','Узкие QRS идут сквозь помеху в своём ритме, а размашистые волны — движение руки.'],['Фибрилляция желудочков','При ФЖ человек теряет сознание за секунды. Пациент разговаривает — это главный довод.']],1,'Ритм синусовый, ЧСС около 75 в минуту. Двигательный артефакт.','Двигательный артефакт может очень похоже изображать ЖТ и ФЖ. Это классическая ловушка мониторов.','Сначала посмотри на пациента. Потом найди узкие QRS, которые идут сквозь помеху с прежним интервалом. Сравни с другим отведением.'),
Z('r_off',0,'Внезапная прямая','Ночью на мониторе после нескольких нормальных комплексов идёт идеально прямая линия. Что делать в первую очередь и что вероятнее?',[['Сразу считать асистолией','Сначала пациент: пульс, дыхание, сознание. Идеально прямая линия сразу после нормальных комплексов чаще значит отсоединение. Но решает пациент, а не монитор.'],['Проверить пациента; вероятнее, отошёл электрод','Резкий обрыв ритма и линия без малейшей волны типичны для отсоединения. Но первым делом проверяют пациента.'],['Полная АВ-блокада','При полной блокаде видны зубцы P, а здесь нет ничего.']],1,'Синусовый ритм, затем прямая линия: вероятно, отсоединение электрода. Нужна проверка пациента и подключения.','Прямую линию легко принять за асистолию, а асистолию — за отошедший электрод. Ошибка в любую сторону опасна.','Порядок: пациент → подключение → усиление → другое отведение. Настоящая асистолия почти никогда не бывает идеально ровной: изолиния слегка плывёт.'),
Z('r_armSwap',0,'Всё вверх ногами','Отведение I: и P, и QRS, и T отрицательные. Человек здоров, жалоб нет. Что вероятнее всего?',[['Декстрокардия','Бывает, но редко. При ней ещё и R не растёт в грудных отведениях. Начни с частой причины.'],['Перепутаны электроды на руках','Красный и жёлтый поменяли местами. Отведение I переворачивается целиком, aVR и aVL меняются местами.'],['Инфаркт боковой стенки','Инфаркт не переворачивает зубец P. Отрицательный P в I — подсказка про электроды.']],1,'Вероятно, перепутаны электроды правой и левой руки. Перезаписать ЭКГ.','Перевёрнутое отведение I похоже на тяжёлую патологию: отрицательные T, ось вправо.','Отрицательный P в I — первый повод проверить цвета: красный на правой руке, жёлтый на левой. Перезапиши и сравни.','I'),
Z('r_lowV',0,'Всё мелкое','Все зубцы мелкие, метка калибровки обычная, 10 мм. Что на ленте?',[['Асистолия','QRS есть, они просто низкие. Асистолия — это отсутствие комплексов.'],['Синусовый ритм, низкий вольтаж','P перед каждым QRS, ритм ровный, только амплитуда маленькая.'],['Неправильная калибровка','Метка 10 мм в порядке. Значит, низкие сами зубцы, а не настройка.']],1,'Ритм синусовый, ЧСС около 75 в минуту. Низкий вольтаж QRS.','На мелкой ленте легко не заметить P и решить, что ритм не синусовый.','Сначала проверь метку калибровки. Если она в норме, низкий вольтаж — находка. Он бывает при выпоте в перикарде, ожирении, эмфиземе, отёках. Сопоставь с клиникой.'),
Z('r_afCoarse',1,'Пила или нет','Ритм неровный, между QRS крупные волны. Что это?',[['Трепетание предсердий','Пила при трепетании одинаковая, зуб за зубом, и R-R обычно ровные. Здесь волны разной формы и R-R разные.'],['Крупноволновая фибрилляция предсердий','Волны беспорядочные, разной высоты, R-R все разные.'],['Частые предсердные экстрасистолы','Перед экстрасистолой был бы чёткий P. Здесь вместо P беспорядочные волны.']],1,'Фибрилляция предсердий, крупноволновая форма, ЧСС в среднем около 82 в минуту.','Крупные волны f легко принять за пилу трепетания.','Сравни волны между собой: у пилы все зубья одинаковые. И приложи бумагу к R-R: при фибрилляции они всегда разные.'),
Z('r_afFine',1,'Тихая фибрилляция','Изолиния почти ровная, P не найти, ритм неровный. Что это?',[['Синусовая аритмия','При синусовой аритмии перед каждым QRS есть P. Здесь P нет.'],['Мелковолновая фибрилляция предсердий','Волны f такие мелкие, что почти не видны. Решает неровный R-R без P.'],['Ритм из АВ-узла','Узловой ритм ровный, а здесь R-R все разные.']],1,'Фибрилляция предсердий, мелковолновая форма, ЧСС в среднем около 87 в минуту.','Мелкие волны f легко не увидеть и решить, что предсердия просто «молчат».','Если P нет, а R-R меняются без всякой закономерности, это фибрилляция предсердий, даже когда ряби не видно.'),
Z('r_fl21',1,'Ровно 150','Ровная узкая тахикардия 150 в минуту, P трудно найти. Что надо исключить прежде всего?',[['Синусовую тахикардию','Её можно предположить, но ровно 150 в минуту — классическая ловушка. Посмотри: между QRS по две одинаковые волны.'],['Трепетание предсердий с проведением 2 : 1','Волны F идут около 300 в минуту, к желудочкам проходит каждая вторая. Одна волна прячется в QRS или T.'],['Желудочковую тахикардию','QRS узкий, это не ЖТ.']],1,'Трепетание предсердий с проведением 2 : 1, ЧСС желудочков 150 в минуту.','Половина волн F прячется в комплексах, и лента похожа на синусовую тахикардию.','Ровно около 150 в минуту — ищи вторую волну между QRS. Пилу лучше видно в II, III, aVF и V1.'),
Z('r_sinTach',1,'P прилип к T','Температура 39 °C. Ровная узкая тахикардия около 130 в минуту. Что это?',[['Наджелудочковая тахикардия','При ней P не видно. Здесь P есть перед каждым QRS, он просто прилип к концу T.'],['Синусовая тахикардия','P перед каждым QRS, одинаковый, просто при частом ритме он сливается с концом T.'],['Фибрилляция предсердий','R-R ровные, это не ФП.']],1,'Синусовая тахикардия, ЧСС около 130 в минуту.','При частом ритме P наезжает на T, и его легко не заметить.','Ищи небольшой горбик на спуске T перед каждым QRS. Синусовая тахикардия разгоняется и замедляется постепенно, вместе с причиной: температурой, болью, кровопотерей.'),
Z('r_resp',1,'Неровно, но норма','Подросток. Ритм то чаще, то реже, меняется плавно. Что на ленте?',[['Фибрилляция предсердий','При ФП нет P. Здесь P перед каждым QRS.'],['Синусовая дыхательная аритмия','P на месте, R-R плавно укорачиваются и удлиняются вместе с дыханием. Это норма.'],['СА-блокада','При СА-блокаде выпадают целые циклы, и пауза кратна R-R. Здесь изменения плавные.']],1,'Синусовая (дыхательная) аритмия, ЧСС от 57 до 100 в минуту. Вариант нормы.','Неровный R-R сразу наводит на мысль о фибрилляции.','При неровном ритме сначала ищи P. Есть P перед каждым QRS — ритм синусовый. Попроси задержать дыхание: дыхательная аритмия исчезнет.'),
Z('r_svtTrem',1,'Внезапно и ровно','Сердцебиение началось внезапно 20 минут назад. Узко, ровно, около 180 в минуту, ленту трясёт. Что это?',[['Синусовая тахикардия','Синусовая тахикардия не начинается внезапно, как по щелчку, и перед QRS был бы P.'],['Наджелудочковая (АВ-узловая) тахикардия','Узко, идеально ровно, P не видно, внезапное начало.'],['Фибрилляция предсердий','R-R ровные, при ФП они разные. Дрожь — это мышцы.']],1,'Пароксизмальная наджелудочковая тахикардия, ЧСС около 180 в минуту.','Мышечная дрожь на фоне частого ритма может напоминать фибрилляцию.','R-R решают: ровные — не ФП. Внезапное начало и конец, P не видно — типичная АВ-узловая re-entry тахикардия.'),
Z('r_pvcTrem',1,'Перебой или помеха','Жалобы на «перебои». Ленту трясёт. Что на ней?',[['Предсердная экстрасистола','Комплекс широкий, P перед ним нет. Значит, экстрасистола желудочковая.'],['Желудочковая экстрасистола','Ранний широкий QRS без P, T в обратную сторону, после него пауза.'],['Просто помеха','Помеха не даёт широкий комплекс с обратным T и не меняет ритм.']],1,'Ритм синусовый. Одиночная желудочковая экстрасистола. Мышечный тремор.','Дрожь маскирует детали, и экстрасистолу можно принять за помеху.','Экстрасистола меняет ритм: приходит раньше и оставляет паузу. Помеха ритм не меняет.'),
Z('r_bigemW',1,'Пульс не сходится','Пульс на запястье около 46 в минуту, а монитор насчитывает больше 90. Что на ленте?',[['Синусовая брадикардия','На ленте вдвое больше комплексов, чем ударов пульса: каждый второй — ранний и широкий.'],['Желудочковая бигеминия','После каждого нормального комплекса идёт желудочковая экстрасистола. Ранние сокращения слабые, и пульс их часто не ощущает.'],['Ритм из АВ-узла','Комплексы разные: узкие чередуются с широкими.']],1,'Ритм синусовый. Желудочковая экстрасистолия по типу бигеминии. Дефицит пульса.','Пульс и монитор не совпадают, и можно решить, что неисправен монитор или что это брадикардия.','Если пульс реже, чем комплексы на мониторе, ищи ранние сокращения: они не успевают дать полноценную пульсовую волну.'),
Z('r_av1',2,'Всего на клетку','Плановая ЭКГ, жалоб нет. На что обратить внимание?',[['Норма','Почти: P и QRS обычные, но PQ чуть больше одной большой клетки.'],['АВ-блокада I степени','PQ около 0,24 с, это шесть малых клеток. Норма до 0,20 с, пять клеток.'],['Мобитц 1','При Мобитц 1 PQ растёт и QRS выпадает. Здесь PQ всё время одинаковый.']],1,'Ритм синусовый, ЧСС около 70 в минуту. АВ-блокада I степени, PQ 0,24 с.','PQ удлинён всего на одну малую клетку, глазом это легко пропустить.','Всегда меряй PQ в клетках. Больше одной большой клетки, то есть больше 0,20 с, — АВ-блокада I степени.'),
Z('r_wenck',2,'Незаметное удлинение','Ритм кажется неровным, иногда пауза. Что на ленте?',[['Синусовая аритмия','Перед паузой есть P без QRS. При синусовой аритмии P всегда проводится.'],['АВ-блокада II степени, Мобитц 1','PQ растёт от удара к удару (0,17 → 0,25 → 0,29 с), потом P без QRS, и цикл повторяется.'],['АВ-блокада II степени, Мобитц 2','При Мобитц 2 PQ одинаковый перед выпадением. Здесь он растёт.'],['Блокированная экстрасистола','Непроведённый P пришёл вовремя, а не рано. Значит, это не экстрасистола.']],1,'Ритм синусовый. АВ-блокада II степени, тип Мобитц 1 (периодика Самойлова — Венкебаха), проведение 4 : 3.','Удлинение PQ идёт по 1–2 малые клетки, его легко не заметить. Тогда кажется, что QRS выпал внезапно, как при Мобитц 2.','Сравни PQ сразу после паузы и прямо перед ней. После паузы он самый короткий, перед паузой самый длинный — это Венкебах.'),
Z('r_av21',2,'Лишний P на T','ЧСС 50 в минуту. Между QRS видно по два P. Что это?',[['Синусовая брадикардия','При брадикардии на один QRS один P. Здесь P вдвое больше.'],['АВ-блокада II степени 2 : 1','Каждый второй P не проводится. Он прячется сразу за зубцом T.'],['Полная АВ-блокада','При полной блокаде PQ всё время разный. Здесь перед каждым QRS одинаковый PQ.']],1,'АВ-блокада II степени с проведением 2 : 1, ЧСС желудочков 50 в минуту.','Непроведённый P сливается с концом T, и лента похожа на обычную синусовую брадикардию.','При брадикардии всегда ищи «лишние» P, особенно на спуске T. Тип (Мобитц 1 или 2) при 2 : 1 по одной ленте не определить.'),
Z('r_av3',2,'Каждый сам по себе','ЧСС 46 в минуту, слабость, головокружение. Что на ленте?',[['Синусовая брадикардия','P здесь идут чаще, чем QRS, и не связаны с ними.'],['Полная АВ-блокада (III степени)','P идут своим ритмом около 88 в минуту, QRS — своим около 46. PQ всё время разный, часть P прячется в QRS и T.'],['АВ-блокада I степени','При I степени каждый P проводится с одинаковым длинным PQ.']],1,'Полная АВ-блокада. Предсердия около 88 в минуту, желудочки около 46 в минуту, QRS узкие: замещающий ритм из АВ-соединения.','Часть P скрыта в QRS и T, и кажется, что P нет совсем или что PQ просто длинный.','Отметь на бумаге два соседних P и шагай этим расстоянием по ленте. P окажутся в ровном ритме независимо от QRS — это полная блокада.'),
Z('r_blkPac',2,'Пауза с секретом','Внезапная пауза на ровном ритме. T перед паузой чуть острее соседних. Что это?',[['СА-блокада II степени','Пауза меньше двух R-R, а на T спрятан ранний P.'],['Блокированная предсердная экстрасистола','Ранний P упал на T и не прошёл к желудочкам: АВ-узел ещё не восстановился. Отсюда пауза.'],['АВ-блокада Мобитц 2','При Мобитц 2 не проводится P, пришедший вовремя. Здесь P пришёл рано.']],1,'Ритм синусовый. Блокированная (непроведённая) предсердная экстрасистола.','Это самая частая причина внезапной паузы, и её часто принимают за блокаду.','В любой паузе ищи P, особенно на зубце T перед ней. Сравни этот T с соседними: горбик или заострение — спрятанный P.'),
Z('r_pOnly',2,'Есть P, нет QRS','Остановка кровообращения. На мониторе ровно идут зубцы P, а QRS нет. Что это?',[['Отошёл электрод','При отсоединении не было бы и зубцов P.'],['Асистолия желудочков с сохранёнными P','Предсердия возбуждаются, к желудочкам ничего не проходит, а своего ритма у них нет.'],['Фибрилляция желудочков','При ФЖ видны беспорядочные волны. Здесь ровная линия с P.']],1,'Асистолия желудочков: зубцы P без комплексов QRS.','Видимые P создают ощущение, что ритм есть.','Смотри на QRS: если их нет, кровообращения нет, сколько бы P ни было на ленте. Действуй по протоколу реанимации.'),
Z('r_vt150',3,'Широкая и ровная','Широкая ровная тахикардия около 150 в минуту. Между комплексами местами видны маленькие зубцы. Что это?',[['Наджелудочковая тахикардия с блокадой ножки','Возможно, но доказать это трудно. Широкую тахикардию считают ЖТ, пока не доказано другое, а маленькие зубцы — подсказка.'],['Желудочковая тахикардия','Широкие одинаковые QRS. Маленькие зубцы — это P, которые идут своим ритмом, независимо от QRS. Это АВ-диссоциация, признак ЖТ.'],['Синусовая тахикардия','Перед QRS нет P с постоянным PQ, а комплексы широкие.']],1,'Желудочковая тахикардия, ЧСС около 150 в минуту, АВ-диссоциация.','Пациент с ЖТ может быть в сознании и выглядеть стабильным, а широкие комплексы списывают на блокаду ножки.','Широкая тахикардия — ЖТ, пока не доказано другое. Независимые P среди комплексов почти доказывают ЖТ.'),
Z('r_vfFine',3,'Мелкий хаос','Без сознания, пульса нет. На мониторе мелкие беспорядочные волны. Что это?',[['Асистолия','При асистолии линия почти ровная. Здесь частые беспорядочные волны.'],['Мелковолновая фибрилляция желудочков','Хаотичные волны без комплексов, просто маленькой амплитуды.'],['Артефакт','Без сознания и без пульса — это не артефакт.']],1,'Фибрилляция желудочков, мелковолновая.','Мелкую ФЖ легко принять за асистолию, а тактика у них разная.','Посмотри в другом отведении и увеличь усиление: мелкие волны станут заметнее. Тактику определяй по действующему протоколу реанимации.'),
Z('r_asys',3,'Почти ровно','Без сознания, пульса нет. Линия почти ровная, слегка плывёт. Что это?',[['Асистолия','Комплексов нет, линия лишь медленно колышется.'],['Отошёл электрод','При отсоединении линия была бы идеально прямой. Здесь она живая, слегка плывёт, а пациент без пульса.'],['Мелковолновая ФЖ','При ФЖ видны частые беспорядочные волны. Здесь только медленное колыхание.']],0,'Асистолия.','Асистолию можно перепутать с мелковолновой ФЖ и с отсоединением электрода.','Проверь подключение, увеличь усиление и посмотри во втором отведении. Решение принимай по пациенту и протоколу.'),
Z('r_stInf',3,'Всего два миллиметра','Боль за грудиной 40 минут. Отведение III. Что настораживает?',[['Ничего, это норма','ST поднят примерно на 2 мм и выпуклый. У человека с болью это не норма.'],['Подъём ST: подозрение на инфаркт нижней стенки','ST поднят примерно на 2 мм, выпуклый. Нужна полная ЭКГ: II, aVF и зеркальная депрессия в I, aVL.'],['Перикардит','При перикардите ST вогнутый, «улыбка», и изменения почти во всех отведениях. По одному отведению перикардит не ставят.']],1,'Ритм синусовый, ЧСС около 83 в минуту. Подъём ST в III около 2 мм. Подозрение на острый инфаркт нижней стенки, нужна ЭКГ в 12 отведениях.','Подъём невелик, а изолиния слегка плывёт, и его можно счесть помехой.','Меряй ST от уровня PQ в точке J. Смотри соседние отведения той же стенки и зеркало. При сомнении повтори ЭКГ через 15–30 минут.','III'),
Z('r_hyperT',3,'Подозрительно высокий T','Боль за грудиной 20 минут. Отведение V2, ST почти на линии. Есть ли тревожный признак?',[['Нет, ЭКГ нормальная','Обрати внимание на T: он очень высокий и широкий у основания, выше R.'],['Сверхострые T: возможен самый ранний инфаркт','Высокий T с широким основанием в первые минуты инфаркта может появиться раньше подъёма ST.'],['Гиперкалиемия','При гиперкалиемии T узкий, «палатка», обычно во многих отведениях. Здесь T широкий у основания, а боль началась внезапно.']],1,'Ритм синусовый. Высокие широкие T в V2: подозрение на сверхострую фазу инфаркта. Повторить ЭКГ через 15–30 минут, определить тропонин.','ST ещё не поднят, и ЭКГ выглядит почти нормальной.','Оценивай T вместе с QRS: T выше R и с широким основанием у человека с болью — тревожный знак. Повторяй ЭКГ.','V2'),
Z('r_hyperK',3,'Пропущенный диализ','Пациент на гемодиализе пропустил процедуру. Что на ленте?',[['Сверхострые T при инфаркте','Здесь T узкий и острый, «палатка», P почти исчез, а история с диализом подсказывает калий.'],['Гиперкалиемия','Узкие высокие T, сглаженный P, QRS начинает расширяться.'],['Норма','P почти не виден, а T выше R — это не норма.']],1,'Ритм синусовый, P сглажены. Высокие узкие T. Признаки гиперкалиемии: срочно калий крови.','Высокий T при калии похож на сверхострый T при инфаркте.','Калиевый T узкий и симметричный, виден во многих отведениях, и обычно есть подходящая история. Проверяй калий сразу.'),
Z('r_stDep',3,'Нагрузка и ST','Давящая боль при подъёме по лестнице. Отведение V5, ЧСС 100 в минуту. Что видно?',[['Норма','ST опущен горизонтально примерно на 1,5 мм. В V5 допустимо не больше 0,5 мм.'],['Горизонтальная депрессия ST: субэндокардиальная ишемия','ST опущен горизонтально, это признак ишемии.'],['Подъём ST','ST здесь ниже уровня PQ, а не выше.']],1,'Синусовая тахикардия около 100 в минуту. Горизонтальная депрессия ST в V5 около 1,5 мм — ишемия.','Дрожь и частый ритм делают депрессию менее заметной.','Меряй ST от уровня PQ. Горизонтальная или косонисходящая депрессия — повод думать об ишемии. Проверь, нет ли гипертрофии левого желудочка: при ней тоже бывает депрессия.','V5'),
Z('r_wpwSub',3,'Маленькая дельта','Молодой человек, приступы сердцебиения. Плановая ЭКГ. Что упускают чаще всего?',[['Норма','Посмотри на PQ и начало QRS: PQ короткий, а R поднимается полого.'],['Синдром WPW','PQ около 0,08 с, меньше трёх малых клеток, и начало QRS пологое — дельта-волна.'],['Блокада правой ножки','При блокаде ножки PQ нормальный, а расширен конец QRS, а не начало.']],1,'Ритм синусовый. Укороченный PQ, дельта-волна: феномен WPW.','Дельта-волна бывает маленькой и видна не во всех отведениях.','При жалобах на приступы сердцебиения всегда меряй PQ и смотри на начало QRS.')

function vAb(v){v.innerHTML=`<div class="view"><div class="pt"><h1>О курсе</h1><p>Для студентов, медсестёр, фельдшеров и молодых врачей.</p></div><div class="wrn">${ic('warn')}<p>Сайт не ставит диагнозов и не заменяет врача. Цифры сверяй с действующими рекомендациями и протоколами. Если есть боль в груди, одышка, обморок или другие тревожные симптомы, вызывай скорую помощь.</p></div><div class="card"><details open><summary>Честные правила</summary><ul><li>Очки дают только за знания, случайных наград нет.</li><li>Нет рекламы и покупок.</li><li>Пропущенный день ничего не сжигает.</li><li>Регистрации нет, прогресс хранится только в этом браузере.</li></ul></details><details><summary>Где источники расходятся</summary><ul><li>Норма ЧСС: 60–90 в минуту в российских учебниках, 60–100 в минуту чаще за рубежом.</li><li>Нормальная ось: от +30° до +69° или вся зона от −30° до +90°.</li><li>Граница QTc: около 0,45 с у мужчин, 0,46–0,47 с у женщин.</li><li>Сроки стадий инфаркта различаются, здесь даны ориентиры.</li><li>Частоты аритмий — учебные ориентиры.</li></ul></details><details><summary>Чего здесь нет</summary><ul><li>Лечения и доз препаратов.</li><li>Детской ЭКГ, ритмов кардиостимулятора, синдрома Бругада.</li><li>Критериев инфаркта на фоне блокады левой ножки.</li></ul></details><details><summary>Проверочные материалы</summary><ul><li><a href="https://litfl.com/ecg-criteria-for-left-ventricular-hypertrophy/">LITFL, критерии ГЛЖ</a></li><li><a href="https://en.ecgpedia.org/wiki/Rvh">ECGpedia, ГПЖ</a></li><li><a href="https://pubmed.ncbi.nlm.nih.gov/30165617/">Четвёртое универсальное определение ИМ</a></li><li><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9075358">Обзор критериев подъёма ST</a></li></ul></details>${TG_BOT?'<details open><summary>Связаться с автором</summary><p>Нашёл ошибку или есть идея? <a href="#svyaz">Напиши автору в Telegram</a> — он прочитает и ответит.</p></details>':''}<details open><summary>Что почитать дальше</summary><p class="meta">Книги, по которым учатся в медвузах. Берите последнее издание.</p><p class="bkh">Для начала</p><ul class="bk"><li><b>Хэмптон Дж. «Основы ЭКГ».</b> Тонкая и очень понятная книга для первого знакомства с ЭКГ (в оригинале «The ECG Made Easy»).</li><li><b>Давей П. «Наглядная ЭКГ».</b> Короткие главы, много схем и наглядных лент.</li></ul><p class="bkh">Основательно</p><ul class="bk"><li><b>Мурашко В. В., Струтынский А. В. «Электрокардиография».</b> Классический учебник для студентов, выдержал много переизданий.</li><li><b>Ярцев С. «Электрокардиография. Практическое руководство-справочник для врачей».</b> Кратко и по делу, удобно держать под рукой.</li><li><b>Белялов Ф. И. «Аритмии сердца».</b> Для тех, кто хочет глубже разобраться в нарушениях ритма.</li></ul><p class="bkh">На английском</p><ul class="bk"><li><b>Thaler M. «The Only EKG Book You’ll Ever Need».</b> Простым языком, с множеством лент.</li><li><b>Goldberger A. L. и соавт. «Goldberger’s Clinical Electrocardiography: A Simplified Approach».</b> Понятный и при этом клинически точный учебник.</li><li><b>Strauss D. G., Schocken D. D. «Marriott’s Practical Electrocardiography».</b> Классика практической электрокардиографии.</li></ul></details></div><div class="rowb" id="rs" style="max-width:420px"><button class="btn" id="rz">Сбросить мой прогресс</button></div></div>`;$('rz').onclick=()=>{$('rs').innerHTML='<button class="btn" id="ry">Да, стереть всё</button><button class="btn" id="rn">Отмена</button>';$('rn').onclick=()=>vAb(v);$('ry').onclick=()=>{S=S0();save();location.hash='';location.reload()}}}
