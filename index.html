/* ---------- модель сигнала ---------- */
const sm=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};

function P(w,t,k){k=k||'n';

  else if(k==='peak')w.g(t+.05,.017,.32);

  else if(k==='neg')w.g(t+.05,.02,-.13);
  else if(k==='bi'){w.g(t+.03,.014,.11);w.g(t+.072,.014,-.1)}

function N(w,t,o){o=o||{};(w.q=w.q||[]).push(t);const q=o.q===undefined?.07:o.q,r=o.r===undefined?1:o.r,s=o.s===undefined?.2:o.s,ta=o.ta===undefined?.27:o.ta,k=o.k||1,st=o.st||0;
  const wq=q>.2;
  if(q)w.g(t+(wq?.018:.01),wq?.012:.005,-q);
  if(r)w.g(t+(wq?.05:.032),.0085,r);
  if(s)w.g(t+(wq?.075:.055),.007,-s);
  if(st)w.fn(x=>st*sm((x-(t+.056))/.02)*(1-sm((x-(t+.25))/.09)));
  if(o.cat)w.g(t+.19,.06,.1);

const sin1=(w,t,pq,o,pk)=>{P(w,t,pk);N(w,t+(pq||.16),o)};

  sinus(){const w=new W();seq(w,.12,[.8,.8,.8,.8,.8,.8,.8],(w,t)=>sin1(w,t));return w},
  sinTachy(){const w=new W();let t=.05;while(t<4.9){sin1(w,t,.13,{k:.72});t+=.45}return w},
  sinBrady(){const w=new W();seq(w,.2,[1.35,1.35,1.35,1.35],(w,t)=>sin1(w,t));return w},

  pac(){const w=new W();let t=.12;[0,1].forEach(()=>{sin1(w,t);t+=.85});t-=.28;P(w,t,'neg');N(w,t+.15);t+=1.05;[0,1,2].forEach(()=>{sin1(w,t);t+=.85});return w},

 T('ST и T: уборка','После рывка желудочкам нужно перезарядиться. Вспомни книги на полке: QRS — книги упали, ST — все лежат и ничего не движется, поэтому линия ровная. T — книги поднимают обратно. Поднимать тяжелее, чем ронять, поэтому при нехватке кислорода первыми страдают именно ST и T.',{fig:{b:'labeled',band:[.32,.68]}}),

 T('Смотри в клетки, а не в секунды','На ленте нет часов, зато есть клеточки. При 25 мм/с маленькая клетка — 0,04 с, большая — 0,2 с, пять больших — секунда. Переведи нормы в клетки один раз, и дальше будешь видеть их глазами, без калькулятора.',{list:[['P и QRS','до 0,10 с: полбольшой клетки'],['Широкий QRS','от 0,12 с: три малые клетки'],['PQ','0,12–0,20 с: 3–5 малых, не больше одной большой'],['QT','около 0,44 с: чуть больше двух больших']],note:'QT зависит от частоты, поэтому его пересчитывают в QTc. Разберём в теме 12.'}),
 A('QRS занимает 4 малые клетки при 25 мм/с. Что это?',[['Норма, 0,08 с','Это две малые клетки. Одна малая клетка равна 0,04 с.'],['Широкий, 0,16 с','Верно: 4 × 0,04 = 0,16 с. Широким считается всё от 0,12 с, то есть от трёх малых клеток.'],['Узкий, 0,04 с','Это одна малая клетка, такого короткого QRS почти не бывает.']],1,'Три малые клетки — уже широкий.')],
 ex:[
 A('Что отражает подъём зубца P?',[['Правое предсердие','Верно: правое возбуждается первым.'],['Левое предсердие','Левое даёт спуск зубца.'],['АВ-узел','АВ-узел зубца не рисует.']],0,'Правое — первое.'),
 A('Что отражает зубец Q?',[['Основание сердца','Это S.'],['Перегородку','Верно: импульс разворачивается в перегородке, вектор уходит от электрода.'],['Верхушку','Это R.']],1,'ПоВОрот: перегородка, верхушка, основание.'),
 A('PQ занимает 6 малых клеток при 25 мм/с. Что это значит?',[['Норма','Норма до пяти малых клеток, 0,20 с.'],['0,24 с: PQ удлинён','Верно: 6 × 0,04 = 0,24 с. Это АВ-блокада I степени.'],['PQ укорочен','Укорочение — меньше 3 малых клеток.']],1,'PQ не больше одной большой клетки.'),
 A('Что входит в интервал QT?',[['Только зубец T','Интервал начинается раньше, с начала QRS.'],['QRS, сегмент ST и T','Верно, поэтому QT описывает всю электрическую систолу желудочков.'],['P и QRS','P в него не входит.']],1,'QT — вся работа желудочков от начала до конца.'),
 A('Что значит сегмент ST на изолинии?',[['Желудочки не работают','Они как раз сокращаются, просто разности потенциалов почти нет.'],['Равновесие возбуждения и восстановления','Верно: суммарный вектор близок к нулю.'],['Импульс застрял','Импульс давно прошёл.']],1,'ST — весы в равновесии.')]},

{n:3,t:'Алгоритм чтения ЭКГ',d:'Читаем любую ленту по порядку',ic:'РЫЧАГ на ОСИ, ЧСС, отведения, ось',skill:'читать любую ленту по алгоритму и определять ось',
 hook:A('Ты держишь ленту, калькулятора нет. Между соседними R 15 мм, скорость 25 мм/с. Какая ЧСС?',[['60 в минуту','60 в минуту — это R-R 25 мм.'],['75 в минуту','75 в минуту — это R-R 20 мм.'],['100 в минуту','1500 / 15 = 100 в минуту. Считается в уме за секунду.'],['150 в минуту','150 в минуту — это R-R 10 мм.']],2,'При 25 мм/с делим 1500 на R-R в миллиметрах.'),
 s:[
 T('Сначала паспорт ленты','Прежде чем читать письмо, смотрят, от кого оно. Прежде чем смотреть зубцы, проверь «паспорт» ленты — три числа, как дату: 25.10.12. Скорость 25 мм/с, вольтаж 10 мм/мВ, 12 отведений. Ступенька-метка в начале записи должна быть высотой 10 мм.',{warn:'Если скорость 50 мм/с, всё выглядит вдвое шире. Широкий QRS может оказаться обычным. Если метка не совпала с подписью, запись недостоверна.'}),
 T('РЫЧАГ на ОСИ','Весь разбор укладывается в одну фразу-подсказку: РЫЧАГ на ОСИ. Три шага — ритм, частота, ось, — а потом спокойная прогулка по комплексу слева направо.',{list:[['РЫ','Ритм: правильный ли, синусовый ли'],['ЧА','Частота'],['ОСЬ','Электрическая ось'],['Дальше','Пальцем по комплексу: P → QRS → ST → T → интервалы']]}),
 T('ЧСС за три секунды','За минуту лента проходит 300 больших клеток. Поэтому просто дели 300 на число больших клеток между соседними R — или веди пальцем и приговаривай ряд:',{big:'300 · 150 · 100 · 75 · 60 · 50',note:'Точнее: ЧСС = 1500 / R-R в мм при 25 мм/с и 3000 / R-R при 50 мм/с. Ритм считается правильным, если R-R отличаются не больше чем на 10%. Норму пишут как 60–90 или 60–100 в минуту.',fig:{s:'sinus',marks:true}}),
 A('Между соседними R 4 большие клетки. Какая ЧСС?',[['60 в минуту','60 в минуту — это пять больших клеток.'],['75 в минуту','Верно: 300, 150, 100, 75. Четвёртая большая клетка.'],['100 в минуту','100 в минуту — это три большие клетки.']],1,'Дели 300 на число больших клеток.'),
 T('Синусовый ли ритм','Синусовый ритм — значит, командует СА-узел, как и положено. Его искра летит сверху справа вниз влево, поэтому задай зубцу P три вопроса:',{list:[['Какой знак?','Положительный во II, отрицательный в aVR'],['Где стоит?','Перед каждым QRS'],['Форма?','Одинаковая в этом отведении']]}),
 A('P положительный в aVR. Что это значит?',[['Норма','В норме в aVR всё отрицательное, потому что поток уходит от этого отведения.'],['Ритм, скорее всего, не синусовый','Верно. Импульс идёт не сверху вниз. Вторая частая причина — перепутаны электроды на руках.'],['Высокий вольтаж','Вольтаж меняет высоту зубца, но не его знак.']],1,'Сначала проверь электроды, потом думай о водителе ритма.'),
 {k:'w',w:'leads',h:'Кто что видит',p:['Каждое отведение — глаз, который видит то, что прямо перед ним. Нажми на отведение и посмотри, на какую стенку сердца он смотрит.']},
 T('Две команды отведений','Отведения делятся на две команды, как в перетягивании каната. Что у одной команды поднялось, у другой часто опускается.',{list:[['Левая','I, aVL, V5, V6'],['Правая','III, aVF, V1, V2']]}),
 {k:'w',w:'axis',h:'Покрути электрическую ось',p:['Ось — это одна стрелка, куда в целом бежит волна. Думай о ней как о стрелке компаса, которую притягивает мышца. Крути её и смотри, как меняются комплексы в I, II и III.']},
 T('Ось за секунду','Транспортир не нужен: расставь зубцы R в I, II и III по росту — и порядок цифр сам подскажет ось.',{list:[['Норма','II > I > III: двойка вырвалась вперёд'],['Влево','I > II > III: прямой счёт 1-2-3'],['Вправо','III > II > I: обратный отсчёт 3-2-1']],note:'Способ карандаша из книги: тупой конец к углу ленты, острый на самый высокий R. Наклонно — норма, горизонтально — влево, круто — вправо. Угол оси: норма от +30° до +69°, вертикальная от +70° до +90°, горизонтальная от 0° до +29°, влево до −90°, вправо до +180°. За рубежом нормальной чаще считают зону от −30° до +90°.'}),
 A('R в III выше, чем во II, а во II выше, чем в I. Что с осью?',[['Норма','Норма — двойка впереди: II > I > III.'],['Влево','Влево — прямой счёт: I > II > III.'],['Вправо','Верно, обратный отсчёт 3-2-1.']],2,'Вправо считаем назад.'),
 T('Прогулка по комплексу','Теперь читай комплекс как строчку в книге — слева направо, и к каждому элементу один вопрос.',{list:[['P','до 0,1 с, до 2,5 мм'],['QRS','до 0,1 с, Q меньше ¼ R'],['ST','На изолинии. Допустимо до 0,5 мм вниз в V5–V6 и до 2 мм вверх в V1–V2'],['T','Отрицательный в aVR. Положительный в I, II, aVF, V2–V6. Любой в III, aVL, V1'],['Интервалы','PQ 0,12–0,20 с, QT 0,35–0,44 с']]}),
 T('Холм в грудных отведениях','Пройди по грудным отведениям, как по горе: R растёт от V1 к V4 — это подъём и вершина, — а к V5–V6 немного снижается. Если гора сломалась или вершина сползла, ищи причину.',{fig:{b:'rprog'}})],
 ex:[
 A('Что проверить до анализа зубцов?',[['Паспорт: скорость, вольтаж, метку, отведения','Верно, иначе все измерения будут неверны.'],['Сразу зубец P','Если скорость не та, длительность P окажется ложной.'],['Сегмент ST','ST смотрят позже. Без калибровки его смещение нельзя измерить.']],0,'25 мм/с, 10 мм/мВ, 12 отведений.'),
 A('R-R 30 мм при 25 мм/с. Какая ЧСС?',[['50 в минуту','Верно: 1500 / 30 = 50 в минуту.'],['75 в минуту','75 в минуту — это R-R 20 мм.'],['100 в минуту','100 в минуту — это R-R 15 мм.']],0,'1500 делим на миллиметры.'),
 A('R-R 30 мм при 50 мм/с. Какая ЧСС?',[['50 в минуту','Это расчёт для 25 мм/с.'],['100 в минуту','Верно: 3000 / 30 = 100 в минуту.'],['150 в минуту','150 в минуту — это R-R 20 мм при 50 мм/с.']],1,'При 50 мм/с делим 3000.'),
 A('Какие отведения смотрят на боковую стенку?',[['II, III, aVF','Это нижняя стенка.'],['I, aVL, V5, V6','Верно, это левая команда.'],['V1, V2','Это правые отделы.']],1,'I, aVL, V5, V6 — левая команда.'),
 A('Что обязательно для синусового ритма?',[['P положительный в aVR','Наоборот, в aVR он отрицательный.'],['P положительный во II, перед каждым QRS, одной формы','Верно, все три условия.'],['ЧСС ровно 60–90 в минуту','Синусовый ритм может быть и редким, и частым.']],1,'II да, aVR нет.'),
 A('R в V1–V4 не растёт, вершина холма исчезла. О чём подумать?',[['Всё нормально','В норме R растёт от V1 к V4.'],['О рубце передней стенки или неверной установке электродов','Верно: сначала проверь электроды, потом думай о рубце.'],['О синусовой тахикардии','Частота не влияет на прогрессию R.']],1,'Холм с вершиной в V4.')]},

{n:4,t:'Синусовые аритмии и экстрасистолы',d:'Какой P и какой QRS',ic:'Темп, P и QRS',skill:'узнавать, откуда пришла экстрасистола',
 hook:A('Ровный ритм, и вдруг один широкий уродливый комплекс. Откуда он?',[['Из предсердия','Из предсердия импульс прошёл бы через АВ-узел и нормальные пути, и QRS остался бы узким.'],['Из АВ-узла','От АВ-узла импульс идёт обычным путём, поэтому QRS тоже узкий.'],['Из желудочка','Широкий QRS без зубца P значит, что импульс родился в желудочке и ползёт по мышце, а не бежит по проводящим путям.']],2,'Широкий значит импульс шёл по мышце.',{s:'pvc'}),
 s:[
 T('Синусовые аритмии','Здесь всё по правилам: перед каждым QRS обычный P, командует СА-узел. Меняется только темп — быстрее, медленнее или в такт дыханию. Переключай варианты.',{tabs:[{l:'Тахикардия',s:'sinTachy',x:'Чаще 90 в минуту. Нагрузка, волнение, боль, лихорадка, анемия, гиповолемия.'},{l:'Брадикардия',s:'sinBrady',x:'Реже 60 в минуту. Спортсмены, сон. Бывает при повышенном ВЧД, поражении узла, гипотиреозе.'},{l:'Дыхательная',s:'sinResp',x:'Ритм синусовый, R-R плавают вместе с дыханием. Это вариант нормы, чаще у молодых.'}]}),
 T('Экстрасистола','Экстрасистола — внеочередная искра: удар приходит раньше, чем ждали, поэтому R-R перед ним короче обычного. Чтобы понять, откуда она, хватит двух вопросов: какой перед ней P и какой QRS.',{list:[['Предсердие','P другой, QRS узкий'],['АВ-узел','P нет или отрицательный рядом, QRS узкий'],['Желудочек','P нет, QRS широкий и уродливый']]}),
 T('Посмотри на всех троих','Посмотри на всех трёх «нарушителей» по очереди и найди на ленте подсвеченный признак.',{tabs:[{l:'Предсердная',s:'pac',x:'Раньше срока, P другой формы, QRS обычный: дальше импульс шёл нормальным путём.'},{l:'Из АВ-узла',s:'jpc',x:'Раньше срока, P не видно: предсердия и желудочки возбудились почти одновременно.'},{l:'Желудочковая',s:'pvc',x:'Раньше срока, P нет, QRS шире 0,12 с, T смотрит в другую сторону. После неё длинная пауза.'}]}),
 A('Ранний узкий QRS, перед ним P другой формы. Откуда он?',[['Предсердие','Верно: P есть, значит предсердия возбудились первыми, но не от СА-узла. QRS узкий, значит дальше он шёл обычным путём.'],['АВ-узел','Из АВ-узла зубца P перед QRS обычно нет или он отрицательный при коротком PQ.'],['Желудочек','Желудочковый очаг дал бы широкий QRS.']],0,'Смотри сначала на P, потом на ширину QRS.',{s:'pac'}),
 T('Где очаг в предсердии','Если искра вспыхнула не в СА-узле, а в другом месте предсердий, P меняет форму. Где очаг — подскажет правило фар: волна едет к электроду или от него.',{tabs:[{l:'Вверху',b:'pUp',x:'Импульс идёт вниз, к электроду. P положительный, но отличается от синусового.'},{l:'В середине',b:'pBi',x:'Импульс расходится в обе стороны. P двухфазный.'},{l:'Внизу',b:'pNeg',x:'Импульс идёт вверх, от электрода. P отрицательный.'}]}),
 A('Очаг внизу предсердия. Какой будет P?',[['Положительный','Положительный P получится, когда импульс идёт сверху вниз.'],['Двухфазный','Двухфазный бывает при очаге в середине.'],['Отрицательный','Верно: импульс поднимается вверх, вектор уходит от электрода II.']],2,'Снизу вверх значит зубец вниз.'),
 T('Как они ходят','Иногда внеочередные искры приходят не как попало, а по расписанию — и у каждого расписания своё имя.',{tabs:[{l:'Бигеминия',s:'bigem',x:'Через одну: на каждый нормальный комплекс одна экстрасистола, 1 : 1.'},{l:'Тригеминия',s:'trigem',x:'После каждых двух нормальных, 1 : 2.'},{l:'Парные',s:'couplet',x:'Две подряд. Три и больше подряд уже считают пробежкой тахикардии.'}],note:'Политопные экстрасистолы идут из разных очагов, поэтому отличаются друг от друга. Предсердные и АВ-узловые вместе называют наджелудочковыми.'})],
 ex:[
 A('Что общего у всех экстрасистол?',[['Широкий QRS','Широкий только у желудочковых.'],['R-R перед ней короче обычного','Верно: она приходит раньше срока.'],['Отсутствие P','Предсердная имеет P.']],1,'Экстра значит раньше срока.'),
 A('Что на ленте?',[['Предсердная экстрасистола','У предсердной QRS узкий и перед ним есть P.'],['Желудочковая бигеминия','Верно: широкий комплекс через один.'],['Синусовая аритмия','Там все комплексы одинаковые.']],1,'Через один — бигеминия.',{s:'bigem'}),
 A('Ранний узкий QRS без зубца P. Откуда?',[['Предсердие','У предсердной виден P.'],['АВ-узел','Верно: P скрыт в QRS, средняя часть узла, самый частый вариант.'],['Желудочек','Желудочковый был бы широким.']],1,'Узкий без P — импульс из АВ-узла.',{s:'jpc'}),
 A('ЧСС 110 в минуту, P перед каждым QRS, форма обычная. Что это?',[['Синусовая тахикардия','Верно: всё в норме, только чаще.'],['Предсердная тахикардия','При ней P другой.'],['Желудочковая тахикардия','При ней QRS широкий.']],0,'СА-узел работает, просто чаще.'),
 A('R-R плавно меняются вместе с дыханием, остальное в норме. Что это?',[['Дыхательная аритмия','Верно, вариант нормы.'],['Фибрилляция предсердий','При ней нет P, а R-R хаотичны.'],['Экстрасистолия','При ней есть ранние комплексы.']],0,'Вдох ускоряет, выдох замедляет.')]},

{n:5,t:'Тахикардии и фибрилляции',d:'Три вопроса к любому частому ритму',ic:'Кольцевая развязка, лестница частот',skill:'различать тахикардии по трём вопросам',
 hook:A('Пациент жалуется на сердцебиение. Посмотри на расстояния между R. Что это?',[['Синусовая тахикардия','При ней R-R ровные и перед каждым QRS стоит обычный P.'],['Трепетание предсердий','При трепетании видна ровная пила, R-R чаще одинаковые.'],['Фибрилляция предсердий','Все R-R разные, зубцов P нет, вместо них мелкая рябь.']],2,'Разные R-R и нет P — фибрилляция предсердий.',{s:'af'}),
 s:[
 {k:'w',w:'reentry',h:'Откуда берутся тахикардии',p:['Представь кольцевую развязку из двух дорог с общим началом и концом. Быстрая дорога после каждой машины долго закрыта на уборку, медленная открывается почти сразу.','Внеочередная искра упирается в закрытую быструю дорогу и сворачивает на медленную. Пока она ползёт, быстрая успевает открыться — и искра возвращается по ней назад. Круг замкнулся: искра бегает по кольцу сама, и каждый круг — новый удар. Это re-entry, «повторный вход».','Второй путь проще: где-то появился свой «нетерпеливый» очаг, который жмёт кнопку чаще СА-узла. По обычной ЭКГ эти два механизма обычно не различить.']},
 {k:'w',w:'ladder',h:'Лестница частот',p:['Санитар в шлюзе (АВ-узел) успевает пропустить примерно 220 искр в минуту — это учебный ориентир. Пока искр меньше, каждая получает свой QRS. Больше — начинается давка: часть искр остаётся за дверью.']},
 A('При какой частоте предсердий QRS будет после каждого импульса?',[['180 в минуту','Верно: это ниже предела АВ-узла, проходят все.'],['300 в минуту','Это трепетание: часть импульсов застревает.'],['500 в минуту','Это фибрилляция: АВ-узел пропускает их беспорядочно.']],0,'До 220 импульсов в минуту проходят все.'),
 T('Три вопроса к любой тахикардии','Не нужно заучивать десяток картинок. Три вопроса по порядку — и ответ сложится сам:',{list:[['1. QRS','Узкий или широкий?'],['2. R-R','Ровные или разные?'],['3. P','Что стоит вместо обычного P?']]}),
 T('Узкие тахикардии','QRS узкий — значит, искры идут обычной дорогой через шлюз. Разница только в том, что творится наверху, в предсердиях. Переключай и ищи подсвеченный признак.',{tabs:[{l:'Предсердная',s:'atTachy',x:'Ровно, узко, перед каждым QRS другой P, он часто наслаивается на T. 120–220 в минуту.'},{l:'Из АВ-соединения',s:'avTachy',x:'Ровно, узко, P не виден. С предсердной их часто не различить, поэтому их объединяют: наджелудочковая тахикардия.'},{l:'Трепетание',s:'flutter',x:'Пила из волн F, 240–340 в минуту. QRS не после каждой волны. Здесь проведение 4 : 1.'},{l:'Фибрилляция',s:'af',x:'Нет P, рябь f 350–600 в минуту, все R-R разные. Старое название — мерцательная аритмия.'}]}),
 T('Широкие: тут счёт на минуты','Широкий частый QRS — значит, команды рождаются прямо в желудочках, мимо проводки. Это три ступеньки вниз, к остановке сердца, и первым делом — посмотри на пациента.',{tabs:[{l:'Желудочковая тахикардия',s:'vt',x:'ЖТ: широкие одинаковые комплексы, R-R ровные, ЧСС больше 100 в минуту. Угроза жизни.'},{l:'Трепетание желудочков',s:'vflutter',x:'Сплошная синусоида, QRS и T не отделить, примерно 250–350 в минуту. Почти фибрилляция.'},{l:'Фибрилляция желудочков',s:'vf',x:'ФЖ: хаос без комплексов. Остановка кровообращения: нужна дефибрилляция.'}]}),
 A('Широкие одинаковые комплексы, R-R ровные, ЧСС 170 в минуту. Что это?',[['Фибрилляция предсердий','При ней R-R разные, а QRS обычно узкий.'],['Желудочковая тахикардия','Верно: широкая, ровная, частая. Считай это ЖТ, пока не доказано другое.'],['Синусовая тахикардия','При ней QRS узкий и есть P.']],1,'Широкая ровная тахикардия — ЖТ до доказательства обратного.',{s:'vt'})],
 ex:[
 A('Что на ленте?',[['Трепетание предсердий','Верно: ровная пила, QRS не после каждой волны.'],['Фибрилляция предсердий','Рябь была бы хаотичной, а R-R разными.'],['Предсердная тахикардия','Там QRS после каждого P.']],0,'Трепетание — ровная пила.',{s:'flutter'}),
 A('Какие условия нужны для re-entry?',[['Два пути с разной скоростью и рефрактерностью','Верно: они создают круг.'],['Высокая температура','Это может быть фоном, но не механизмом.'],['Только блокада ножки','Она не создаёт круга сама по себе.']],0,'Быстрая дорога долго отдыхает, медленная быстро.'),
 A('Что на ленте?',[['Желудочковая тахикардия','При ЖТ есть различимые широкие комплексы.'],['Фибрилляция желудочков','Верно: хаос без комплексов.'],['Артефакт от дрожи','Артефакт возможен, поэтому всегда смотри на пациента. Но здесь выбираем ритм.']],1,'Нет комплексов — ФЖ. Проверь пациента.',{s:'vf'}),
 A('Узко, ровно, 190 в минуту, P не виден. Что это?',[['Тахикардия из АВ-соединения','Верно, вместе с предсердной это наджелудочковая тахикардия.'],['ЖТ','QRS был бы широким.'],['Фибрилляция предсердий','R-R были бы разными.']],0,'Узкая и ровная — очаг выше желудочков.',{s:'avTachy'}),
 A('Можно ли по одной ленте отличить постоянную форму от пароксизмальной?',[['Да, по частоте','Частота этого не говорит.'],['Нет, нужен анамнез','Верно: на одной ленте разницы нет.'],['Да, по ширине QRS','Ширина QRS не связана с длительностью аритмии.']],1,'Лента показывает момент, анамнез показывает историю.')]},

{n:6,t:'СА- и АВ-блокады',d:'Где застрял импульс',ic:'Степени, Мобитц 1 и 2',skill:'отличать СА-блокады от АВ-блокад и Мобитц 1 от Мобитц 2',
 hook:A('P идут ровно, а QRS иногда исчезает. Посмотри на PQ перед паузой. Что это?',[['Мобитц 1','PQ растёт от удара к удару, потом QRS выпадает, и цикл начинается снова.'],['Мобитц 2','При Мобитц 2 PQ не меняется, QRS выпадает внезапно.'],['Полная АВ-блокада','При полной блокаде P и QRS вообще не связаны.']],0,'PQ растёт — Мобитц 1.',{s:'w1'}),
 s:[
 T('Степени всегда одни и те же','Где бы ни стояла «плохая дверь», степени одни и те же — как у охранника на проходной:',{list:[['I степень','Задерживает, но пропускает всё'],['II степень','Теряет часть импульсов'],['III степень','Не пропускает ничего']]}),
 T('Главное отличие','В паузе первым делом ищи P. Он — знак, что искра вылетела из кабинета заведующего и долетела до предсердий:',{list:[['СА-блокада','Исчезает весь цикл вместе с P'],['АВ-блокада','P на месте, исчезает только QRS']]}),
 T('АВ-блокады','Представь санитара в шлюзе: от того, как он держит искру, зависит интервал PQ. Переключай и следи за PQ.',{tabs:[{l:'I степень',s:'av1',x:'Импульс задерживается, но проходит всегда. PQ больше 0,2 с, каждый P с QRS.'},{l:'Мобитц 1',s:'w1',x:'PQ всё длиннее, потом QRS выпал, и всё сначала. Обычно уровень АВ-узла.'},{l:'Мобитц 2',s:'w2',x:'PQ тот же, а QRS внезапно выпал. Опаснее: может перейти в полную блокаду.'},{l:'III степень',s:'av3',x:'P идут своим ритмом, QRS своим, более редким. Связи между ними нет.'}]}),
 A('P есть, QRS выпал, все PQ перед этим одинаковые. Что это?',[['Мобитц 1','При Мобитц 1 PQ постепенно удлиняется.'],['Мобитц 2','Верно: PQ постоянный, выпадение внезапное.'],['СА-блокада','При СА-блокаде P тоже исчез бы.']],1,'Ровные PQ и внезапная пауза — Мобитц 2.',{s:'w2'}),
 T('Если выпал каждый второй','Чтобы понять тип, нужно увидеть, как санитар ведёт себя перед тем, как уронить искру: устаёт постепенно или роняет внезапно. А при 2 : 1 проходит каждый второй P — двух проведённых ударов подряд нет, сравнивать нечего. Поэтому тип по такой ленте не назвать.',{warn:'Блокада 2 : 1 — особый случай. Запиши длиннее: часто рядом находятся участки 3 : 2, и тип становится виден.'}),
 T('СА-блокады','При СА-блокаде искра не вылетает из кабинета заведующего. Снаружи видна только пауза — и её длина подсказывает тип.',{tabs:[{l:'II, тип 2',s:'saM2',x:'Выпал весь цикл с P, пауза ровно 2 R-R. Если выпало несколько, пауза кратна R-R.'},{l:'II, тип 1',s:'saM1',x:'R-R постепенно укорачиваются, потом пауза меньше 2 R-R.'}],note:'СА-блокада I степени на обычной ЭКГ не видна: узел на ней не записывается. При III степени работает другой водитель или лента становится прямой.'}),
 A('Исчез весь цикл вместе с P, пауза ровно 2 R-R. Что это?',[['АВ-блокада Мобитц 2','При АВ-блокаде зубец P остался бы на месте.'],['СА-блокада II, тип 2','Верно: нет P, значит приказ не вышел из кабинета.'],['Экстрасистола','Экстрасистола приходит раньше срока, а тут пауза.']],1,'Нет P — причина в СА-узле.',{s:'saM2'}),
 T('Если СА-узел молчит','Заведующий замолчал — но операции не останавливаются: свою запасную кнопку нажимает тот, кто ниже. Чем ниже запасной водитель, тем реже и ненадёжнее ритм. Это спасательный круг, а не враг.',{list:[['Предсердия','Несинусовый P'],['АВ-узел','Нет P, узкий QRS, 40–60 в минуту'],['Желудочки','Нет P, широкий QRS, 20–40 в минуту']],note:'Внутрипредсердная блокада: импульс тормозит между узлами. Главный признак: P шире 0,1 с.'})],
 ex:[
 A('Что на ленте?',[['АВ-блокада I степени','Верно: PQ длинный, все P проведены.'],['Мобитц 1','При нём PQ растёт и QRS выпадает.'],['Норма','PQ больше одной большой клетки, это не норма.']],0,'Импульс задерживается, но проходит.',{s:'av1'}),
 A('Что на ленте?',[['Мобитц 2','При Мобитц 2 P и QRS связаны.'],['Полная АВ-блокада','Верно: P и QRS идут каждый в своём ритме.'],['СА-блокада','При ней нет P, а тут они есть.']],1,'Рельсы разобраны: P и QRS живут отдельно.',{s:'av3'}),
 A('Какая блокада опаснее?',[['Мобитц 1','Обычно он доброкачественнее.'],['Мобитц 2','Верно: чаще лежит ниже АВ-узла и может внезапно перейти в полную блокаду.'],['I степень','Обычно это находка без симптомов.']],1,'Внезапная отмена опаснее накопленных опозданий.'),
 A('Почему СА-блокаду I степени нельзя увидеть?',[['Она встречается редко','Дело не в частоте.'],['Работа узла на поверхностной ЭКГ не записывается','Верно: первым видимым событием является P.'],['Она бывает только ночью','Время суток здесь ни при чём.']],1,'Что было до P, на ленте не видно.'),
 A('Каждый второй P без QRS. Какой тип блокады?',[['Точно Мобитц 1','Сравнить PQ не с чем.'],['Точно Мобитц 2','Сравнить PQ не с чем.'],['По этой ленте не определить','Верно: блокада 2 : 1, нужны два подряд проведённых PQ.']],2,'2 : 1 — тип неясен.')]},

{n:7,t:'Блокады ножек Гиса',d:'Буква М, поворотник, задний ход',ic:'Правая, левая, ветви',skill:'видеть блокаду ножки за секунду',
 hook:A('Отведение V1, QRS 0,14 с. Какая ножка заблокирована?',[['Правая','Буква М в правом отведении и хвост QRS вверх: блокада правой ножки.'],['Левая','При левой в V1 был бы глубокий S и хвост вниз.'],['Обе целы','QRS 0,14 с — это широкий комплекс.']],0,'М живёт там, где блокада.',{b:'rbbbV1'}),
 s:[
 T('Почему QRS становится широким','В норме искра влетает в обе двери одновременно, и свет в обеих операционных вспыхивает разом — QRS узкий. Если одна дверь заперта, вторая операционная загорается первой, а первая ждёт, пока искра доползёт к ней сквозь стену, по мышце. Желудочки срабатывают по очереди — QRS шире 0,12 с, а его «хвост» указывает на опоздавшую, больную сторону.',{}),
 T('Буква М живёт там, где блокада','Смотри в две точки: V1 (справа у грудины) и V6 (на левом боку). Буква М появляется там, где больная сторона: правая ножка — М в V1, левая — М в V6.',{tabs:[{l:'Правая, V1',b:'rbbbV1',x:'rsR′: заячьи уши. ST вниз, T отрицательный.'},{l:'Правая, V6',b:'rbbbV6',x:'qRS с широким незаострённым S.'},{l:'Левая, V6',b:'lbbbV6',x:'Широкий зазубренный R, ST вниз, T отрицательный.'},{l:'Левая, V1',b:'lbbbV1',x:'Маленький r или QS, глубокий S, ST вверх.'}]}),
 T('Поворотник в V1','Если буквы М не разглядеть, есть быстрая проверка: посмотри на самый конец широкого QRS в V1, как на рычаг поворотника.',{list:[['Хвост вверх','Рычаг поворотника вверх: поворот направо, правая ножка'],['Хвост вниз','Рычаг вниз: поворот налево, левая ножка']]}),
 A('QRS широкий, хвост в V1 смотрит вниз. Какая ножка?',[['Правая','При правой хвост смотрит вверх.'],['Левая','Верно: поворотник вниз, поворот налево.']],1,'Вверх направо, вниз налево.',{b:'lbbbV1'}),
 T('Полная или неполная','Сторону блокады показывает форма, а насколько она сильная — ширина QRS. Новых цифр не нужно: всё те же три маленькие клетки.',{list:[['Неполная','QRS 0,10–0,12 с'],['Полная','QRS больше 0,12 с']],warn:'При полной блокаде изменения ST и T вторичны и сами по себе не значат ишемию. Но блокада может скрывать инфаркт, особенно левая. Важны клиника и старая плёнка. Для этого есть отдельные критерии, например Сгарбосса, они вне этого курса.'}),
 T('Ветви левой ножки','Левая дверь двустворчатая. Закрой одну створку — искра всё равно влетит через вторую и быстро обежит операционную по внутренним мостикам. Поэтому QRS почти не расширяется. Выдаёт блокаду ветви только резкий сдвиг оси — туда, где свет вспыхивает последним.',{list:[['Передняя','Ось ≤ −60°, S больше R во II, III, aVF'],['Задняя','Ось ≥ +120°, S больше R в I, aVL']]}),
 A('Ось −75°, S больше R во II, QRS узкий. Какая ветвь?',[['Передняя','Верно: резко влево, S больше R в нижних отведениях.'],['Задняя','Задняя дала бы ось вправо.']],0,'Задний ход — вправо.')],
 ex:[
 A('Что значит QRS 0,11 с с формой rsR′ в V1?',[['Полная блокада правой ножки','Для полной нужен QRS больше 0,12 с.'],['Неполная блокада правой ножки','Верно: форма есть, ширина 0,10–0,12 с.'],['Блокада левой ножки','Форма в V1 указывает на правую.']],1,'Форма показывает сторону, ширина — степень.'),
 A('Что на этом отведении V6?',[['Блокада левой ножки','Верно: широкий зазубренный R, ST вниз, T отрицательный.'],['Блокада правой ножки','При правой в V6 был бы широкий S.'],['Норма','QRS здесь широкий.']],0,'М слева — левая.',{b:'lbbbV6'}),
 A('Почему при блокаде ветви QRS почти не расширен?',[['Импульс обходит препятствие по анастомозам','Верно, обход быстрый.'],['Ветви не проводят импульс','Проводят, просто одна заблокирована.'],['Из-за высокой ЧСС','Частота не влияет на этот признак.']],0,'Импульс быстро объезжает по анастомозам.'),
 A('Какая комбинация блокад самая частая?',[['Правая ножка и передняя ветвь','Верно: две хрупкие двери.'],['Левая ножка и задняя ветвь','Эта пара встречается редко.'],['Задняя и передняя ветви','Это фактически левая ножка.']],0,'Правая ножка и передняя ветвь — два слабых места.'),
 A('ST вниз и T отрицательный в V5–V6 при полной блокаде левой ножки. Что это?',[['Точно ишемия','Нельзя: это обычно вторичные изменения.'],['Вторичные изменения, но клинику всё равно оцениваем','Верно: сама блокада их объясняет, а скрытый инфаркт она не исключает.'],['Норма без блокады','При блокаде это не норма, а её следствие.']],1,'Блокада объясняет ST и T, но может скрывать инфаркт.')]},

{n:8,t:'Гипертрофии',d:'Мышца выросла, сосуды отстали',ic:'Громче, голоднее, медленнее',skill:'находить гипертрофию любого отдела',
 hook:A('Широкий двугорбый P. Какое предсердие перегружено?',[['Правое','Правое дало бы высокий острый P без расширения.'],['Левое','Левое предсердие даёт конец зубца. Оно возбуждается дольше, и появляется второй горб: P mitrale.'],['Оба одинаково','Такое бывает, но тогда P и высокий, и широкий.']],1,'P mitrale похож на букву М.',{b:'pMitr'}),
 s:[
 T('Перекачанная мышца','Представь спортсмена, который накачал огромные мышцы, а сосуды за ними не выросли. У любой гипертрофии четыре общих признака — четыре слова:',{list:[['Громче','Выше R или P'],['Голоднее','Субэндокардиальная ишемия: ST вниз'],['Медленнее','Проводимость страдает, зубец шире, бывают блокады'],['Тянет к себе','Ось уходит в сторону гипертрофии']]}),
 T('Предсердия: пик или верблюд','Всё следует из одного правила: правое предсердие рисует начало P, левое — конец. Выросло правое — растёт начало, и P становится острым пиком. Выросло левое — затягивается конец, и у P появляется второй горб, как у верблюда.',{tabs:[{l:'P pulmonale',b:'pPulm',x:'Правое предсердие. Высокий острый, больше 2–2,5 мм, не шире нормы. II, III, aVF. Лёгочная патология.'},{l:'P mitrale',b:'pMitr',x:'Левое предсердие. Двугорбый, шире 0,10–0,12 с. I, II, aVL, V5, V6. Митральные пороки.'}]}),
 A('Высокий острый P 3 мм во II. Какое предсердие?',[['Правое','Верно: правое — пик. Часто при лёгочной патологии.'],['Левое','Левое дало бы широкий двугорбый P.']],0,'Правое — Пик.',{b:'pPulm'}),
 T('Левый желудочек','Гипертрофия левого желудочка (ГЛЖ). Самый мощный желудочек стал ещё мощнее, и его голос заглушает всё остальное. В левых отведениях (V5–V6) R огромный, а в правых (V1–V2) зеркально глубокий S.',{tabs:[{l:'V6',b:'lvhV6',x:'Высокий R, ST вниз, T отрицательный.'},{l:'V1',b:'lvhV1',x:'Глубокий S, ST зеркально вверх.'}],list:[['Индекс Соколова–Лайона','S в V1 + R в V5 или V6 ≥ 35 мм'],['Вершина холма','R в V6 > R в V5 > R в V4']],warn:'Индекс плохо работает у молодых и худых, а отрицательный результат не исключает гипертрофию.'}),
 T('Правый желудочек','Гипертрофия правого желудочка (ГПЖ). Правый желудочек в норме тонкий и «тихий» — его почти не слышно за мощным левым. Поэтому на ленте он проявляется, только когда вырос заметно и начал перевешивать.',{list:[['R в V1–V2','больше 7 мм'],['Глубокий S','в V5–V6'],['Сумма','R в V1 + S в V5 или V6 больше 10,5 мм'],['Дополнительно','T отрицательный и ST вниз в V1, ось вправо']]}),
 A('S в V1 20 мм, R в V5 22 мм. Что с индексом Соколова–Лайона?',[['Норма','Сумма считается как 20 + 22.'],['42 мм, признак ГЛЖ','Верно: больше 35 мм. Но у молодого худого человека цифра может обмануть.']],1,'S в V1 + R в V5 или V6 от 35 мм.')],
 ex:[
 A('Какие признаки общие для гипертрофий?',[['Амплитуда, ишемия, проводимость, ось','Верно: громче, голоднее, медленнее, тянет к себе.'],['Только высокий R','Это только один признак из четырёх.'],['Удлинение PQ','Оно не относится к признакам гипертрофии.']],0,'Громче, голоднее, медленнее, тянет к себе.'),
 A('Почему при гипертрофии бывает депрессия ST?',[['Мышца не успевает получить кровь','Верно: субэндокардиальные слои страдают первыми.'],['Сердце работает слабо','Причина не в слабости.'],['Это артефакт','Это реальное изменение.']],0,'Мышца выросла, а кровь до внутреннего слоя не дотягивается.'),
 A('Почему ГПЖ видна поздно?',[['Правый желудочек должен перевесить левый','В норме масса левого намного больше, и его вектор заглушает правый. Пока правый его не перевесит, на ленте почти ничего не видно.'],['Она редкая','Частота здесь ни при чём.'],['V1 плохо записывается','V1 записывается обычным образом.']],0,'Правый виден, только когда перевесит левого.'),
 A('Что такое P mitrale?',[['Высокий острый P','Это P pulmonale.'],['Двугорбый широкий P','Верно: левое предсердие.'],['Отрицательный P','Это про другое.']],1,'P mitrale похож на букву М: два горба, как у верблюда.'),
 A('R в V6 > R в V5 > R в V4. О чём это говорит?',[['Норма','В норме вершина холма в V4.'],['Признак ГЛЖ','Верно: вершина сползла влево.'],['Блокада правой ножки','Это другая картина.']],1,'Вершина холма R сползла от V4 к V6: мышца слева выросла.')]},

{n:9,t:'Инфаркт: зоны и стадии',d:'Дым, огонь и угли',ic:'Дым, огонь, угли',skill:'читать зоны и стадии инфаркта',
 hook:A('Боль за грудиной началась час назад. Что лежит под этим электродом?',[['Старый рубец','При рубце ST на изолинии, а Q остаётся.'],['Трансмуральное повреждение','Высокий подъём ST, слитый с T, — кошачья спинка. Острейшая стадия.'],['Только ишемия','Ишемия меняет только T, а здесь поднят весь ST.']],1,'Кошачья спинка значит трансмуральное повреждение.',{b:'stCat'}),
 s:[
 {k:'w',w:'zones',h:'Три зоны инфаркта',p:['Каждая зона пожара оставляет свой след на комплексе: дым (ишемия) — T, огонь (повреждение) — ST, угли (некроз) — Q. Нажимай на зоны и смотри.']},
 T('Два правила вместо девяти рисунков','Электрод стоит снаружи сердца: наружная стенка рядом с ним, внутренняя — далеко. Запомни две фразы — и девять рисунков из учебника выведешь сам.',{list:[['ST тянется к огню (повреждению)','Огонь у наружной стенки, рядом: ST вверх. Огонь у внутренней стенки, далеко: ST вниз'],['T отворачивается от дыма (ишемии)','Дым у наружной стенки, рядом: T отрицательный. Дым у внутренней стенки, далеко: T высокий']]}),
 T('Ишемия меняет T','Ишемия — это дым: клетке не хватает кислорода, но она жива. Ей тяжело «поднимать книги» после каждого удара, поэтому меняется зубец T. А T от дыма отворачивается.',{tabs:[{l:'Субэндокардиальная',b:'tPeak',x:'Дым далеко от электрода: T бежит к нему, высокий и острый.'},{l:'Субэпикардиальная',b:'tNeg',x:'Дым рядом: T убегает, отрицательный.'},{l:'Трансмуральная',b:'tDeep',x:'Вся толща: T глубокий отрицательный.'}]}),
 T('Повреждение меняет ST','Повреждение — это огонь: клетки на грани гибели и плохо держат заряд. Сегмент ST сдвигается и тянется к огню — а значит, по нему видно, где горит.',{tabs:[{l:'Субэндокардиальное',b:'stDown',x:'Огонь далеко: ST вниз.'},{l:'Субэпикардиальное',b:'stUp',x:'Огонь рядом: ST вверх.'},{l:'Трансмуральное',b:'stCat',x:'Высокий подъём ST, слитый с T: кошачья спинка.'}]}),
 A('Огонь под эндокардом, электрод снаружи. Куда пойдёт ST?',[['Вверх','Вверх он пойдёт, если огонь рядом с электродом.'],['Вниз','Верно: ST тянется к огню, а он с дальней стороны стенки.']],1,'ST тянется к огню.',{b:'stDown'}),
 T('Некроз меняет Q','Некроз — это угли: мышца погибла и электрически молчит. Для электрода мёртвая ткань — как окно в стене. Сквозь него он видит противоположную стенку, а волна там уезжает от него — отсюда глубокий Q.',{tabs:[{l:'Трансмуральный',b:'qs',x:'Только QS: нет ни R, ни T.'},{l:'Нетрансмуральный',b:'qPath',x:'Патологический Q: глубже ¼ R и шире 0,03 с. R снижен.'},{l:'Без Q',b:'noQ',x:'При интрамуральном или субэндокардиальном некрозе Q может не быть.'}]}),
 {k:'w',w:'stage',h:'Как инфаркт идёт во времени',p:['Инфаркт меняется со временем, как пожар: бушует огонь, потом валит дым, в конце остаются угли. Двигай ползунок и смотри, как меняется лента. Сроки — ориентиры: три тройки, 3 суток, 3 недели, 3 месяца.']},
 A('Q патологический, ST на изолинии, T обычный. Что это?',[['Острейшая стадия','В острейшей ST поднят.'],['Подострая стадия','В подострой T глубокий отрицательный.'],['Рубец','Верно: ST ушёл, T ушёл, Q остался.']],2,'Сначала гаснет огонь, потом уходит дым, а угли остаются навсегда.',{b:'qPath'}),
 T('Цифры и ловушки','Когда подъём ST считать настоящим? Меряют в точке J — там, где кончается QRS, — и подъём должен быть минимум в двух соседних отведениях. Пороги такие:',{list:[['Почти везде','от 1 мм'],['V2–V3, мужчины до 40 лет','от 2,5 мм'],['V2–V3, мужчины от 40 лет','от 2 мм'],['V2–V3, женщины','от 1,5 мм']],warn:'Нормальная ЭКГ инфаркт не исключает. Похожие изменения бывают при ТЭЛА, миокардите, электролитных нарушениях, инсульте, панкреатите. Диагноз ставят по клинике, маркерам и другим данным вместе.'})],
 ex:[
 A('Какая зона меняет только реполяризацию?',[['Ишемия','Верно, поэтому меняется T.'],['Повреждение','Оно нарушает и де-, и реполяризацию.'],['Некроз','В некрозе нет ни того, ни другого.']],0,'Дым — ишемия — T.'),
 A('Подъём ST и отрицательный T. Что лежит под электродом?',[['Субэпикардиальное повреждение и ишемия','Верно: огонь и дым рядом с электродом.'],['Субэндокардиальная ишемия','Она дала бы высокий T.'],['Только рубец','При рубце ST на изолинии.']],0,'Признаки складываются: ST тянется к огню, T убегает от дыма.'),
 A('Что на этом отведении?',[['Трансмуральный некроз','Верно: только QS.'],['Ишемия','Ишемия меняет только T.'],['Блокада ножки','Здесь нет широких зазубрин.']],0,'Угли не возбуждаются: электрод видит только QS.',{b:'qs'}),
 A('Что значит патологический Q, ST вверх и отрицательный T?',[['Острая стадия','Верно: некроз сформирован, ST снижается, появилась ишемия.'],['Рубец','При рубце ST на изолинии.'],['Норма','Здесь три изменения сразу.']],0,'Признаки складываются.'),
 A('Боль есть, ЭКГ нормальная. Инфаркт исключён?',[['Да','Нормальная ЭКГ инфаркт не исключает.'],['Нет, нужна динамика и маркеры','Верно: повторная ЭКГ и тропонин.'],['Да, если нет Q','Q появляется не сразу и бывает не всегда.']],1,'Лента — один момент, а инфаркт — процесс.')]},

{n:10,t:'Где инфаркт',d:'Пол, стена, фасад и зеркало',ic:'Карта отведений',skill:'определять стенку инфаркта и отличать зеркало',
 hook:A('В III подъём ST, а в V2 депрессия. Сколько тут инфарктов?',[['Один, второе — зеркало','Один инфаркт нижней стенки. V2 видит дальнюю стенку наоборот, поэтому показывает депрессию.'],['Два разных','Обычно это один процесс и его зеркальное отражение.'],['Ни одного','Подъём ST с Q и отрицательным T похож на инфаркт.']],0,'Депрессия напротив подъёма — зеркало.',{b:'recip'}),
 s:[
 {k:'w',w:'loc',h:'Карта инфарктов',p:['Выбери, где случился инфаркт, и посмотри, какие отведения-камеры «загораются» на обычной ленте.']},
 T('Пол, стена, фасад','Вместо шести таблиц запомни одну комнату — и войди в неё мысленно:',{list:[['Пол','II, III, aVF: нижний инфаркт'],['Стена','I, aVL, V5, V6: боковая'],['Фасад','V1–V4: от перегородки к верхушке']]}),
 A('Подъём ST в I, aVL, V5, V6. Какая стенка?',[['Нижняя','Нижняя — II, III, aVF.'],['Боковая','I, aVL, V5, V6 — левая команда. Они смотрят на боковую стенку левого желудочка.'],['Перегородка','Перегородка — V1–V3.']],1,'Левая команда — боковая стена.'),
 T('Зеркало','Подними перед зеркалом правую руку — отражение поднимет другую. Электрод видит дальнюю стенку сердца насквозь, «в зеркале»: подъём ST там выглядит у него как депрессия. Это и есть реципрокные, зеркальные изменения.',{fig:{b:'recip'}}),
 A('Депрессия ST в V1–V3 и подъём во II, III, aVF. Что первично?',[['Подъём','Верно: подъём показывает зону инфаркта, депрессия здесь, скорее всего, зеркало.'],['Депрессия','Депрессия в этой паре обычно вторична.']],0,'Ищи подъём, потом проверяй зеркало.'),
 T('Смотри все двенадцать','Двенадцать отведений — как фонарь, который светит не во все углы. Задняя стенка, например, прямо не видна, зато её зеркало видно спереди: депрессия ST в V1–V4.',{warn:'Иногда нужны дополнительные электроды: V7–V9 для задней стенки, V3R–V4R для правого желудочка.'})],
 ex:[
 A('Подъём ST во II, III, aVF. Какая стенка?',[['Нижняя','II, III и aVF смотрят на сердце снизу, поэтому это нижняя, или заднедиафрагмальная, стенка. Обычно это бассейн правой коронарной артерии.'],['Передняя','Передняя — V1–V4.'],['Боковая','Боковая — I, aVL, V5, V6.']],0,'II, III, aVF — это пол дома.'),
 A('Признаки в V1–V3. Какой инфаркт?',[['Переднеперегородочный','V1–V3 смотрят на перегородку и переднюю стенку. Признаки здесь означают, что поражена именно эта зона.'],['Нижний','Нижний — II, III, aVF.'],['Боковой','Боковой — I, aVL, V5, V6.']],0,'V1–V3 — левая часть фасада.'),
 A('Признаки в V3–V4. Какой инфаркт?',[['Передневерхушечный','V3–V4 смотрят на переднюю стенку ближе к верхушке, туда же, где стоит вершина холма R.'],['Нижний','Это II, III, aVF.'],['Заднебоковой','Это II, III, aVF, V5, V6.']],0,'V3–V4 — вершина холма R, рядом верхушка.'),
 A('Признаки в I, aVL и всех V1–V6. Какой инфаркт?',[['Распространённый передний','Захвачены и все грудные, и I с aVL: фасад вместе с боковой стеной. Зона большая.'],['Нижний','Нижний — II, III, aVF.'],['Только боковой','Здесь захвачен весь фасад.']],0,'Весь фасад и стена — большая зона.'),
 A('Почему задняя ишемия даёт высокий T в V1–V2?',[['Дальняя стенка видна как субэндокардиальная','Для электрода V1–V2 задняя стенка лежит на дальней стороне. Ишемия там выглядит как субэндокардиальная, а она даёт высокий T.'],['Это норма','Высокий T здесь не норма.'],['Из-за блокады','Блокады здесь нет.']],0,'В зеркале напротив всё наоборот.')]},

{n:11,t:'WPW и LGL',d:'Чёрный ход и служебный лифт',ic:'Короткий PQ, дельта-волна',skill:'узнавать WPW и LGL',
 hook:A('Молодой пациент с приступами сердцебиения. Между приступами такая лента. Что необычно?',[['Длинный PQ','PQ здесь, наоборот, короткий.'],['Короткий PQ и пологое начало QRS','Импульс идёт в обход АВ-узла, поэтому PQ короткий, а начало QRS пологое: это дельта-волна.'],['Отсутствие зубца P','Зубец P на месте.']],1,'Короткий PQ + дельта = WPW.',{s:'wpw'}),
 s:[
 T('Обходной путь','Обычно дорога к желудочкам одна — через шлюз. Но иногда с рождения есть обходной путь:',{list:[['WPW, пучок Кента','Синдром Вольфа — Паркинсона — Уайта: пучок соединяет предсердие с желудочком напрямую'],['LGL, пучок Джеймса','Синдром Лауна — Ганонга — Левина: путь проскакивает задержку, дальше обычная дорога']]}),
 T('Посмотри разницу','Сравни, как начинается QRS: через чёрный ход или через служебный лифт.',{tabs:[{l:'WPW',s:'wpw',x:'PQ меньше 0,12 с, дельта-волна, широкий QRS.'},{l:'LGL',s:'lgl',x:'PQ меньше 0,12 с, QRS обычный, дельты нет.'}]}),
 T('Откуда берётся дельта','Искра летит сразу двумя путями. Через чёрный ход, пучок Кента, она попадает в желудочек раньше, но мимо проводки и ползёт по мышце — зубец растёт лениво, полого: это дельта-волна. Потом подлетает искра обычным путём через шлюз и быстро дорисовывает остальной QRS.',{fig:{s:'wpw',marks:true}}),
 A('PQ 0,09 с, QRS нормальный, дельты нет. Что это?',[['WPW','При WPW была бы дельта-волна и широкий QRS.'],['LGL','Верно: короткий PQ, больше ничего.'],['АВ-блокада','При блокаде PQ удлинён, а не укорочен.']],1,'LGL — лёгкая версия.',{s:'lgl'}),
 T('Почему это важно','Чёрный ход открыт в обе стороны. Вместе с обычным шлюзом он образует готовое кольцо — и искра может бегать по нему кругами. Так рождаются приступы тахикардии.',{warn:'Фибрилляция предсердий (ФП) при WPW опасна: предел АВ-узла не действует, импульсы идут через пучок Кента, ритм может перейти в ФЖ. Препараты, блокирующие АВ-узел, могут навредить. Тактику сверяй с рекомендациями.'})],
 ex:[
 A('Три признака WPW?',[['Короткий PQ, дельта, широкий QRS','PQ короткий, потому что импульс обошёл АВ-узел. Дельта — медленный старт через мышцу. QRS широкий, потому что он сливной.'],['Длинный PQ, узкий QRS','Это другое.'],['Нет P, разные R-R','Это фибрилляция предсердий.']],0,'Подсказка для памяти: WPW — Волна Пологая Вначале.'),
 A('Какой пучок при WPW?',[['Кента','Пучок Кента напрямую соединяет предсердие с желудочком, минуя АВ-узел. Это и есть чёрный ход.'],['Джеймса','Джеймс — это LGL.'],['Гиса','Гис — это обычный путь.']],0,'Кент — Короткий.'),

1:{sut:'Каждый удар сердца — это путешествие одной искры. Она вспыхивает наверху, в СА-узле, пролетает предсердия, на миг замирает в АВ-узле и разлетается по желудочкам. Вся ЭКГ — это след, который искра оставляет на ленте.',
 deep:['Запасные кнопки есть по всей проводящей системе, просто чем ниже, тем реже их жмут. Главный — СА-узел, потому что он самый быстрый. Замолчит он — кнопку нажмёт следующий, медленнее. Поэтому при поломке наверху сердце обычно не останавливается: у него всегда есть запасной водитель.','ЭКГ «слышит» только громкое — то, что делает большая масса мышцы. Узлы и пучки крошечные, их шёпота на коже не слышно. Поэтому после P линия ровная, хотя искра в это время вовсю работает в АВ-узле.','Электрод не заглядывает в сердце — он чувствует разность потенциалов на коже. Каждое отведение — это взгляд на сердце с одной точки, как камера в комнате. Из 10 электродов получается 12 камер, и вместе они дают объёмную картину.'],

2:{sut:'Лента — это рассказ в трёх главах. P — проснулись предсердия, QRS — сработали желудочки, T — желудочки отдыхают и восстанавливаются. А вверх или вниз смотрит зубец, зависит от одного: едет волна к электроду или от него.',
 deep:['Вектор — это стрелка, куда в целом бежит волна. Каждое отведение — глаз на обочине: волна к нему — зубец вверх, от него — вниз. Поэтому одно и то же сердце в разных отведениях выглядит по-разному, и это норма: люди просто стоят в разных местах дороги.','Возбуждение называют деполяризацией, восстановление — реполяризацией. QRS узкий, потому что искра летит по «скоростной проводке» — ножкам и волокнам Пуркинье. Если ей приходится ползти по обычной мышце, от клетки к клетке, QRS расширяется. Эта мысль объясняет половину всей ЭКГ.','QT — это вся «смена» желудочков: от рывка до полного отдыха. Чем чаще бьётся сердце, тем короче смена, поэтому QT всегда оценивают с поправкой на частоту.'],
 know:[['Малая клетка при 25 мм/с','0,04 с'],['Большая клетка','0,2 с'],['P','до 0,10 с, до 2,5 мм'],['QRS','до 0,10 с'],['Широкий QRS','от 0,12 с'],['PQ','0,12–0,20 с'],['QT','около 0,44 с, оценивают QTc'],['Q в норме','меньше ¼ R']],
 read:['Найди один чистый комплекс.','Отметь начало P и начало QRS: это PQ, не больше одной большой клетки.','Посмотри ширину QRS: больше трёх малых клеток значит широкий.','Проверь, лежит ли ST на линии.','Посмотри конец T: это конец QT.'],ex:'sinus'},
3:{sut:'Пилот перед взлётом каждый раз идёт по одному списку, даже после тысячи полётов. ЭКГ читают так же — всегда в одном порядке. Тогда ты ничего не пропустишь и не клюнешь на яркую, но обманчивую деталь.',
 deep:['Новички хватаются за самое яркое — высокий зубец или подъём ST — и пропускают главное. Порядок защищает от этой ловушки. И первым делом убедись, что запись вообще можно читать: скорость и калибровка в порядке.','Ритм правильный, если расстояния R-R почти одинаковые. А синусовым его делает не частота, а зубец P: положительный во II, отрицательный в aVR и стоит перед каждым QRS. Синусовый ритм бывает и 50, и 150 в минуту.','Ось — это стрелка компаса, а мышца — магнит. В норме больше всего мышцы в левом желудочке, поэтому стрелка смотрит вниз и влево. Где мышцы стало больше — туда ось и тянется; от мёртвого рубца, наоборот, отходит. Поэтому ось подсказывает гипертрофию и блокады ветвей.'],
 know:[['Паспорт ленты','25 мм/с, 10 мм/мВ, 12 отведений'],['Порядок чтения','ритм, ЧСС, ось, P, QRS, ST, T, интервалы'],['ЧСС при 25 мм/с','1500 / R-R в мм'],['По большим клеткам','300, 150, 100, 75, 60, 50'],['Синусовый ритм','P + во II, − в aVR, перед каждым QRS'],['Ось','норма II > I > III, влево I > II > III, вправо III > II > I'],['Левая команда','I, aVL, V5, V6'],['Правая команда','III, aVF, V1, V2']],
 read:['Проверь скорость и калибровку.','Сравни R-R: ровные или нет.','Найди P во II: есть ли, какой, перед каждым ли QRS.','Посчитай ЧСС по большим клеткам.','Сравни R в I, II, III: это ось.','Иди слева направо: P, QRS, ST, T, интервалы.'],ex:'sinus'},
4:{sut:'При синусовых аритмиях командует всё тот же СА-узел, просто темп другой. А экстрасистола — это искра вне очереди: кто-то нажал свою кнопку раньше заведующего. Форма P и ширина QRS выдают, где именно.',
 deep:['Чем ниже вспыхнула искра, тем дальше она от нормальной трассы. Искра из предсердия или АВ-узла дальше летит по обычной проводке — QRS узкий. Искра из самого желудочка в проводку не попадает и ползёт по мышце от клетки к клетке — QRS широкий, а T обычно смотрит в другую сторону.','После желудочковой экстрасистолы часто бывает длинная пауза. СА-узел продолжает жать кнопку в своём ритме, но его очередная искра прилетает, когда желудочки ещё «отдыхают» после внеочередного удара, — и пропадает.','Одиночные экстрасистолы бывают и у совершенно здоровых людей. Важна не одна странная искра, а общая картина: какое сердце у человека, есть ли жалобы и как часто это происходит.'],
 know:[['Тахикардия','ЧСС больше 90 в минуту'],['Брадикардия','ЧСС меньше 60 в минуту'],['Общий признак экстрасистол','R-R перед ней короче обычного'],['Предсердная','P другой, QRS узкий'],['Из АВ-узла','P нет или отрицательный, QRS узкий'],['Желудочковая','P нет, QRS шире 0,12 с'],['Бигеминия','через одну, 1 : 1'],['Тригеминия','после двух нормальных, 1 : 2']],
 read:['Найди комплекс, который пришёл раньше срока.','Посмотри, что стоит перед ним: обычный P, другой P или ничего.','Посмотри на ширину QRS.','Узкий с другим P: предсердие. Узкий без P: АВ-узел. Широкий без P: желудочек.'],ex:'pvc'},
5:{sut:'Быструю ленту не нужно узнавать «на глаз», как лицо в толпе. Как врач приёмного, задай три вопроса: QRS узкий или широкий, R-R ровные или разные, что стоит вместо обычного P. Ответы сами сложатся в диагноз.',
 deep:['Узкий QRS — значит, искра прошла по нормальной проводке, и очаг сидит выше желудочков. Широкий QRS при тахикардии чаще всего значит, что искры рождаются в самих желудочках. Бывает и наджелудочковая тахикардия с блокадой ножки, но правило безопасности простое: широкая тахикардия — это ЖТ, пока не доказано обратное.','Трепетание предсердий — один большой круг re-entry, как человек с мегафоном, который кричит ровно и громко: волны одинаковые, как зубья пилы. Фибрилляция — толпа, где все кричат вразнобой: мелкая рябь, а желудочки отвечают как попало.','Смотри на частоту волн в предсердиях, а не только на пульс. При трепетании шлюз часто пропускает каждую вторую волну (2 : 1), и пульс получается около 150. Увидел ровную узкую тахикардию около 150 — поищи спрятанную пилу.'],
 know:[['Предсердная тахикардия','120–220 в минуту, другой P'],['Трепетание предсердий','240–340 в минуту, пила F'],['Фибрилляция предсердий (мерцательная аритмия)','350–600 в минуту, нет P, R-R разные'],['Учебный предел АВ-узла','около 220 в минуту'],['Желудочковая тахикардия (ЖТ)','широкий QRS, ровные R-R, ЧСС больше 100 в минуту'],['Трепетание желудочков','синусоида, примерно 250–350 в минуту'],['Фибрилляция желудочков (ФЖ)','хаос без комплексов'],['Re-entry','два пути с разной скоростью и рефрактерностью']],
 read:['Посмотри на пациента и оцени, стабилен ли он.','Узкий или широкий QRS?','Ровные или разные R-R?','Что вместо P: другой P, пила, рябь или ничего?','Разные R-R и рябь: ФП. Пила: трепетание. Ровно и узко: наджелудочковая. Широко и ровно: ЖТ.'],ex:'af'},
6:{sut:'Блокада — это дверь, которая плохо пропускает искру. I степень — медлит, II — иногда не пускает, III — заперта. А где именно дверь, подскажет зубец P: при СА-блокаде пропадает весь удар вместе с P, при АВ-блокаде P остаётся, а QRS — нет.',
 deep:['Опасность блокады зависит от того, где стоит «дверь», а не только от степени. Мобитц 1 обычно живёт в самом АВ-узле: санитар устаёт, отдыхает и снова работает. Мобитц 2 чаще сидит ниже, в системе Гиса, и может внезапно превратиться в полную блокаду.','При полной АВ-блокаде шлюз заперт: предсердия живут по кнопке заведующего, желудочки — по кнопке своего дежурного. Узкий QRS — запасной водитель сидит высоко, ритм надёжнее. Широкий QRS и редкий ритм — водитель низкий, и это опаснее.','Простой способ отличить Мобитц 1 от Мобитц 2 — сравнить PQ до и после паузы. При Мобитц 1 санитар отдохнул: PQ после паузы короче, чем перед ней.'],
 know:[['АВ-блокада I степени','PQ больше 0,2 с, все P проведены'],['Мобитц 1','PQ растёт, затем выпал QRS'],['Мобитц 2','PQ постоянный, внезапно выпал QRS'],['АВ-блокада III степени','P и QRS не связаны'],['СА-блокада II, тип 1','R-R укорачиваются, пауза меньше 2 R-R'],['СА-блокада II, тип 2','выпал цикл с P, пауза 2 R-R'],['Внутрипредсердная','P шире 0,1 с'],['Блокада 2 : 1','тип по ленте не определить']],
 read:['Найди паузу.','Есть ли в паузе P? Нет: СА-блокада. Есть: АВ-блокада.','Сравни PQ перед паузой: растёт или постоянный.','Промаркируй все P по линейке: ровно ли идут и связаны ли с QRS.'],ex:'w1'},
7:{sut:'Если одна дверь — ножка — заперта, искре в эту операционную приходится прожигать стену и ползти по мышце. Желудочек загорается с опозданием, QRS становится шире 0,12 с, а его конец указывает на больную сторону.',
 deep:['При блокаде правой ножки правый желудочек загорается последним. Его поздняя волна едет вправо и вперёд — прямо к V1. Отсюда второй зубец R′ в V1, «заячьи уши», и широкий S в V6.','При блокаде левой ножки поздняя волна едет влево, к V6. Поэтому в V6 широкий R, а в V1 глубокий S. Даже перегородка теперь возбуждается наоборот, справа налево, — поэтому в V5–V6 пропадает маленький q.','Когда меняется возбуждение, меняется и восстановление: ST и T смотрят против главного направления QRS. Это вторичные изменения, «эхо» блокады, и сами по себе они не значат ишемию.'],
 know:[['Правая ножка','rsR′ в V1, широкий S в V6'],['Левая ножка','широкий R в V5–V6, глубокий S в V1'],['Неполная','QRS 0,10–0,12 с'],['Полная','QRS больше 0,12 с'],['Передняя ветвь','ось ≤ −60°, S > R во II, III, aVF'],['Задняя ветвь','ось ≥ +120°, S > R в I, aVL'],['Частая пара','правая ножка и передняя ветвь']],
 read:['QRS шире 0,12 с? Если нет, это не полная блокада.','Посмотри на конец QRS в V1.','Вверх: правая ножка. Вниз: левая ножка.','Проверь ось: резко влево или вправо говорит о ветви.'],ex:null,b:'rbbbV1'},
8:{sut:'Гипертрофия — это перекачанная мышца сердца. Больше мышцы — громче сигнал: зубцы выше. Мышца-магнит тянет ось к себе. А сосуды за ростом не успевают, и в перегруженной стенке меняются ST и T.',
 deep:['Логика одна и для предсердий, и для желудочков: где мышцы больше, там громче. Правое предсердие рисует начало P — при его перегрузке растёт высота зубца. Левое рисует конец P — зубец удлиняется и становится двугорбым.','Левый желудочек и так главный, поэтому его гипертрофия просто делает обычную картину громче. А правому сначала нужно «перекричать» левого — поэтому его признаки на ЭКГ появляются поздно.','ЭКГ слышит электричество, а не видит размер. Нормальная ЭКГ не исключает гипертрофию, а высокие зубцы у молодого худого человека её не доказывают. Точный ответ даёт эхокардиография.'],
 know:[['P pulmonale','высокий острый, больше 2–2,5 мм'],['P mitrale','двугорбый, шире 0,10–0,12 с'],['Индекс Соколова–Лайона','S в V1 + R в V5 или V6 ≥ 35 мм'],['Признак ГЛЖ','R в V6 > R в V5 > R в V4'],['Гипертрофия правого желудочка (ГПЖ)','R в V1 больше 7 мм'],['Сумма при ГПЖ','R в V1 + S в V5 или V6 больше 10,5 мм']],
 read:['Посмотри P во II и V1.','Сложи S в V1 и R в V5 или V6.','Посмотри, где вершина холма R.','Проверь ось и ST с T в перегруженной стороне.'],ex:null,b:'lvhV6'},
9:{sut:'Инфаркт — это пожар в сердечной мышце. По краям дым — ишемия, она меняет T. Ближе к центру огонь — повреждение, он меняет ST. В центре угли — некроз, они оставляют Q. По тому, что сейчас на ленте, видно и глубину пожара, и как давно он начался.',
 deep:['Дым ещё можно проветрить: при ишемии клетка жива, страдает только восстановление. Огонь опаснее: при повреждении нарушены и возбуждение, и восстановление, но клетки ещё можно спасти, если быстро вернуть кровоток. Угли уже не спасти: некроз необратим, ткань электрически молчит.','Электрод стоит снаружи. Огонь притягивает ST: горит у наружной стенки, рядом с электродом, — ST поднимается; горит у внутренней, далеко, — ST опускается. А T от дыма отворачивается: дым рядом — T отрицательный, дым далеко — T высокий.','Мёртвая зона работает как окно в стене. Электрод смотрит сквозь него на противоположную, живую стенку и видит волну, которая уезжает прочь. Отсюда отрицательный зубец Q — след угля, который часто остаётся на всю жизнь.'],
 know:[['Ишемия','меняет T'],['Повреждение','меняет ST'],['Некроз','меняет Q и снижает R'],['Патологический Q','глубже ¼ R и шире 0,03 с'],['Подъём ST','от 1 мм в двух соседних отведениях'],['V2–V3','от 2,5 мм у мужчин до 40 лет, 2 мм от 40 лет, 1,5 мм у женщин'],['Стадии','острейшая до 3 суток, острая до 3 недель, подострая до 3 месяцев, затем рубец'],['Классификация','с подъёмом ST и без, с зубцом Q и без'],['Нормальная ЭКГ','инфаркт не исключает']],
 read:['Ищи ST в каждом отведении: подъём или депрессия.','Смотри, в соседних ли отведениях это.','Посмотри T: острый, отрицательный или обычный.','Проверь Q и снижение R.','Сравни со старой плёнкой и повтори ЭКГ через 15–30 минут, если есть боль.'],ex:null,b:'stCat'},
10:{sut:'Где на ленте изменения, там и пожар. Представь сердце комнатой: пол, стена, фасад — и у каждой части свои отведения-камеры. А на противоположной стенке всё видно наоборот, как в зеркале.',
 deep:['Каждое отведение — камера, которая смотрит на свою стенку. Если изменения загорелись в соседних камерах одной группы, это не случайность: так выглядит зона, которую питает одна артерия.','Зеркало — твой помощник. Если напротив подъёма ST есть зеркальная депрессия, подъём, скорее всего, настоящий, инфарктный. При перикардите такого зеркала обычно нет.','Обычные 12 отведений видят не всё. Задняя стенка выдаёт себя зеркалом — депрессией в V1–V3, а правый желудочек нужно «подсветить» дополнительными электродами V3R–V4R.'],
 know:[['Нижний','II, III, aVF'],['Переднеперегородочный','V1–V3'],['Передневерхушечный','V3–V4'],['Переднебоковой','I, aVL, V5, V6'],['Распространённый передний','I, aVL, V1–V6'],['Заднебоковой','II, III, aVF, V5, V6']],
 read:['Отметь все отведения с подъёмом ST.','Назови группу: пол, стена или фасад.','Найди депрессию напротив: это зеркало.','Депрессия в V1–V3 без подъёма? Подумай о задней стенке.'],ex:null,b:'recip'},
11:{sut:'Иногда в операционный блок есть чёрный ход — врождённая дорога мимо шлюза. Искра проскакивает мимо санитара без задержки, поэтому PQ короткий. А при WPW она ещё и влетает прямо в операционную, отсюда пологое начало QRS. Буквы WPW — это фамилии трёх врачей, которые описали синдром в 1930 году: Вольф, Паркинсон и Уайт. LGL — тоже три фамилии: Лаун, Ганонг и Левин.',
 deep:['Пучок Кента — чёрный ход прямо из предсердия в желудочек. Часть мышцы загорается раньше, но медленно, через мышцу, — это дельта-волна. Потом подлетает искра через АВ-узел, и QRS получается «слепленным» из двух волн — сливным.','Чёрный ход и шлюз вместе образуют кольцо. Стоит искре войти в него по кругу — начинается re-entry, отсюда внезапные приступы тахикардии.','Санитар в шлюзе — фильтр: слишком частые искры он не пропускает. А у чёрного хода санитара нет. При фибрилляции предсердий сотни искр могут хлынуть к желудочкам напрямую. Поэтому лекарства, которые «закрывают» шлюз, здесь могут навредить: весь поток пойдёт через чёрный ход.'],
 know:[['Что значит WPW','синдром Вольфа — Паркинсона — Уайта (фамилии трёх врачей, описали в 1930 году)'],['Что значит LGL','синдром Лауна — Ганонга — Левина (тоже фамилии врачей)'],['WPW','PQ меньше 0,12 с, дельта, широкий QRS'],['LGL','PQ меньше 0,12 с, QRS обычный'],['Пучок при WPW','Кента'],['Пучок при LGL','Джеймса'],['Опасность','фибрилляция предсердий при WPW']],
 read:['Измерь PQ: меньше трёх малых клеток?','Посмотри на самое начало QRS: пологое?','Есть дельта: WPW. Нет: думай о LGL.'],ex:'wpw'},
12:{sut:'Высокий T, широкий QRS или подъём ST — это не всегда инфаркт. У него есть двойники, и некоторые не менее опасны: калий, длинный QT, перикардит и ТЭЛА. Здесь учимся их различать.',
 deep:['Калий — главный «настройщик» заряда клетки. Когда его слишком много, сначала ускоряется восстановление — T становится острым, как палатка. Потом замедляется проведение: P уплощается, QRS расплывается, свеча тает. Лента может ухудшаться очень быстро.','Длинный QT — значит, желудочки слишком долго «поднимают книги». В этот уязвимый момент ранняя искра может закрутить пируэт. Хорошая новость: причины часто обратимы — лекарства, низкие калий и магний.','Перикардит раздражает сердце снаружи, как рубашка почти целиком, — поэтому подъём ST везде и без зеркала. ТЭЛА внезапно перегружает правый желудочек: на ленте тахикардия и признаки перегрузки справа. Но нормальная ЭКГ ТЭЛА не исключает.'],
 know:[['Гиперкалиемия','острый T → плоский P → широкий QRS → синусоида'],['Гипокалиемия','плоский T, ST вниз, зубец U'],['Базетт','QTc = QT / √R-R'],['Граница QTc','около 0,45 с у мужчин, 0,46–0,47 с у женщин'],['Опасный QTc','больше 0,50 с'],['Перикардит','ST вверх почти везде, вогнутый, PQ снижен'],['Тромбоэмболия лёгочной артерии (ТЭЛА)','чаще просто синусовая тахикардия']],
 read:['Широкий QRS или острый T: сначала думай о калии.','Сравни конец T с серединой R-R.','Подъём ST: проверь, есть ли зеркало и какая у него форма.','Смотри на клинику: лента лишь часть картины.'],ex:null,b:'k1'}};
