<style>/* Концепция: светлая тетрадь врача. Белые карточки, воздух, лента на розовой миллиметровке.

:root{--bg:#f6f7fb;--card:#fff;--fg:#1a2230;--muted:#667085;--line:#e6e9f0;--th:#2f6bed;--th-b:#eaf1fe;--pr:#0c9a86;--pr-b:#e5f7f3;--gm:#f0603f;--gm-b:#ffefea;--acc:var(--th);--acc-b:var(--th-b);--ok:#0f8a5f;--ok-b:#e7f7f0;--no:#d92d3a;--no-b:#fdecee;--mark:#ffe680;--amber:#b45309;--amb-b:#fff6e3;

1:{sut:'Импульс рождается наверху, в СА-узле. Он проходит по предсердиям, задерживается в АВ-узле и быстро разбегается по желудочкам. Вся ЭКГ — запись этого пути.',
 deep:['Автоматизм есть у всей проводящей системы, но частота разная. Выше всех стоит СА-узел, поэтому он и ведёт. Если он замолчит, эстафету подхватывают нижние участки, только реже. Поэтому при поломке наверху сердце обычно не останавливается.','ЭКГ записывает только то, что создаёт большой электрический сигнал, то есть массу миокарда. Сами узлы и пучки слишком малы. Отсюда ровная линия после P, хотя импульс в это время идёт по АВ-узлу.','Электрод не видит сердце напрямую. Он чувствует разность потенциалов на коже. Отведение — это взгляд на сердце с определённой точки. Из 10 электродов получается 12 таких взглядов.'],

 read:['Смотри на цикл как на маршрут, а не как на набор зубцов.','P: импульс прошёл предсердия.','Ровная линия: импульс в АВ-узле.','QRS: импульс в желудочках.','T: желудочки восстанавливаются.'],ex:'sinus'},
2:{sut:'Каждый элемент ленты отвечает за свой этап. P — предсердия, QRS — желудочки, T — их восстановление. Направление зубца зависит от того, идёт вектор к электроду или от него.',
 deep:['Вектор — это направление суммарного потока возбуждения. Положительный полюс отведения как глаз: поток к нему рисует зубец вверх, поток от него рисует зубец вниз. Поэтому одно и то же событие в разных отведениях выглядит по-разному, и это норма.','Возбуждение называют деполяризацией, восстановление — реполяризацией. QRS узкий, потому что импульс быстро бежит по специальным путям. Если он идёт по мышце, QRS расширяется. Это одна из самых полезных мыслей в ЭКГ.','Интервал QT включает всё время работы желудочков. Чем чаще ритм, тем он короче, поэтому его оценивают с поправкой на частоту.'],

3:{sut:'ЭКГ читают всегда в одном порядке. Так ты ничего не пропустишь и не начнёшь с яркой, но обманчивой детали.',
 deep:['Новички смотрят сразу на самое заметное и пропускают главное. Порядок защищает от этой ошибки. Сначала проверь, что запись вообще можно читать: скорость и калибровку.','Ритм считается правильным, если R-R почти одинаковые. Синусовым его делает не частота, а зубец P: он положительный во II, отрицательный в aVR и стоит перед каждым QRS.','Электрическая ось показывает общее направление возбуждения. В норме она идёт вниз и влево, к верхушке. Ось уходит туда, где больше мышцы, и уходит прочь от рубца. Поэтому она помогает заподозрить гипертрофию и блокады ветвей.'],
 know:[['Паспорт ленты','25 мм/с, 10 мм/мВ, 12 отведений'],['Порядок чтения','ритм, ЧСС, ось, P, QRS, ST, T, интервалы'],['ЧСС при 25 мм/с','1500 / R-R в мм'],['По большим клеткам','300, 150, 100, 75, 60, 50'],['Синусовый ритм','P + во II, − в aVR, перед каждым QRS'],['Ось','норма II > I > III, влево I > II > III, вправо III > II > I'],['Левая команда','I, aVL, V5, V6'],['Правая команда','III, aVF, V1, V2']],

4:{sut:'При синусовых аритмиях меняется только темп. Экстрасистола — внеочередной удар из другого места. Форма P и ширина QRS подсказывают откуда.',
 deep:['Чем ниже очаг, тем дальше импульс от нормального пути. Импульс из предсердия или АВ-узла входит в желудочки через обычные пути, поэтому QRS узкий. Импульс из желудочка ползёт по мышце, поэтому QRS широкий, а T обычно смотрит в другую сторону.','После желудочковой экстрасистолы часто бывает длинная пауза. Узел продолжает работать, но следующий его импульс попадает в момент, когда желудочки ещё не готовы.','Единичные экстрасистолы часто встречаются и у здоровых людей. Значение зависит от сердца пациента, симптомов и частоты, а не от одного комплекса.'],
 know:[['Тахикардия','ЧСС больше 90 в минуту'],['Брадикардия','ЧСС меньше 60 в минуту'],['Общий признак экстрасистол','R-R перед ней короче обычного'],['Предсердная','P другой, QRS узкий'],['Из АВ-узла','P нет или отрицательный, QRS узкий'],['Желудочковая','P нет, QRS шире 0,12 с'],['Бигеминия','через одну, 1 : 1'],['Тригеминия','после двух нормальных, 1 : 2']],

5:{sut:'Тахикардию не надо узнавать по картинке. Хватит трёх вопросов: QRS узкий или широкий, R-R ровные или разные, что вместо обычного P.',
 deep:['Узкий QRS значит, что импульс пришёл через нормальные пути, то есть очаг выше желудочков. Широкий QRS при тахикардии чаще всего значит желудочковое происхождение. Бывает и наджелудочковая тахикардия с блокадой ножки, но широкая тахикардия считается ЖТ, пока не доказано другое.','Трепетание предсердий — большой круг re-entry, поэтому волны ровные, как пила. Фибрилляция — множество мелких очагов, поэтому волны хаотичные, а желудочки отвечают неравномерно.','Частота волн важнее частоты желудочков. При трепетании с проведением 2 : 1 ЧСС часто около 150. Если видишь ровную тахикардию ровно 150, подумай о скрытом трепетании.'],

6:{sut:'Блокада — препятствие на пути импульса. I степень задерживает, II теряет часть импульсов, III не пропускает ничего. Главное различие: при СА-блокаде нет и P, при АВ-блокаде P остаётся.',
 deep:['Опасность блокады зависит от уровня, а не только от степени. Мобитц 1 обычно живёт в АВ-узле: узел устаёт, отдыхает и снова работает. Мобитц 2 чаще лежит ниже, в системе Гиса, и может внезапно стать полной блокадой.','При полной АВ-блокаде предсердия и желудочки работают независимо. Узкий QRS значит, что водитель сидит высоко и ритм надёжнее. Широкий QRS и редкий ритм значат низкий водитель, это опаснее.','Чтобы отличить Мобитц 1 от Мобитц 2, сравни PQ до и после паузы. При Мобитц 1 PQ после паузы короче, чем перед ней.'],

 read:['Найди паузу.','Есть ли в паузе P? Нет: СА-блокада. Есть: АВ-блокада.','Сравни PQ перед паузой: растёт или постоянный.','Промаркируй все P по линейке: ровно ли идут и связаны ли с QRS.'],ex:'w1'},
7:{sut:'Если ножка заблокирована, один желудочек возбуждается с опозданием. QRS становится шире 0,12 с, а его конец показывает больную сторону.',
 deep:['Правый желудочек при блокаде правой ножки возбуждается последним. Его поздний вектор идёт вправо и вперёд, к V1. Отсюда второй зубец R′ в V1 и широкий S в V6.','При блокаде левой ножки поздний вектор идёт влево, к V6. Поэтому в V6 широкий R, а в V1 глубокий S. Перегородка возбуждается наоборот, справа налево, поэтому в V5–V6 обычно исчезает маленький q.','Когда QRS меняется, меняется и реполяризация. T и ST смотрят против главного направления QRS. Это вторичные изменения, и само по себе это не ишемия.'],

8:{sut:'Больше мышцы значит больше электрической силы. Поэтому зубцы выше, ось тянется к гипертрофии, а в перегруженной стенке меняются ST и T.',
 deep:['Предсердия и желудочки рассуждают одинаково. Правое предсердие даёт начало P, поэтому при его перегрузке растёт высота зубца. Левое даёт конец P, поэтому зубец удлиняется и появляется второй горб.','Левый желудочек в норме и так главный, поэтому его гипертрофия просто усиливает обычную картину. Правому нужно сначала перевесить левого, поэтому ЭКГ-признаки появляются поздно.','ЭКГ видит электричество, а не размер. Нормальная ЭКГ не исключает гипертрофию, а высокий вольтаж у молодого худого человека не доказывает её. Уточняет эхокардиография.'],

9:{sut:'Инфаркт похож на пожар. Ишемия — дым, она меняет T. Повреждение — огонь, он меняет ST. Некроз — угли, они меняют Q. По сочетанию видно и глубину, и стадию.',
 deep:['Ишемия обратима: клетка жива, но нарушено восстановление. Повреждение тяжелее: страдают и возбуждение, и восстановление. Некроз необратим: ткань электрически молчит.','Электрод стоит снаружи. Ток повреждения тянет ST к поражённой зоне. Если зона под электродом, ST растёт. Если она под эндокардом, ST опускается. T ведёт себя наоборот: уходит от ишемии.','Мёртвая зона работает как окно. Электрод смотрит сквозь него на противоположную стенку и видит вектор, который уходит прочь. Отсюда отрицательный Q.'],
 know:[['Ишемия','меняет T'],['Повреждение','меняет ST'],['Некроз','меняет Q и снижает R'],['Патологический Q','глубже ¼ R и шире 0,03 с'],['Подъём ST','от 1 мм в двух соседних отведениях'],['V2–V3','от 2,5 мм у мужчин до 40 лет, 2 мм от 40 лет, 1,5 мм у женщин'],['Нормальная ЭКГ','инфаркт не исключает']],

10:{sut:'Где изменения, там и инфаркт. Запомни карту отведений и не забудь про зеркало: на противоположной стенке изменения видны наоборот.',
 deep:['Каждое отведение смотрит на свою стенку. Если признаки появляются в соседних отведениях одной группы, это не случайность, а зона одной артерии.','Реципрокная депрессия помогает: она подтверждает, что подъём ST настоящий. При перикардите её обычно нет.','Обычные 12 отведений не видят всё. Задняя стенка показывает себя депрессией в V1–V3, а правый желудочек нужно смотреть в V3R–V4R.'],
 know:[['Нижний','II, III, aVF'],['Переднеперегородочный','V1–V3'],['Передневерхушечный','V3–V4'],['Переднебоковой','I, aVL, V5, V6'],['Распространённый передний','I, aVL, V1–V6'],['Заднебоковой','II, III, aVF, V5, V6']],

12:{sut:'Высокий T, широкий QRS или подъём ST бывают не только при инфаркте. Здесь собраны самые опасные двойники: калий, длинный QT, перикардит и ТЭЛА.',
 deep:['Калий управляет потенциалом покоя клетки. При его избытке сначала ускоряется реполяризация, поэтому T становится острым. Потом замедляется проведение: уплощается P, расширяется QRS. Лента может ухудшаться очень быстро.','Длинный QT значит, что желудочки дольше восстанавливаются. Ранний импульс в этот момент может запустить пируэт. Причины часто обратимы: препараты, низкие калий и магний.','Перикардит раздражает сердце снаружи почти везде, поэтому подъём ST распространённый и без зеркала. ТЭЛА внезапно перегружает правый желудочек, поэтому на ленте бывает тахикардия и признаки перегрузки справа, но нормальная ЭКГ её не исключает.'],
 know:[['Гиперкалиемия','острый T → плоский P → широкий QRS → синусоида'],['Гипокалиемия','плоский T, ST вниз, зубец U'],['Базетт','QTc = QT / √R-R'],['Граница QTc','около 0,45 с у мужчин, 0,46–0,47 с у женщин'],['Опасный QTc','больше 0,50 с'],['Перикардит','ST вверх почти везде, вогнутый, PQ снижен'],['Тромбоэмболия лёгочной артерии (ТЭЛА)','чаще просто синусовая тахикардия']],

const MORE={
'Путь импульса':'Проводящая система — это специальные клетки, которые не столько сокращаются, сколько проводят сигнал. По ним импульс бежит в несколько раз быстрее, чем по обычной мышце. Благодаря этому весь желудочек возбуждается почти одновременно и выбрасывает кровь одним мощным толчком. Если импульс идёт мимо этих путей, сокращение становится растянутым, а комплекс на ленте широким.',
'Почему задаёт ритм СА-узел':'Способность клетки самой создавать импульс называется автоматизмом. Клетки-пейсмекеры постепенно деполяризуются в покое, и когда потенциал доходит до порога, рождается импульс. В СА-узле это происходит быстрее всего. Импульс приходит к нижним очагам раньше, чем они успевают разрядиться сами, и сбрасывает их. Если верхний источник молчит, нижний дорабатывает до порога и берёт ритм на себя.',
'АВ-узел: зачем нужна задержка':'АВ-узел проводит медленно, потому что в нём мало быстрых ионных каналов и плотность контактов между клетками ниже. Эта пауза нужна механически: предсердия успевают сократиться и дозаполнить желудочки. Заодно узел работает как фильтр: при очень частых импульсах он пропускает только часть, и это защищает желудочки при трепетании и фибрилляции предсердий.',
'Пучок Гиса и ножки':'Пучок Гиса проходит через фиброзное кольцо и перегородку. Левая ножка почти сразу делится на переднюю и заднюю ветви, потому что левый желудочек больше. Передняя ветвь тонкая и имеет одно кровоснабжение, поэтому страдает чаще. Задняя толще и получает кровь из двух источников. Правая ножка длинная и тонкая, поэтому тоже легко повреждается.',
'Электроды на конечности':'Чёрный электрод на правой ноге не записывает сигнал, он нужен как заземление и снижает помехи. Если перепутать провода на руках, в I отведении всё перевернётся, а aVR станет похож на норму. Это частая ошибка, поэтому странную ось всегда проверяй с этой мысли. На качество записи точное место на конечности влияет мало.',
'Главное правило ЭКГ':'Возбуждённая часть миокарда снаружи заряжена отрицательно, невозбуждённая положительно. Граница между ними движется, как волна, и у этой волны есть направление. Отведение измеряет разность потенциалов, поэтому показывает проекцию этой волны на свою ось. Отсюда простое следствие: вектор вдоль оси даёт высокий зубец, вектор поперёк оси даёт почти ноль.',
'Зубец P: два предсердия':'Импульс выходит из СА-узла в правом предсердии, поэтому оно возбуждается раньше. По межпредсердному пучку Бахмана волна уходит в левое предсердие. Волны перекрываются и сливаются в один пологий зубец. Предсердия тонкие, поэтому P маленький, обычно не выше 2,5 мм.',
'QRS: слово ПоВОрот':'Перегородка возбуждается первой, слева направо, поэтому в левых отведениях часто виден маленький q. Потом волна проходит массу желудочков от эндокарда к эпикарду. Это даёт большой R. Последними возбуждаются базальные отделы, что рисует S. Весь процесс занимает меньше 0,1 с, потому что волна бежит по волокнам Пуркинье.',
'ST и T: уборка':'В сегмент ST почти все клетки желудочков находятся в одинаковой фазе плато, разницы потенциалов нет, поэтому линия ровная. Реполяризация идёт в обратном порядке, от эпикарда к эндокарду, поэтому T обычно смотрит в ту же сторону, что и QRS, хотя процесс противоположный.',
'Интервал или сегмент':'Интервал PQ показывает всё время от начала возбуждения предсердий до начала возбуждения желудочков. Если он длиннее 0,2 с, задержка выросла. Если короче 0,12 с, импульс нашёл обходной путь. Сегмент ST ценен другим: мы оцениваем не длину, а положение относительно изолинии.',
'Смотри в клетки, а не в секунды':'При 25 мм/с за секунду протягивается 25 мм ленты, то есть пять больших клеток. Поэтому большая равна 0,2 с, а малая 0,04 с. При 50 мм/с всё вдвое шире: большая клетка уже 0,1 с. Вольтаж стандартно 10 мм на 1 мВ, значит малая клетка по высоте равна 0,1 мВ.',
'Сначала паспорт ленты':'Калибровочная метка — это импульс 1 мВ, который аппарат подаёт в начале записи. При стандартной настройке его высота 10 мм. Если вольтаж снижен вдвое, все зубцы кажутся маленькими, и можно ошибочно увидеть низкий вольтаж или пропустить гипертрофию. Поэтому сначала проверяем инструмент, а потом делаем выводы.',
'РЫЧАГ на ОСИ':'Порядок не случаен. Ритм и частота сразу говорят, срочная ли ситуация. Ось подсказывает, где искать проблему. Проход по зубцам ловит остальное. Пропущенный шаг обычно и даёт ошибку: например, можно увидеть подъём ST и не заметить, что это широкий ритм, при котором ST читается иначе.',
'ЧСС за три секунды':'Метод работает, потому что при 25 мм/с в минуте 300 больших клеток. Если между R одна клетка, ЧСС 300, если две, то 150, и так далее. При неправильном ритме метод не работает: посчитай комплексы за 6 секунд, это 30 больших клеток, и умножь на 10.',
'Синусовый ли ритм':'Импульс из СА-узла идёт сверху вниз и справа налево, поэтому смотрит на II отведение и от aVR. Если P положительный во II и отрицательный в aVR, источник наверху справа. Если P перевёрнут во II, импульс идёт снизу вверх, то есть источник ниже. Частота при этом ничего не доказывает.',
'Две команды отведений':'Отведения рядом смотрят на сердце с похожих сторон, поэтому изменения в них совпадают. Если признак есть только в одном отведении, это чаще артефакт или случайность. Если в двух соседних одной группы, это настоящая находка. Отсюда правило «два соседних отведения» в критериях инфаркта.',
'Ось за секунду':'Точный способ: найди отведение, где QRS почти равен нулю. Ось идёт перпендикулярно ему. Простой способ: смотри на I и aVF. Оба положительные значит ось нормальная. Если сумма зубцов в одном отведении положительна, вектор направлен в его сторону. Отклонение оси само по себе не диагноз, а подсказка.',
'Прогулка по комплексу':'На каждом шаге задавай один вопрос. P: откуда идёт импульс. QRS: узкий или широкий, нет ли патологического Q. ST: на линии ли. T: совпадает ли с QRS. Интервалы: не удлинён ли PQ, не длинный ли QT. Такой чек-лист работает как в авиации: он защищает от усталости.',
'Холм в грудных отведениях':'В V1 электрод смотрит на правый желудочек и перегородку, поэтому там мал R и глубок S. По мере движения к V6 электрод всё больше видит левый желудочек, R растёт, а S уменьшается. Точка, где R равен S, называется переходной зоной, обычно V3–V4. Смещение зоны подсказывает поворот сердца, рубец или гипертрофию.',
'Синусовые аритмии':'Синусовый узел слушает вегетативную нервную систему. Симпатика ускоряет, вагус замедляет. На вдохе тонус вагуса падает и ЧСС немного растёт, на выдохе наоборот. Отсюда дыхательная аритмия. Выраженная она у молодых, с возрастом уменьшается. Причину синусовой тахикардии всегда ищут в пациенте, а не в сердце.',
'Экстрасистола':'Эктопический очаг выдаёт импульс раньше очередного синусового. Если импульс родился выше разветвления пучка Гиса, он входит в желудочки по обычным путям. Если внутри желудочка, идёт от клетки к клетке, это в несколько раз медленнее. Отсюда главное правило ширины QRS.',
'Посмотри на всех троих':'После предсердной экстрасистолы пауза обычно неполная: импульс успевает сбить ритм СА-узла. После желудочковой пауза полная: узел продолжает свой ритм, но очередной импульс приходит в рефрактерные желудочки. Иногда предсердная экстрасистола проводится с аберрацией и даёт широкий QRS, тогда помогает ранний P.',
'Где очаг в предсердии':'Работает тот же принцип вектора. Смотрим на II отведение: положительный полюс внизу слева. Очаг вверху отправляет волну к нему, очаг внизу от него. Значит, отрицательный P в обычном цикле говорит о нижнепредсердном или узловом источнике.',
'Как они ходят':'Бигеминия важна практически: половина комплексов может давать слабый выброс, и пульс на запястье окажется вдвое реже, чем на мониторе. Три и более желудочковых комплекса подряд уже считают пробежкой ЖТ. Политопные экстрасистолы говорят о нескольких очагах и более выраженном поражении.',
'Три вопроса к любой тахикардии':'Узкий QRS почти всегда значит, что импульс прошёл через систему Гиса–Пуркинье. Широкий бывает при ЖТ, при наджелудочковой тахикардии с блокадой ножки и при предвозбуждении. Широкая регулярная тахикардия у больного с инфарктом в анамнезе почти всегда ЖТ. Ошибка в сторону ЖТ безопаснее обратной.',
'Узкие тахикардии':'При трепетании частота волн обычно около 300, и АВ-узел часто пропускает каждую вторую, поэтому ЧСС близка к 150. Волны лучше видны во II, III, aVF и V1. Фибрилляцию отличают по абсолютной неправильности R-R. Если R-R при «фибрилляции» вдруг ровные и редкие, подумай о полной АВ-блокаде на её фоне.',
'Широкие: тут счёт на минуты':'ЖТ бывает мономорфной, когда все комплексы одинаковые, и полиморфной. Трепетание и фибрилляция желудочков обычно не дают эффективного выброса. Первый шаг всегда один: проверь пациента и пульс. Если на мониторе хаос, а человек разговаривает, это артефакт.',
'Степени всегда одни и те же':'Степень описывает, сколько импульсов теряется, а не насколько плохо пациенту. Чувствует себя человек по частоте желудочков и уровню блока. Поэтому блокада II степени с высоким блоком бывает опаснее, чем III степень с устойчивым узким ритмом.',
'Главное отличие':'Зубец P — первое, что видно на ленте. Если он есть, импульс вышел из СА-узла и прошёл предсердия. Значит, проблема ниже. Если его нет там, где он должен быть, импульс не вышел или не дошёл до предсердий. Поэтому в паузе всегда ищи P, в том числе спрятанный на T.',
'АВ-блокады':'Мобитц 1 называют периодикой Самойлова–Венкебаха. Прирост PQ самый большой между первым и вторым комплексом, поэтому R-R могут укорачиваться перед паузой. При Мобитц 2 нарушение обычно ниже АВ-узла, а QRS нередко широкий. АВ-блокаду I степени часто находят случайно у спортсменов, она обычно безобидна.',
'Если выпал каждый второй':'Запись 2 : 1 значит два зубца P на один QRS. Чтобы определить тип, нужны как минимум два проведённых подряд комплекса. Подсказка: узкий QRS чаще говорит об уровне АВ-узла, широкий о более низком уровне.',
'СА-блокады':'СА-блокады видны только косвенно, потому что импульс из узла на ленте не записывается. Паузу кратную R-R трудно объяснить чем-то другим, кроме выпавшего импульса. Если пауза не кратна, подумай об остановке синусового узла: она похожа, но арифметика не сходится.',
'Если СА-узел молчит':'Выскальзывающий комплекс — это защита. Нижний очаг ждёт и срабатывает, когда сверху ничего нет. Поэтому такой комплекс приходит поздно, а не рано, и это главное отличие от экстрасистолы. Подавлять его нельзя: это последняя страховка.',
'Почему QRS становится широким':'При блокаде ножки импульс сначала идёт по здоровой стороне. На другую сторону он попадает через мышцу перегородки, а это в разы медленнее. Поэтому конец QRS рисует запоздалый желудочек, и направление этого конца показывает, какая сторона опоздала.',
'Буква М живёт там, где блокада':'В V1 при блокаде правой ножки сначала идёт обычный маленький r от перегородки, потом S от левого желудочка, потом большой R′ от запоздавшего правого. При блокаде левой ножки перегородка возбуждается наоборот, поэтому в V5–V6 пропадает q, а R становится широким и зазубренным.',
'Поворотник в V1':'Это упрощение правила направления: поздний вектор идёт к запоздавшему желудочку. Правый желудочек лежит ближе к V1, поэтому при блокаде правой ножки конец QRS в V1 положительный. Левый лежит дальше, поэтому при блокаде левой ножки конец QRS отрицательный.',
'Полная или неполная':'Границу в 0,12 с используют почти все рекомендации. Неполная блокада правой ножки встречается и у здоровых молодых людей. Новая блокада левой ножки всегда требует внимания: важно понять, не связана ли она с острым событием. Старая плёнка здесь ценнее любого критерия.',
'Ветви левой ножки':'Передняя ветвь идёт вверх и вперёд. Если она заблокирована, верхне-боковая часть левого желудочка возбуждается последней, и вектор уходит вверх и влево. Поэтому ось резко влево. При блокаде задней ветви ось уходит вправо, но сначала исключают гипертрофию правого желудочка.',
'Перекачанная мышца':'Гипертрофия увеличивает массу, а значит и вектор. Кровоснабжение не успевает, поэтому внутренние слои страдают от недостатка кислорода. Отсюда изменения ST и T в сторону, противоположную QRS. Эту картину называют систолической перегрузкой, или strain.',
'Предсердия: пик или верблюд':'В V1 зубец P двухфазный: первая часть от правого предсердия, вторая от левого. Глубокая широкая отрицательная фаза говорит о левом предсердии, высокая положительная о правом. Поэтому при подозрении всегда смотри V1 вместе со II.',
'Левый желудочек':'У индекса Соколова–Лайона высокая специфичность и низкая чувствительность: если он положительный, гипертрофия вероятна, но при отрицательном она всё равно может быть. Есть и другие критерии, например Корнельский. Они считают иначе, и ни один не заменяет эхокардиографию.',
'Правый желудочек':'В норме в V1 зубец S больше R. Если R стал больше S, это повод подумать о гипертрофии правого желудочка, задней стенке, блокаде правой ножки или WPW. Признаки вместе с отклонением оси вправо и P pulmonale делают вывод надёжнее.',
'Два правила вместо девяти рисунков':'Правило про ST следует из тока повреждения: повреждённая зона заряжена иначе, чем здоровая, и ток идёт к ней, поэтому вектор ST направлен в зону поражения. Правило про T следует из того, что ишемия удлиняет реполяризацию и меняет её направление. Запомнив только это, ты выведешь все рисунки сам.',
'Ишемия меняет T':'Высокий острый T бывает в первые минуты инфаркта и называется сверхострым. Он легко пропускается, поэтому при боли ЭКГ повторяют. Отрицательный симметричный T называют коронарным. Изменения T малоспецифичны и всегда требуют сравнения с клиникой.',
'Повреждение меняет ST':'Смотрят смещение относительно изолинии в точке J, в месте, где заканчивается S. Подъём важен как знак полной окклюзии. Депрессия чаще означает субэндокардиальную ишемию или зеркало подъёма на другой стенке. Форма тоже важна: выпуклый подъём подозрительнее вогнутого.',
'Некроз меняет Q':'Мёртвая ткань не создаёт потенциалов. Электрод над ней словно смотрит в окно и видит движение волны на противоположной стенке, которая уходит от него. Отсюда отрицательный зубец Q. Q появляется не сразу: иногда через часы. Узкий маленький q в I, aVL, V5, V6 бывает нормой.',
'Цифры и ловушки':'Пороги подъёма ST взяты из универсального определения инфаркта. Они различаются для V2–V3, потому что там ST у здоровых людей выше. Отсутствие подъёма не исключает окклюзию: бывает задний инфаркт, поэтому при боли смотрят тропонин, повторяют ЭКГ и сравнивают с прошлой.',
'Пол, стена, фасад':'Нижнюю стенку чаще питает правая коронарная артерия, переднюю и перегородку — передняя нисходящая, боковую — огибающая или диагональные ветви. При нижнем инфаркте проверяют правый желудочек: от этого зависит тактика.',
'Зеркало':'Реципрокные изменения подтверждают, что подъём ST настоящий, а не вариант нормы. Лучший пример: подъём в III и депрессия в aVL. Эта пара возникает рано, иногда раньше, чем подъём достигает порога.',
'Смотри все двенадцать':'Задний инфаркт не даёт подъёма в обычных отведениях. Подсказка: депрессия ST в V1–V3 с высоким R и положительным T. Подтверждают отведениями V7–V9. Правый желудочек смотрят в V3R–V4R, особенно при нижнем инфаркте.',
'Обходной путь':'Дополнительные пути формируются ещё внутриутробно. Они не обладают задержкой АВ-узла. Сейчас диагноз LGL считают спорным: у части людей короткий PQ просто вариант нормы и быстрое проведение через АВ-узел.',
'Посмотри разницу':'Дельта-волна может быть положительной или отрицательной и иногда похожа на патологический Q. Степень предвозбуждения непостоянна: зависит от того, какой путь сработал быстрее. Поэтому на разных плёнках картина у одного человека может выглядеть по-разному.',
'Откуда берётся дельта':'Импульс через пучок Кента приходит в желудочек раньше, но дальше ему приходится ползти по обычной мышце, поэтому подъём пологий. Через АВ-узел он приходит позже, зато быстро разбегается по Пуркинье и дорисовывает QRS. Такой комплекс называют сливным.',
'Почему это важно':'Чаще всего импульс идёт вниз через АВ-узел и возвращается вверх через дополнительный путь, это ортодромная тахикардия с узким QRS. При фибрилляции предсердий импульсы могут идти к желудочкам через пучок без фильтра. Частота тогда очень высокая, QRS широкие и разные, и это опасно.',
'Высокий калий: лестница':'Рост калия сначала ускоряет реполяризацию, поэтому T становится острым. Затем клетки хуже проводят: уплощается P, удлиняется PQ, расширяется QRS. Лента не всегда идёт по ступеням и может сразу дойти до опасной стадии, поэтому при подозрении ждать анализа не стоит, а тактику сверяют с протоколом.',
'Палатка или ишемия':'При гиперкалиемии изменения обычно диффузные, во многих отведениях. При ишемии они ограничены зоной артерии. Широкий QRS с брадикардией у пациента с почечной недостаточностью — повод сначала думать о калии, а уже потом о других причинах.',
'Низкий калий':'При снижении калия реполяризация удлиняется. Зубец U становится заметным и может слиться с T, поэтому QT кажется длинным. Часто рядом снижен магний, и без его коррекции калий восполняется плохо.',
'Длинный QT':'QT измеряют от начала QRS до конца T, обычно во II или V5. Если ритм неправильный, берут среднее из нескольких циклов. При широком QRS QT удлинён и без проблем с реполяризацией, это нужно учитывать.',
'Пируэт':'Запускается ранней постдеполяризацией на фоне длинного QT, особенно после паузы. Часто начинается с феномена короткий-длинный-короткий цикл. Эпизоды бывают короткими, но могут перейти в ФЖ.',
'Перикардит или инфаркт':'Воспаление затрагивает эпикард почти всего сердца, поэтому подъём ST широкий и вогнутый. Снижение PQ связано с поражением предсердий. В aVR наоборот: PQ приподнят, ST опущен. Позже ST возвращается, а T может стать отрицательной, но обычно не раньше этого.',
'ТЭЛА':'Острая нагрузка на правый желудочек вызывает перегрузку и задержку проведения. Отсюда признаки правых отделов. Эти находки неспецифичны, поэтому ЭКГ помогает заподозрить, но не подтвердить ТЭЛА.'};

const WHYQ={
'Какой цвет на левой ноге?':'Иди от правой руки по часовой стрелке: правая рука, левая рука, левая нога, правая нога. Цвета идут как на светофоре сверху вниз, а чёрный — корпус.',
'Где стоит V4?':'Найди угол Людовика, под ним второе ребро, отсчитай вниз до 5-го межреберья и веди к среднеключичной линии. От этой точки считают всё остальное.',
'Что рисует сегмент PQ?':'В это время импульс идёт через АВ-узел и пучок Гиса. Эти структуры слишком малы, чтобы дать видимый сигнал на коже.',
'СА-узел замолчал. Кто возьмёт ритм первым при здоровой системе?':'Чем ниже очаг, тем реже его собственная частота. АВ-соединение обычно даёт 40–60 ударов и узкий QRS.',
'Какие участки поражаются чаще всего?':'Правая ножка длинная и тонкая. Передняя ветвь левой ножки тонкая и зависит от одного источника кровоснабжения. Задняя получает кровь из двух бассейнов.',
'Что отражает подъём зубца P?':'Импульс рождается в правом предсердии, поэтому оно начинает возбуждаться первым и формирует начало зубца.',
'Что отражает зубец Q?':'Импульс идёт по пучку Гиса и разворачивается в перегородке, поэтому первый вектор направлен от большинства левых отведений.',
'PQ занимает 6 малых клеток при 25 мм/с. Что это значит?':'Норма до 5 клеток. Шесть значит лишнюю задержку в АВ-узле. Это АВ-блокада I степени.',
'Что входит в интервал QT?':'QT начинается с QRS и заканчивается концом T. Это вся электрическая систола желудочков, поэтому он важен при препаратах и электролитных нарушениях.',
'Что значит сегмент ST на изолинии?':'В это время все клетки желудочков находятся на плато потенциала действия, поэтому разности потенциалов почти нет.',
'Что проверить до анализа зубцов?':'Если скорость 50 мм/с, все длительности покажутся вдвое больше. Если вольтаж снижен, зубцы покажутся низкими. Поэтому сначала проверяем инструмент.',
'R-R 30 мм при 25 мм/с. Какая ЧСС?':'Делим 1500 на 30 и получаем 50. Это брадикардия.',
'R-R 30 мм при 50 мм/с. Какая ЧСС?':'При скорости 50 мм/с лента идёт вдвое быстрее, поэтому делим 3000 на 30.',
'Какие отведения смотрят на боковую стенку?':'I и aVL смотрят на верхне-боковую часть, V5 и V6 на нижне-боковую. Вместе это левая команда.',
'Что обязательно для синусового ритма?':'Частота может быть любой. Важен источник: P положительный во II, отрицательный в aVR, стоит перед каждым QRS и одной формы.',
'R в V1–V4 не растёт, вершина холма исчезла. О чём подумать?':'Плохая прогрессия R бывает при рубце передней стенки и при неверно поставленных электродах. Проверка электродов занимает секунду, поэтому начинай с неё.',
'Что общего у всех экстрасистол?':'Экстрасистола приходит раньше очередного синусового импульса. Отсюда короткий R-R перед ней, а форма P и QRS зависит от места очага.',
'Ранний узкий QRS без зубца P. Откуда?':'Импульс родился в АВ-узле и сразу пошёл вниз обычным путём, поэтому QRS узкий. Предсердия возбудились почти одновременно, поэтому P скрыт.',
'Частота 110, P перед каждым QRS, форма обычная. Что это?':'Источник на месте, просто чаще. Ищи причину в пациенте: боль, лихорадка, анемия, гиповолемия.',
'R-R плавно меняются вместе с дыханием, остальное в норме. Что это?':'На вдохе тонус вагуса падает и ЧСС растёт, на выдохе наоборот. Это вариант нормы, особенно у молодых.',
'Какие условия нужны для re-entry?':'Нужны два пути с разной скоростью и разным рефрактерным периодом. Тогда внеочередной импульс может пойти по кругу.',
'Узко, ровно, 190 в минуту, P не виден. Что это?':'QRS узкий значит импульс прошёл обычным путём. Ровный ритм и невидимый P типичны для тахикардии из АВ-соединения. Вместе с предсердной её называют наджелудочковой.',
'Можно ли по одной ленте отличить постоянную форму от пароксизмальной?':'Лента показывает один момент, а форма аритмии определяется течением: как часто, сколько длилось, проходит ли само.',
'Какая блокада опаснее?':'Мобитц 2 обычно лежит ниже АВ-узла, поэтому нижний водитель ненадёжен, и блокада может внезапно стать полной.',
'Почему СА-блокаду I степени нельзя увидеть?':'Первое, что видит ЭКГ, это возбуждение предсердий. Задержка внутри и сразу за СА-узлом до появления P не записывается.',
'Каждый второй P без QRS. Какой тип блокады?':'Чтобы отличить типы, надо сравнить PQ двух подряд проведённых комплексов. При 2 : 1 таких пар нет.',
'Что значит QRS 0,11 с с формой rsR′ в V1?':'Форма rsR′ показывает правую сторону, а ширина 0,10–0,12 с говорит, что блокада неполная.',
'Почему при блокаде ветви QRS почти не расширен?':'Ветви соединены сетью анастомозов. Импульс быстро обходит препятствие, поэтому меняется в основном направление, а не длительность.',
'Какая комбинация блокад самая частая?':'Это два самых ранимых участка проводящей системы. Сочетание называют двухпучковой блокадой.',
'ST вниз и T минус в V5–V6 при полной блокаде левой ножки. Что это?':'Когда возбуждение идёт необычным путём, реполяризация тоже меняется. Это вторичные изменения, но инфаркт на их фоне не исключён.',
'Какие признаки общие для гипертрофий?':'Больше мышцы значит сильнее вектор и выше зубцы. Сосуды отстают, поэтому внутренние слои голодают и меняются ST и T. Проводящие пути страдают, поэтому комплекс шире. Ось тянется к большей массе.',
'Почему при гипертрофии бывает депрессия ST?':'Кровь идёт в стенку снаружи внутрь. Когда стенка становится толще, а сосуды не успевают за ней, внутренний, субэндокардиальный слой получает меньше кислорода. Там возникает ишемия, и ST уходит вниз.',
'Почему ГПЖ видна поздно?':'Вектор левого желудочка намного больше. Пока правый желудочек не перевесит его, на ЭКГ его почти не видно.',
'Что такое P mitrale?':'Левое предсердие даёт конец P. Если оно увеличено, возбуждение затягивается, и зубец становится широким и двугорбым. Часто бывает при митральных пороках.',
'R V6 > R V5 > R V4. О чём это говорит?':'В норме самый высокий R стоит в V4. Если вершина сместилась к V6, значит левый желудочек стал мощнее и вектор сильнее тянется влево. Это один из признаков ГЛЖ.',
'Какая зона меняет только реполяризацию?':'Клетки при ишемии живые и возбуждаются нормально. Нарушено только восстановление, а его показывает T.',
'Подъём ST и отрицательный T. Что лежит под электродом?':'ST тянется к ране, значит рана рядом. T убегает от дыма, значит и ишемия рядом. Оба процесса лежат ближе к эпикарду.',
'Что значит Q патологический, ST вверх и T минус?':'Некроз уже сформирован, огонь ещё горит, но слабее, а вокруг дым. Такая смесь бывает в острую стадию.',
'Боль есть, ЭКГ нормальная. Инфаркт исключён?':'В первые часы ЭКГ может быть нормальной, а некоторые стенки обычные отведения не видят. Поэтому смотрят динамику ЭКГ и тропонин.',
'Подъём ST во II, III, aVF. Какая стенка?':'Это отведения снизу. Обычно здесь бассейн правой коронарной артерии, поэтому проверяют и правый желудочек.',
'Признаки в V1–V3. Какой инфаркт?':'V1–V2 смотрят на перегородку, V3 на переднюю стенку. Обычно это бассейн передней нисходящей артерии.',
'Признаки в V3–V4. Какой инфаркт?':'V3–V4 смотрят на переднюю стенку ближе к верхушке.',
'Признаки в I, aVL и всех V1–V6. Какой инфаркт?':'Захвачена большая зона, обычно это проксимальная окклюзия передней нисходящей артерии.',
'Почему задняя ишемия даёт высокий T в V1–V2?':'V1–V2 смотрят на заднюю стенку через всё сердце. То, что происходит там, выглядит наоборот.',
'Три признака WPW?':'Импульс обходит АВ-узел, поэтому PQ короткий. Часть желудочка возбуждается через мышцу, поэтому появляются дельта и широкий QRS.',
'Какой пучок при WPW?':'Пучок Кента связывает предсердие и желудочек напрямую, минуя АВ-узел.',
'Почему при LGL QRS нормальный?':'Пропущена только задержка. Желудочки возбуждаются обычным путём, поэтому QRS узкий.',
'Почему опасна ФП при WPW?':'АВ-узел обычно фильтрует импульсы. Пучок Кента этого не делает, поэтому ЧСС может стать очень высокой и перейти в ФЖ.',
'Какой QTc считается зоной высокого риска?':'Чем длиннее QTc, тем выше риск полиморфной ЖТ. Граница 0,50 с часто используется для решения о препаратах.',
'Самая частая находка при ТЭЛА?':'S1Q3T3 встречается реже, чем думают. Нормальная ЭКГ или обычная тахикардия ТЭЛА не исключают.',
'Что на ленте при пропущенном диализе?':'Широкий QRS, сливающийся с T, — поздняя стадия гиперкалиемии. Это неотложное состояние.'};

'Кто что видит':'Шесть отведений от конечностей смотрят на сердце во фронтальной плоскости, сверху, снизу и с боков. Шесть грудных смотрят в горизонтальной плоскости, как разрез вокруг грудной клетки. Вместе они дают трёхмерную картину.',
'Покрути электрическую ось':'Высота R в отведении — это проекция вектора на ось отведения. Поэтому ось определяют, сравнивая высоту зубцов. В норме вектор идёт вниз и влево, к верхушке, и сильнее всего совпадает с II отведением.',
'Откуда берутся тахикардии':'Рефрактерный период — время, когда клетка не может возбудиться заново. Круг возможен, только если импульс возвращается к началу пути, когда тот уже вышел из рефрактерности. Поэтому короткий рефрактерный период и медленное проведение делают re-entry вероятнее.',
'Лестница частот':'АВ-узел после каждого импульса какое-то время рефрактерен, поэтому пропускает ограниченное число импульсов. Предел разный у разных людей и зависит от тонуса и препаратов, поэтому 220 — только учебная цифра. Дополнительный пучок этому ограничению не подчиняется.',
'Три зоны инфаркта':'В реальном инфаркте зоны лежат друг вокруг друга: в центре некроз, вокруг повреждение, снаружи ишемия. Поэтому разные электроды над одной областью показывают разные признаки. Зона повреждения — главная цель лечения: её ещё можно спасти.',
'Как инфаркт идёт во времени':'Подъём ST появляется в первые минуты и обычно уходит за дни. Q формируется за часы. T отрицательный может держаться месяцами. Если подъём ST держится недели, думай об аневризме. Сроки у разных людей отличаются.',
'Карта инфарктов':'Признаки считаются значимыми, если они есть хотя бы в двух соседних отведениях одной группы. Поэтому сначала находим группу, а потом называем стенку.'});

MORE['Грудные электроды: этажи']='Рёбра считают от угла Людовика, выступа на грудине: рядом со вторым ребром. Смещение электрода на одно межреберье меняет форму комплекса и может имитировать патологию. У женщин электроды ставят под молочную железу, ориентируясь на те же линии.';

MORE['Как бежит возбуждение']='В покое клетка заряжена: внутри минус, снаружи плюс. Когда приходит импульс, ионы натрия входят внутрь, заряд меняется, и это деполяризация. Соседняя клетка получает толчок, и волна идёт дальше. Потом ионы возвращаются на места, это реполяризация. Пока этого не произошло, клетка не может ответить на новый импульс: это рефрактерный период.';

/* ---------- как запомнить: что запомнить, как запомнить, проверь себя ---------- */
const HOW={
'Путь импульса':{f:'Порядок: СА-узел → предсердия → АВ-узел → пучок Гиса → правая и левая ножки → волокна Пуркинье.',w:'Представь дерево кроной вниз. Наверху, у корня, два узла: СА-узел и АВ-узел. Дальше идёт ствол — пучок Гиса. Ствол делится на две большие ветви — ножки. Ветви распадаются на мелкие веточки — волокна Пуркинье. Это не выдумка: в учебниках так и пишут, «ствол пучка Гиса» и «ветви». Импульс течёт от толстого к тонкому, как сок по дереву.',d:'Закрой экран. Нарисуй дерево кроной вниз и подпиши части сверху вниз. Получилось без подсказки — порядок запомнен.'},
'Как бежит возбуждение':{f:'Деполяризация — волна возбуждения. Реполяризация — восстановление. Рефрактерный период — время, когда клетку нельзя возбудить снова.',w:'Поставь на полку ряд книг и толкни первую. Они падают по очереди: это волна возбуждения. Упавшую книгу нельзя уронить второй раз, сначала её надо поднять: это рефрактерный период. Подъём книг — реполяризация. Одна эта картинка объясняет полкурса. Вынь книгу из ряда, и волна остановится: это блокада. Поставь книги по кругу, и волна побежит без конца: это re-entry.',d:'Объясни вслух на примере полки три слова: блокада, рефрактерный период, re-entry.'},
'Почему задаёт ритм СА-узел':{f:'Собственная частота импульсов в минуту: СА-узел 60–90, АВ-узел 40–60, желудочки 20–40.',w:'Учи не три диапазона, а одну цепочку из четырёх чисел: 90, 60, 40, 20. Разрежь её на три отрезка: 90–60, 60–40, 40–20. Каждый отрезок начинается там, где кончился предыдущий. Логика простая: чем ниже по дереву, тем медленнее собственные часы. Поэтому ведёт самый верхний: он успевает выстрелить первым и сбрасывает всех остальных.',d:'Назови цепочку 90, 60, 40, 20. Затем скажи, какой пульс будет, если ритм ведёт АВ-узел (около 50 в минуту) и если желудочки (около 30 в минуту).'},
'АВ-узел: зачем нужна задержка':{f:'Импульс задерживается в АВ-узле примерно на 0,08 с. На ленте это ровный сегмент PQ.',w:'Не учи 0,08 отдельно, а получи вычитанием. Обычный интервал PQ около 0,18 с, зубец P около 0,10 с. Значит, 0,18 − 0,10 = 0,08 с. Смысл паузы тоже логичен: сначала предсердия дожимают кровь в желудочки, и только потом желудочки сокращаются. Без паузы камеры сжимались бы одновременно и мешали друг другу.',d:'Объясни, почему в этот момент на ленте ровная линия. Ответ: АВ-узел слишком мал, его сигнал на коже не виден.'},
'Пучок Гиса и ножки':{f:'Правая ножка одна. Левая делится на переднюю и заднюю ветви. Чаще страдают правая ножка и передняя ветвь левой.',w:'Посмотри на букву Л: она стоит на двух опорах. Левая ножка тоже раздваивается. Причина логичная: левый желудочек больше, ему нужны две линии. А ломается то, что тоньше и длиннее: правая ножка и передняя ветвь. Толстая задняя ветвь с двойным кровоснабжением держится дольше всех.',d:'Назови все три ветви и скажи, какая самая надёжная. Ответ: задняя ветвь левой ножки.'},
'Электроды на конечности':{f:'Правая рука — красный. Левая рука — жёлтый. Левая нога — зелёный. Правая нога — чёрный.',w:'Встань и вытяни руки. Начни с правой руки и обойди себя по часовой стрелке: правая рука, левая рука, левая нога, правая нога. Цвета идут сверху вниз, как на светофоре: красный, жёлтый, зелёный. Четвёртый, чёрный, — это корпус светофора, он же заземление. Первый легко проверить: Red и Right начинаются на R.',d:'Показывай на себе и называй цвета, пока не получится три раза подряд без паузы.'},
'Грудные электроды: этажи':{f:'V1, V2 — 4-е межреберье у края грудины. V4 — 5-е межреберье, среднеключичная линия. V5, V6 — та же высота, передняя и средняя подмышечные линии. V3 — между V2 и V4.',w:'Думай о двух этажах. На 4-м этаже по бокам от грудины живут V1 и V2. На 5-м этаже в сторону левого бока живут V4, V5, V6. V3 стоит на лестнице между этажами, поэтому его ставят после V4: лестницу не найти, пока нет верхней и нижней площадки. Цвета: красный, жёлтый, зелёный, затем коричневый, чёрный, фиолетовый.',d:'Найди на себе 4-е межреберье и поставь пальцем все шесть точек по порядку: V1, V2, V4, V3, V5, V6.'},
'Главное правило ЭКГ':{f:'Вектор идёт к электроду — зубец вверх. Уходит от электрода — зубец вниз. Идёт поперёк — зубец маленький или двухфазный.',w:'Вспомни машину ночью на трассе. Едет к тебе — фары растут в глазах, зубец вверх. Уезжает — огни уменьшаются, зубец вниз. Проезжает мимо — сначала приближается, потом удаляется: зубец двухфазный. Одно и то же сердце в разных отведениях выглядит по-разному, потому что зрители стоят в разных местах трассы.',d:'Объясни, почему в aVR почти всё отрицательное. Ответ: волна уходит от правого плеча вниз и влево.'},
'Зубец P: два предсердия':{f:'Начало зубца P — правое предсердие, конец — левое. Норма P: до 0,10 с, до 2,5 мм.',w:'СА-узел лежит в правом предсердии, значит, правое возбуждается первым: две буквы П, Правое — Первое. Левое подключается следом. Отсюда полезное следствие на будущее. Если перегружено правое, растёт начало зубца, и P становится высоким. Если левое, затягивается конец, и P становится широким.',d:'Нарисуй зубец P и подпиши, какая половина от какого предсердия.'},
'QRS: слово ПоВОрот':{f:'Q — перегородка. R — верхушка. S — основание сердца.',w:'Проведи пальцем по сердцу: импульс входит в перегородку, спускается к верхушке и поднимается к основанию. Получается U-образный маршрут, то есть поворот. В слове ПоВОрот заглавными стоят буквы маршрута: Перегородка, Верхушка, Основание. Три буквы идут в том же порядке, что Q, R и S.',d:'Нарисуй сердце и стрелками покажи три вектора. Подпиши Q, R, S.'},
'ST и T: уборка':{f:'ST — момент равновесия, линия ровная. T — реполяризация желудочков.',w:'Вернись к книгам на полке. QRS — книги падают. ST — все книги лежат, ничего не движется, поэтому линия ровная. T — книги поднимают обратно. Сразу видно, почему ST и T так чувствительны к ишемии: поднимать книги тяжелее, чем ронять, и на это нужна энергия. Нет кислорода — восстановление страдает первым.',d:'Покажи на ленте, где книги падают, где лежат, где их поднимают.'},
'Интервал или сегмент':{f:'Сегмент — только ровная линия. Интервал — зубец вместе с линией.',w:'Вспомни геометрию: сегмент — это отрезок прямой, в нём нет ничего, кроме линии. Интервал — это промежуток времени между двумя событиями, он считается от начала до начала. Поэтому интервал PQ берёт в себя зубец P, а сегмент PQ только линию после него. Значит, интервал всегда длиннее сегмента.',d:'Покажи на ленте сегмент PQ и интервал PQ, потом сегмент ST и интервал QT.'},
'Смотри в клетки, а не в секунды':{f:'При 25 мм/с: малая клетка 0,04 с, большая 0,2 с. P и QRS до 0,10 с. PQ 0,12–0,20 с. QT около 0,44 с.',w:'За 1 секунду лента проходит 5 больших клеток, отсюда большая клетка 0,2 с. Дальше всё меряй большой клеткой. Половина клетки: P и QRS. Целая клетка: верхняя граница PQ. Чуть больше двух клеток: QT. Одно число работает дважды: 0,12 с, то есть три малые клетки, — это и нижняя граница PQ, и начало широкого QRS.',d:'Возьми любую ленту и без калькулятора скажи: QRS узкий или широкий, PQ в норме или нет.'},
'Сначала паспорт ленты':{f:'Стандарт: скорость 25 мм/с, вольтаж 10 мм/мВ, 12 отведений.',w:'Запиши как дату: 25.10.12. Каждое число можно проверить глазами. 25 мм/с значит 5 больших клеток в секунду. 10 мм/мВ значит, что прямоугольная метка в начале записи высотой две большие клетки. 12 отведений значит шесть от конечностей и шесть грудных. Если метка другой высоты, все зубцы на ленте обманывают.',d:'Открой любую ЭКГ и найди на ней эти три числа, прежде чем смотреть на зубцы.'},
'РЫЧАГ на ОСИ':{f:'Порядок: ритм, ЧСС, ось, затем P, QRS, ST, T и интервалы.',w:'Слово РЫЧАГ начинается с РЫтма и ЧАстоты, а рычаг всегда крепится на ОСИ. Порядок логичен: сначала проверяем, срочная ли ситуация (ритм и частота), потом где искать (ось), а потом спокойно читаем комплекс слева направо, как строчку в книге. Торопиться к ST нельзя: при широком QRS он читается иначе.',d:'Возьми ленту и вслух пройди по шагам, не пропуская ни одного.'},
'ЧСС за три секунды':{f:'ЧСС в минуту = 300 / число больших клеток между R. Или 1500 / R-R в мм при 25 мм/с.',w:'Ряд 300, 150, 100, 75, 60, 50 не надо зубрить. В минуте 60 секунд, в каждой 5 больших клеток, всего 300 клеток. Значит, одна клетка между R даёт 300 ударов, две — 150, три — 100, четыре — 75. Ты просто делишь 300 на 1, 2, 3, 4, 5, 6. Если ритм неправильный, посчитай R за 6 секунд, то есть за 30 больших клеток, и умножь на 10.',d:'Поставь палец на R, считай клетки до следующего R и говори 300, 150, 100, 75 на каждой.'},
'Синусовый ли ритм':{f:'P положительный во II, отрицательный в aVR, стоит перед каждым QRS, одной формы.',w:'СА-узел сидит наверху справа, поэтому импульс идёт вниз и влево. Это прямо на электрод II, значит, зубец вверх. И прямо прочь от правой руки, значит, в aVR зубец вниз. Частота тут ни при чём: синусовый ритм может быть и 40, и 150 в минуту. Коротко: во II да, в aVR нет.',d:'Найди на ленте II и aVR. Скажи, откуда идёт импульс.'},
'Кто что видит':{f:'II, III, aVF — низ. I, aVL, V5, V6 — левый бок. V1, V2 — правые отделы и перегородка. V3, V4 — передняя стенка и верхушка.',w:'Не учи таблицу, а смотри, где стоит электрод. II, III и aVF связаны с левой ногой, значит, смотрят снизу. I и aVL связаны с левой рукой, значит, смотрят сбоку. Грудные видят то, что прямо под ними: положи ладонь на грудь и проведи от грудины влево. Так и идут отведения от V1 к V6.',d:'Положи ладонь на грудь и назови, что лежит под каждым грудным электродом.'},
'Две команды отведений':{f:'Левая команда: I, aVL, V5, V6. Правая команда: III, aVF, V1, V2.',w:'Правило то же: смотри, где электрод. V5 и V6 лежат на левом боку, I и aVL смотрят с левой руки. В названии aVL буква L значит Left. А V1 и V2 ближе всего к правому желудочку. Команды зеркальны: когда левая показывает подъём, правая показывает спуск. Поэтому при блокадах и гипертрофиях картина в V1 и V6 противоположна.',d:'Закрой экран и перечисли обе команды.'},
'Покрути электрическую ось':{f:'Ось — суммарное направление возбуждения. В норме она идёт вниз и влево.',w:'Представь, что сердце тянут за верёвку. Ось всегда показывает туда, где больше мышцы, поэтому в норме смотрит на левый желудочек. Мышцы стало больше — ось тянется к ней. Появился рубец — ось уходит от него, потому что мёртвая ткань не тянет. Так ось подсказывает, где искать проблему.',d:'Поставь ползунок на вправо и назови причину, которая могла бы это дать. Например, гипертрофия правого желудочка.'},
'Ось за секунду':{f:'Нормальная: R во II выше, чем в I, а в I выше, чем в III. Влево: I > II > III. Вправо: III > II > I.',w:'Смотри, где самый высокий R. Ось влево — ближе всех I, это левая рука, счёт идёт вперёд: 1, 2, 3. Ось вправо — ближе всех III, счёт идёт назад: 3, 2, 1. Норма — выше всех II, двойка выбилась вперёд: 2, 1, 3. Проверка по двум отведениям: если QRS в I смотрит вверх, а в III вниз, они разлетаются, и это Лево. Если в I вниз, а в III вверх, они сходятся, и это Право.',d:'На любой ленте сравни R в I, II, III и назови порядок цифрами.'},
'Прогулка по комплексу':{f:'P до 0,10 с и до 2,5 мм. QRS до 0,10 с. Q меньше ¼ R. ST на изолинии. PQ 0,12–0,20 с. QTc примерно до 0,45 с.',w:'Читай ленту как предложение: слева направо, каждое слово. Задавай один вопрос на каждый элемент. P: откуда импульс. QRS: узкий ли, нет ли большого Q. ST: на линии ли. T: смотрит ли туда же, куда QRS. Интервалы: не короткий ли PQ, не длинный ли QT. Пять вопросов всегда в одном порядке работают как чек-лист в авиации.',d:'Прочитай ленту вслух по этим пяти вопросам.'},
'Холм в грудных отведениях':{f:'R растёт от V1 к V4, потом снижается. S наоборот уменьшается.',w:'Электрод V1 смотрит на тонкий правый желудочек, поэтому R там маленький. Чем дальше влево, тем больше мышцы под электродом, и R растёт. На V4 вершина: прямо под ней верхушка сердца. Дальше электрод уходит вбок, и R снижается. Запомни: четвёрка — вершина. Вершина сползла к V6 — думай о гипертрофии, холма нет — думай о рубце.',d:'На ленте найди, где R выше всего. Если не в V4 или рядом, объясни почему.'},
'Синусовые аритмии':{f:'Тахикардия — больше 90 в минуту. Брадикардия — меньше 60 в минуту.',w:'Слова греческие, и их легко связать с жизнью. Тахи — быстрый: в машине тахометр показывает обороты. Бради — медленный: научное название ленивца — брадипод. Рядом стоят два числа: 60 и 90, нижняя и верхняя отметка нормы. А дыхательная аритмия — это норма: на вдохе ритм чаще, на выдохе реже.',d:'Посчитай свой пульс на вдохе и на выдохе. Заметишь разницу сам.'},
'Экстрасистола':{f:'R-R перед ней короче. Предсердная: P другой, QRS узкий. Из АВ-узла: P нет, QRS узкий. Желудочковая: P нет, QRS шире 0,12 с.',w:'Сигнал по проводу бежит мгновенно, а по мокрой верёвке ползёт. Проводящая система — провод, обычная мышца — верёвка. Импульс из предсердия или АВ-узла входит в провод, поэтому QRS узкий. Импульс из желудочка стартует в мышце и ползёт по ней, поэтому QRS широкий и уродливый. Коротко: Узкий — из Узла или выше, Жирный — из Желудочка.',d:'Открой любую экстрасистолу и задай три вопроса: рано ли, какой P, какой QRS.'},
'Где очаг в предсердии':{f:'Очаг вверху — P положительный. В середине — двухфазный. Внизу — отрицательный.',w:'Это снова правило вектора. Электрод II смотрит снизу. Очаг вверху отправляет волну вниз, к нему, и зубец смотрит вверх. Очаг внизу отправляет волну вверх, от него, и зубец смотрит вниз. Очаг посередине шлёт волну в обе стороны, поэтому зубец двухфазный. Запоминать нечего: достаточно мысленно провести стрелку.',d:'Нарисуй предсердие, поставь точку и предскажи форму P.'},
'Как они ходят':{f:'Бигеминия: чередование 1 : 1. Тригеминия: экстрасистола после двух нормальных комплексов.',w:'Приставка считает удары в повторяющемся цикле. Вспомни мышцы: бицепс — две головки, трицепс — три. Бигеминия — цикл из двух ударов: нормальный и экстрасистола. Тригеминия — цикл из трёх: два нормальных и экстрасистола. Три и более желудочковых комплекса подряд — уже пробежка желудочковой тахикардии.',d:'Простучи пальцем: нормальный, ранний, нормальный, ранний. Это бигеминия.'},
'Откуда берутся тахикардии':{f:'Re-entry — импульс ходит по кругу. Нужны два пути с разной скоростью и разным рефрактерным периодом.',w:'Поставь книги по кругу. Волна обходит круг, а за это время первые книги успевают подняться, и волна идёт на новый круг. Если круг короткий, волна упрётся в лежащие книги и остановится. Поэтому кольцу нужно замедление на одном участке: медленный путь даёт время остальным восстановиться. Re-entry значит повторный вход.',d:'Объясни вслух, зачем в круге нужен медленный участок.'},
'Лестница частот':{f:'В минуту: предсердная тахикардия 120–220, трепетание предсердий 240–340, фибрилляция предсердий 350–600.',w:'Считай сотнями: двести, триста, четыреста с лишним. Чем хаотичнее картина, тем выше частота. Тахикардия — один очаг, импульсы проходят все. Трепетание — один большой круг, ровная пила. Фибрилляция — множество мелких волн, рябь. АВ-узел работает фильтром: примерно на 220 в минуту он перестаёт пропускать всё подряд.',d:'Закрой экран и назови три ступени с частотами в минуту.'},
'Три вопроса к любой тахикардии':{f:'Три вопроса: какой QRS, какие R-R, что вместо P.',w:'Смотри на ленту как врач в приёмном. Первый взгляд на ширину: узкий значит импульс шёл по проводу, очаг выше желудочков. Широкий значит тревога: это желудочковая тахикардия, пока не доказано другое. Второй взгляд на ритм: линейкой сравни R-R. Третий на предсердия: другой P, пила, рябь или ничего. Три ответа дают диагноз без заучивания картинок.',d:'Открой ленту в разделе Игра и задай три вопроса, прежде чем нажимать ответ.'},
'Узкие тахикардии':{f:'Трепетание: пила F, ровно. Фибрилляция: рябь f, все R-R разные. Предсердная: другой P. АВ-тахикардия: P не видно.',w:'Слово трепетание подсказывает ровную дрожь: зубья пилы одинаковы. Слово фибрилляция идёт от латинского fibrilla, волоконце: каждое волоконце дёргается само по себе, поэтому порядка нет. Ровная тахикардия около 150 в минуту — повод поискать скрытое трепетание с проведением 2 : 1. Запомни эту цифру, это частая ловушка.',d:'На ленте фибрилляции приложи линейку к трём R-R и убедись, что они разные.'},
'Широкие: тут счёт на минуты':{f:'Желудочковая тахикардия: широкие одинаковые QRS, ровные R-R, больше 100 в минуту. Трепетание желудочков: синусоида. Фибрилляция желудочков: хаос без комплексов.',w:'Смотри, как разваливается порядок. Желудочковая тахикардия — комплексы ещё различимы. Трепетание желудочков — комплексы слились в синусоиду. Фибрилляция — от волны не осталось ничего. Это одна лестница вниз, к остановке кровообращения. Первый шаг всегда один: посмотри на пациента. Хаос на экране у разговаривающего человека — это артефакт.',d:'Расставь по порядку от лучшего к худшему: фибрилляция, тахикардия, трепетание желудочков.'},
'Степени всегда одни и те же':{f:'I степень — задержка. II степень — часть импульсов теряется. III степень — не проходит ни один.',w:'Вернись к ряду книг. Первая степень: книги падают медленнее, но падают все. Вторая: иногда волна обрывается. Третья: в ряду вынули книгу, волна не проходит совсем, и дальше книги падают сами по себе, от другого толчка. Эта логика одинакова и для СА-блокады, и для АВ-блокады.',d:'Опиши все три степени своими словами, не глядя на экран.'},
'Главное отличие':{f:'СА-блокада: выпадает весь цикл вместе с P. АВ-блокада: P остаётся, выпадает только QRS.',w:'P показывает, что импульс вышел из СА-узла и прошёл предсердия. Если в паузе P есть, значит, импульс дошёл до АВ-узла и застрял там: это АВ-блокада. Если в паузе нет и P, импульс не вышел вообще: это СА-блокада. Поэтому в любой паузе первым делом ищи P, в том числе спрятанный на зубце T.',d:'Найди паузу на ленте и скажи, есть ли в ней P.'},
'АВ-блокады':{f:'I степень: PQ больше 0,2 с. Мобитц 1: PQ растёт, потом выпал QRS. Мобитц 2: PQ постоянный, QRS выпал внезапно. III степень: P и QRS не связаны.',w:'Студенты-медики учат это стихами. Прочитай вслух два раза, ритм сам держит порядок.<br><br><i>Длинный PQ, но всё дошло — значит, первая прошло.<br>Дольше, дольше, дольше — нет: Венкебах даёт ответ.<br>Ровно, ровно — и провал: Мобитц два тебя застал.<br>P и R живут вразброд: третья, полный это блок.</i>',d:'Простучи пальцем по столу: тук, тук-тук, тук-тук-тук, пауза. Это Мобитц 1. Потом ровно: тук, тук, тук, пауза. Это Мобитц 2.'},
'Если выпал каждый второй':{f:'При блокаде 2 : 1 тип по ленте не определить.',w:'Чтобы сказать, растёт ли PQ, нужно сравнить два PQ подряд. При 2 : 1 перед каждой паузой только один проведённый удар, сравнивать не с чем. Подсказка: узкий QRS чаще значит уровень АВ-узла, широкий — ниже. Запись подлиннее иногда показывает участок 3 : 2, и тип становится виден.',d:'Объясни другу в двух предложениях, почему при 2 : 1 нельзя назвать тип.'},
'СА-блокады':{f:'Тип 1: R-R укорачиваются, пауза меньше 2 R-R. Тип 2: пауза ровно 2 R-R, если выпал один цикл.',w:'Здесь работает простая арифметика. Если выпал ровно один импульс, а СА-узел продолжил свой ритм, следующий удар придёт ровно через два обычных промежутка. Поэтому тип 2 — пауза 2 R-R, цифра в названии совпадает с паузой. Если пауза не кратна R-R, думай об остановке синусового узла.',d:'Измерь на ленте R-R и паузу. Подели одно на другое.'},
'Если СА-узел молчит':{f:'Ритм берёт нижний очаг: АВ-узел 40–60 в минуту, узкий QRS. Желудочки 20–40 в минуту, широкий QRS.',w:'Рифма: ниже — реже. Вспомни цепочку 90, 60, 40, 20. Такой комплекс называют выскальзывающим, и он приходит поздно, а не рано. В этом главное отличие от экстрасистолы: экстрасистола спешит, а выскальзывающий комплекс страхует. Подавлять его нельзя, это запасной генератор.',d:'Скажи, чем выскальзывающий комплекс отличается от экстрасистолы по времени.'},
'Почему QRS становится широким':{f:'Блокада ножки: QRS шире, конец комплекса показывает на больную сторону.',w:'В норме оба желудочка получают импульс почти одновременно. Если один провод оборван, вторая половина получает импульс через мышцу, как по мокрой верёвке, и опаздывает. Опоздавший рисует конец QRS. Значит, куда смотрит конец комплекса, там и заблокированная сторона.',d:'Посмотри на конец QRS в V1 и назови сторону.'},
'Буква М живёт там, где блокада':{f:'Правая ножка: rsR′ в V1, широкий S в V6. Левая ножка: широкий R в V5–V6, глубокий S в V1.',w:'За рубежом это учат двумя именами: WiLLiaM и MaRRoW. Читай так. В слове WiLLiaM внутри LL, то есть Left: W в V1 и M в V6. В слове MaRRoW внутри RR, то есть Right: M в V1 и W в V6. Первая буква показывает форму в V1, последняя в V6. Форма М при правой блокаде ещё похожа на заячьи уши.',d:'Выпиши оба слова и подпиши под первой и последней буквой V1 и V6.'},
'Поворотник в V1':{f:'Конец QRS в V1 вверх — правая ножка. Вниз — левая ножка.',w:'Это быстрая проверка, если форма неясна. В машине рычаг поворотника вверх значит направо, вниз значит налево. Посмотри на конец QRS в V1 как на рычаг. Работает логика: правый желудочек ближе к V1, поэтому его опоздание рисует подъём. Левый дальше, поэтому его опоздание уходит вниз. Важно: приём работает только при широком QRS.',d:'Покажи рукой поворотник и назови блокаду на двух лентах из этой темы.'},
'Полная или неполная':{f:'Неполная: QRS 0,10–0,12 с. Полная: QRS больше 0,12 с.',w:'Здесь не нужна новая цифра. 0,12 с — те самые три малые клетки, с которых QRS считается широким. Форма показывает сторону, а ширина показывает степень. Отдельно запомни предупреждение: при полной блокаде ST и T меняются вторично и могут скрыть инфаркт. Новая блокада левой ножки у пациента с болью всегда требует внимания.',d:'Посчитай ширину QRS в малых клетках на ленте блокады.'},
'Ветви левой ножки':{f:'Передняя ветвь: ось ≤ −60°, S больше R во II, III, aVF. Задняя ветвь: ось ≥ +120°, S больше R в I, aVL.',w:'Логика: ось уходит туда, куда импульс приходит последним. Передняя ветвь питает верхне-боковую часть, поэтому при её блокаде ось тянется вверх и влево. Задняя питает нижнюю часть, поэтому ось тянется вниз и вправо. Для памяти: задним ходом смотрят через правое плечо, значит, задняя — вправо, а передняя — влево.',d:'Ось −70°. Скажи, какая ветвь и в каких отведениях S больше R.'},
'Перекачанная мышца':{f:'Признаки гипертрофии: выше зубцы, ST вниз, шире комплекс, ось в сторону гипертрофии.',w:'Представь спортсмена, который нарастил мышцы, а сосуды за ними не успели. Больше мышцы значит громче сигнал: зубцы выше. Кровь идёт снаружи внутрь и не дотягивается до глубоких слоёв: ST вниз. Проводящие пути лежат именно там и страдают: комплекс шире. Самая большая мышца тянет на себя: ось сдвигается. Четыре слова: громче, голоднее, медленнее, тянет.',d:'Назови четыре слова и к каждому покажи изменение на ленте.'},
'Предсердия: пик или верблюд':{f:'P pulmonale: правое предсердие, высокий острый, больше 2–2,5 мм. P mitrale: левое предсердие, двугорбый, шире 0,10–0,12 с.',w:'Правое предсердие даёт начало зубца и работает вовремя, поэтому зубец просто растёт вверх: получается пик. Лёгкие давят на правое сердце, отсюда название pulmonale. Левое даёт конец зубца и опаздывает, поэтому появляется второй горб: зубец становится похож на букву М и на верблюда. Митральный порок начинается на М.',d:'Нарисуй оба зубца и подпиши, где какое предсердие.'},
'Левый желудочек':{f:'Индекс Соколова–Лайона: S в V1 + R в V5 или V6 ≥ 35 мм. Признак: R в V6 > R в V5 > R в V4.',w:'35 мм — это семь больших клеток. Считай клетками: глубина S в V1 плюс высота R в V5 или V6. Если сумма дошла до семи больших клеток, думай о гипертрофии левого желудочка. Такая же семёрка есть у правого желудочка, только в малых клетках: семь больших слева, семь малых справа.',d:'Сложи S в V1 и R в V5 на ленте из этой темы и переведи в большие клетки.'},
'Правый желудочек':{f:'Гипертрофия правого желудочка: R в V1 больше 7 мм. R в V1 + S в V5 или V6 больше 10,5 мм.',w:'Вторая семёрка: семь малых клеток в V1. Порог низкий, потому что правый желудочек тонкий и в норме почти не слышен за левым. Чтобы он проявился, ему нужно перевесить левого, поэтому на ленте он виден поздно. Если R в V1 стал больше S, это уже повод задуматься.',d:'Скажи без подсказки: семь больших где, семь малых где.'},
'Три зоны инфаркта':{f:'Ишемия меняет T. Повреждение меняет ST. Некроз меняет Q и снижает R.',w:'Инфаркт похож на пожар. Ишемия — дым: неприятно, но если проветрить, всё обратимо. Повреждение — огонь: ещё можно потушить, и именно ради этого спешат. Некроз — угли: уже не спасти. Заодно запомни порядок на ленте: иди по комплексу справа налево, T, ST, Q. Чем тяжелее поражение, тем левее след.',d:'Назови три зоны и покажи на ленте, какой элемент меняет каждая.'},
'Два правила вместо девяти рисунков':{f:'ST смещается в сторону зоны повреждения. T смотрит в сторону, противоположную зоне ишемии.',w:'Электрод стоит снаружи. Огонь притягивает: ST тянется к повреждению. Рядом с электродом — ST вверх, у эндокарда — ST вниз. От дыма отворачиваются: T смотрит прочь от ишемии. Рядом с электродом — T отрицательный, у эндокарда — T высокий. Запомнив две фразы, ты выведешь все девять рисунков сам.',d:'Закрой рисунки и предскажи ST и T для субэпикардиальной и субэндокардиальной зоны.'},
'Ишемия меняет T':{f:'Субэндокардиальная: высокий острый T. Субэпикардиальная: T отрицательный. Трансмуральная: T глубокий отрицательный.',w:'Используй правило «от дыма отворачиваются». Дым у эпикарда, рядом с электродом: T уходит вниз. Дым в глубине: T смотрит на электрод и становится высоким. Трансмуральная ишемия захватывает всю стенку, поэтому отрицательный T особенно глубокий. Важно: изменения T малоспецифичны, поэтому смотри на них вместе с клиникой.',d:'Скажи, где лежит дым, если T высокий и острый.'},
'Повреждение меняет ST':{f:'Субэндокардиальное: ST вниз. Субэпикардиальное: ST вверх. Трансмуральное: высокий подъём ST, слитый с T.',w:'Используй правило «огонь притягивает». Огонь рядом с электродом: ST вверх. Огонь в глубине: ST вниз. Трансмуральное повреждение даёт такую выпуклую дугу, что её прозвали кошачьей спинкой: представь кошку, выгнувшую спину. Увидел дугу у пациента с болью — это экстренная ситуация.',d:'Нарисуй кошачью спинку и подпиши, где QRS, где ST, где T.'},
'Некроз меняет Q':{f:'Патологический Q глубже ¼ R и шире 0,03 с. Трансмуральный некроз: комплекс QS.',w:'Мёртвая ткань электрически молчит и работает как окно. Электрод смотрит сквозь него на противоположную стенку и видит волну, которая уходит прочь. Отсюда отрицательный Q. Чем толще окно, тем глубже Q, и при некрозе на всю толщу остаётся только QS. Ширина 0,03 с — это чуть меньше одной малой клетки.',d:'На ленте сравни глубину Q и высоту R. Больше четверти или нет?'},
'Как инфаркт идёт во времени':{f:'Сначала ST вверх, потом появляется Q, затем T уходит вниз, ST возвращается. В конце остаётся Q.',w:'Пожар гаснет в понятном порядке. Сначала уходит огонь: ST возвращается на линию, обычно за дни. Дольше держится дым: отрицательный T может стоять неделями и месяцами. Угли остаются надолго: Q чаще всего сохраняется на всю жизнь. Прочитай ленту как пепелище: что ещё горит, что дымит, что уже остыло.',d:'Подвинь ползунок и на каждом шаге скажи, что ещё горит.'},
'Цифры и ловушки':{f:'Подъём ST в точке J в двух соседних отведениях: от 1 мм. В V2–V3: мужчины до 40 лет от 2,5 мм, мужчины от 40 лет от 2 мм, женщины от 1,5 мм.',w:'Запомни одну мысль: везде 1 мм, но в V2–V3 порог выше, потому что там ST и в норме немного поднят. Дальше простая лестница: женщины 1,5 мм, мужчины 2 мм, молодые мужчины 2,5 мм. Каждая ступень на полмиллиметра. Точка J — место, где заканчивается QRS и начинается ST.',d:'Закрой экран и назови четыре порога.'},
'Пол, стена, фасад':{f:'Нижний: II, III, aVF. Боковой: I, aVL, V5, V6. Передний: V1–V4.',w:'Снова смотри, откуда смотрит электрод. II, III, aVF связаны с левой ногой, значит, смотрят снизу: это пол. I и aVL связаны с левой рукой, V5 и V6 лежат на боку: это стена. V1–V4 лежат спереди: это фасад. Войди в комнату мысленно и назови отведения на полу, на стене и на фасаде. Таблицу учить не надо.',d:'Назови отведения для пола, стены и фасада. Затем скажи, какая стенка поражена при подъёме ST во II, III, aVF.'},
'Зеркало':{f:'Изменения на противоположной стенке выглядят наоборот. Подъём ST там, депрессия тут.',w:'Встань перед зеркалом и подними правую руку: отражение поднимет другую. Электрод, стоящий напротив поражённой стенки, видит процесс зеркально. Поэтому при подъёме ST в нижних отведениях депрессия в V1–V3 или в I, aVL часто лишь зеркало. Это полезно: настоящая реципрокная депрессия подтверждает, что подъём ST настоящий.',d:'Скажи, что считать первичным при подъёме во II, III, aVF и депрессии в aVL.'},
'Смотри все двенадцать':{f:'Задняя стенка: V7–V9. Правый желудочек: V3R–V4R.',w:'Обычные отведения видят не всё. Если не хватает, просто продолжи ряд. Задние отведения идут дальше по кругу: после V6 идут V7, V8, V9. Правые отведения — это те же V3 и V4, но зеркально на правой половине груди, поэтому в названии буква R, Right.',d:'Покажи на себе, где стоял бы V7 и где V4R.'},
'Обходной путь':{f:'WPW: PQ меньше 0,12 с, дельта-волна, широкий QRS, пучок Кента. LGL: PQ меньше 0,12 с, обычный QRS, пучок Джеймса.',w:'Расшифруй аббревиатуру по-русски: WPW — Волна Пологая Вначале. Это и есть дельта-волна, главный признак. Кент — Короткий путь: две буквы К. Логика проста: импульс обходит АВ-узел, поэтому задержки нет и PQ короткий. Он входит в желудочек через мышцу, поэтому старт пологий и QRS широкий.',d:'Назови три признака WPW и объясни каждый одной фразой.'},
'Откуда берётся дельта':{f:'Дельта-волна — пологое начало QRS при WPW.',w:'Греческая буква дельта — треугольник, Δ. Его наклонная сторона и есть пологое начало QRS. Почему пологое: часть желудочка возбуждается раньше, но через мышцу, то есть медленно. Потом подходит импульс через АВ-узел и быстро дорисовывает остальное. Такой комплекс называют сливным.',d:'Нарисуй QRS с дельта-волной и подпиши, какая часть откуда.'},
'Почему это важно':{f:'Фибрилляция предсердий при WPW опасна: у пучка Кента нет фильтра.',w:'АВ-узел работает как предохранитель: он не пропускает слишком частые импульсы. У пучка Кента предохранителя нет. Поэтому при фибрилляции предсердий импульсы могут идти к желудочкам очень часто и вызвать фибрилляцию желудочков. Препараты, замедляющие АВ-узел, только откроют дорогу через пучок. Тактику сверяй с рекомендациями.',d:'Объясни, почему препарат, замедляющий АВ-узел, здесь может навредить.'},
'Высокий калий: лестница':{f:'Порядок: острый T → плоский P → широкий QRS → синусоида.',w:'Самое простое правило: калий вверх — T вверх. Высокий узкий T похож на палатку, в англоязычных книгах его так и называют, tented T. Дальше клетки хуже проводят, поэтому лента как будто тает: сначала исчезает P, потом расплывается QRS, потом всё превращается в синусоиду. Представь тающую свечу: сначала пик, потом всё оплывает.',d:'Закрой экран и назови четыре ступени по порядку.'},
'Палатка или ишемия':{f:'При гиперкалиемии T узкий и симметричный, обычно во многих отведениях.',w:'Нарисуй палатку: узкое основание, ровные скаты, острый верх. Это T при высоком калии. При ишемии T обычно шире и смотрит только в зону одной артерии. Ещё одна подсказка — история болезни: почечная недостаточность, пропущенный диализ, калийсберегающие препараты. Увидел узкую палатку и такой анамнез — проверь калий.',d:'Назови три ситуации, когда первым делом думаешь о калии.'},
'Низкий калий':{f:'Плоский T, ST чуть вниз, появляется зубец U, удлиняется QT.',w:'Обратная сторона правила: калий вниз — T вниз. Зубец сдувается, как шарик, и за ним становится заметен U. Лента выглядит вялой, но сердце при этом раздражительное, и риск аритмий растёт. Вспомни пару: при низком калии часто низкий и магний. Без него калий восполняется плохо.',d:'Нарисуй комплекс с плоским T и зубцом U.'},
'Длинный QT':{f:'QTc = QT / √R-R, в секундах. Граница около 0,45 с у мужчин и 0,46–0,47 с у женщин. Опасно больше 0,50 с.',w:'Быстрая прикидка — правило половины: при обычной частоте T должен закончиться раньше середины между двумя R. Перешёл середину — считай QTc. Опасную границу держи как полсекунды: 0,50 с, то есть две с половиной большие клетки. Формула Базетта завышает при тахикардии и занижает при брадикардии.',d:'На ленте найди середину R-R и посмотри, где кончается T.'},
'Пируэт':{f:'Полиморфная желудочковая тахикардия на фоне длинного QT.',w:'Название французское, torsades de pointes, «скручивание вершин». Представь ленту на ветру: она закручивается и раскручивается, то шире, то уже. Именно так выглядит амплитуда комплексов вокруг изолинии. Связка, которую надо помнить: длинный QT приводит к пируэту, а пируэт может перейти в фибрилляцию желудочков.',d:'Объясни, какая связь между QT, магнием и пируэтом.'},
'Перикардит или инфаркт':{f:'Перикардит: подъём ST почти везде, вогнутый, PQ снижен, нет зеркала.',w:'Запомни три П при перикардите: Повсюду, Плавный, PQ снижен. Вогнутый ST похож на улыбку, а выпуклый при инфаркте — на хмурую бровь. Логика простая: воспаление покрывает сердце снаружи почти целиком, поэтому изменений много и они одинаковы. Инфаркт же сидит в зоне одной артерии и даёт зеркало напротив.',d:'Посмотри на форму ST: улыбается он или хмурится?'},
'ТЭЛА':{f:'Чаще всего синусовая тахикардия. Иногда S1Q3T3 и признаки перегрузки правых отделов.',w:'Формулу S1Q3T3 читай так: S в первом, Q и T в третьем. Но главное другое: это редкая красивая картинка из учебника, а обычная находка — просто тахикардия. Нормальная ЭКГ тромбоэмболию лёгочной артерии не исключает. Запомни логику: внезапно перегружен правый желудочек, значит, ищи признаки справа.',d:'Расшифруй S1Q3T3 и объясни, почему её отсутствие ничего не исключает.'}};

 v.innerHTML=`<div class="view"><section class="hero"><div class="hl"><span class="chip a">Версия на проверке у врачей</span><h1>ЭКГ шаг за шагом</h1><p>Сначала понимаешь, потом тренируешься, потом играешь. На каждую тему есть понятная логика и приёмы запоминания. Регистрация не нужна.</p><div class="rowb"><a class="btn pri" href="${href}">${lab}${ic('arrow',18)}</a></div></div><div class="hr"><img class="hheart" src="${IMG('heart')}" alt="" width="120" height="120">${tapeHtml({s:'sinus',mode:'run',per:4.8,head:1,replay:false,tag:' '})}</div></section>
 <div class="three"><a class="card sec t" href="#teoria"><img class="ico3" src="${IMG('book')}" alt="" width="64" height="64"><h2>Теория</h2><p>12 тем: суть, приёмы запоминания, что знать наизусть и как читать ленту.</p><span class="pg"><span>Прочитано ${dn()} из 12</span>${ic('arrow',18)}</span></a>

function topics(v,mode){const s=step(),openG=GROUPS.findIndex(g=>g[1].includes(s?s.m:1));const done=m=>mode==='t'?!!(S.th[m]&&S.th[m].done):!!(S.pr[m]&&S.pr[m].stars);const box=document.createElement('div');box.style.cssText='display:flex;flex-direction:column;gap:12px';
 GROUPS.forEach((g,gi)=>{const d=g[1].filter(done).length;const c=document.createElement('div');c.className='card grp'+(gi===openG?' open':'');c.innerHTML=`<button><b>${g[0]}</b><span style="display:flex;align-items:center;gap:8px">${d} из ${g[1].length}${ic('down',18,'ch')}</span></button><div class="rows" ${gi===openG?'':'hidden'}>${g[1].map(m=>{const ch=COURSE[m-1],dn_=done(m),cur=s&&s.m===m&&((mode==='t'&&s.k==='t')||(mode==='p'));return`<a class="tp ${dn_?'done':cur?'cur':''}" href="#${mode}${m}"><span class="n">${m}</span><span><b>${ch.t}</b><small>${ch.d}</small></span><span class="s">${mode==='p'&&S.pr[m]?stars(S.pr[m].stars,15):dn_?'готово':cur?'сейчас':''}</span></a>`}).join('')}</div>`;c.firstChild.onclick=()=>{const r=c.querySelector('.rows');r.hidden=!r.hidden;c.classList.toggle('open',!r.hidden)};box.append(c)});v.append(box)}
function vTeoria(v){document.documentElement.style.setProperty('--acc',C_TH[0]);document.documentElement.style.setProperty('--acc-b',C_TH[1]);v.innerHTML=`<div class="view" id="vv"><div class="pt"><h1>Теория</h1><p>Иди сверху вниз. Каждая тема занимает 5–10 минут и заканчивается блоками «Знать наизусть» и «Как легче всего прочитать».</p></div></div>`;topics($('vv'),'t');$('vv').insertAdjacentHTML('beforeend','<p class="foot"><a href="#shpora">Открыть шпаргалку</a></p>')}
function vPrak(v){document.documentElement.style.setProperty('--acc',C_PR[0]);document.documentElement.style.setProperty('--acc-b',C_PR[1]);const p=pool(),due=p.filter(isDue).length,fr=Math.min(NEWD,p.filter(c=>!S.cards[c.id]).length);v.innerHTML=`<div class="view" id="vv"><div class="pt"><h1>Практика</h1><p>Вопросы по темам с разбором. Чтобы закрепить тему, нужно 70% верных.</p></div><a class="card" href="#povtor" style="flex-direction:row;align-items:center;justify-content:space-between;gap:14px"><span><b style="font-size:18px">Повторение на сегодня</b><br><span class="meta">${due?`Ждут ${due} карточек`:fr?`Новых карточек: ${fr}`:'На сегодня всё повторено'}</span></span>${ic('arrow',20)}</a></div>`;topics($('vv'),'p')}
function vIgra(v){document.documentElement.style.setProperty('--acc',C_GM[0]);document.documentElement.style.setProperty('--acc-b',C_GM[1]);const t=dayStr(),done=S.daily[t]!==undefined;v.innerHTML=`<div class="view"><div class="pt"><h1>Игра: определи ленту</h1><p>Уровни открываются по очереди. Три звезды — без единой ошибки.</p></div><div class="map" id="mp">${LEVELS.map((l,i)=>`<button class="lvl" data-i="${i}" ${lvOpen(i)?'':'disabled'}><span class="n">${lvOpen(i)?i+1:ic('lock',20)}</span><span><b>${l.t}</b><small>${l.d}</small></span>${stars(S.lv[i]||0,15)}</button>`).join('')}</div><div class="three" style="grid-template-columns:repeat(auto-fit,minmax(240px,1fr))"><button class="card" id="gs" style="text-align:left"><b style="font-size:18px">Ночное дежурство</b><span class="meta">60 секунд, рекорд ${S.shift.best}</span></button><a class="card" href="#den"><b style="font-size:18px">Лента дня</b><span class="meta">${done?'Сегодня уже разгадано':'Одна новая лента каждый день'}</span></a></div></div>`;[...$('mp').children].forEach(b=>b.onclick=()=>{location.hash='l'+(+b.dataset.i+1)});$('gs').onclick=()=>{location.hash='smena'}}
/* карточки */
let queue=[],open_=false;const NEWD=15;
function pool(){const got=Object.keys(S.pr).filter(k=>S.pr[k].stars).map(Number);const on=got.length?got:[1];return C.filter(c=>on.includes(c.m)||S.cards[c.id])}
function openCards(){shell({t:'Повторение',back:'praktika',acc:C_PR[0],accb:C_PR[1]});$('pv').style.visibility='hidden';$('nx').hidden=true;const p=pool(),due=p.filter(isDue),fr=p.filter(c=>!S.cards[c.id]).slice(0,NEWD);queue=[...due,...fr];RUN={k:'c',n:queue.length};open_=false;showC()}
function showC(){const h=body(1);setBar(RUN.n-queue.length,Math.max(1,RUN.n));if(!queue.length){h.innerHTML='<div class="solo col" style="text-align:center"><h2>На сегодня всё</h2><p class="tx">Следующие карточки придут по расписанию.</p><div class="rowb"><a class="btn pri" href="#praktika">К практике</a></div></div>';return}const c=queue[0],s=S.cards[c.id];h.innerHTML=`<div class="solo col"><div class="card flip"><span class="meta">Тема ${c.m} · ${s?'пауза '+INT[Math.max(0,s.b-1)]+' дн.':'новая'} · осталось ${queue.length}</span><p class="q">${esc(c.q)}</p>${open_?`<p class="a">${esc(c.a)}</p><div class="rowb"><button class="btn" id="cn">Не помню</button><button class="btn pri" id="cy">Помню</button></div>`:`<p class="meta">Сначала произнеси ответ вслух. Усилие вспомнить и закрепляет знание.</p><div class="rowb"><button class="btn pri" id="co">Показать ответ</button></div>`}</div></div>`;if(open_){$('cn').onclick=e=>grade(false,e.target);$('cy').onclick=e=>grade(true,e.target)}else $('co').onclick=()=>{open_=true;showC()}}
function grade(ok,b){const c=queue.shift(),s=S.cards[c.id]||{b:0};if(ok){s.b=Math.min(s.b+1,6);s.d=Date.now()+INT[s.b-1]*DAY}else{s.b=1;s.d=Date.now()+DAY;queue.push(c)}S.cards[c.id]=s;if(ok)award(2,b);else save();open_=false;showC()}
/* лента дня */
function openDen(){shell({t:'Лента дня',back:'igra',acc:C_GM[0],accb:C_GM[1]});RUN={k:'d'};$('pv').style.visibility='hidden';const t=dayStr(),n=Math.floor(new Date(t).getTime()/DAY),r=RH[n%RH.length],q=rhQ(r);const ks='q'+t;if(S.daily[ks]){const o=S.daily[ks];q.o=o.map(nm=>{const x=RH.find(y=>y.n===nm);return[nm,x===r?'Смотри на подсвеченный участок: '+r.sign+'.':'здесь было бы так: '+x.sign+'.']});q.a=o.indexOf(r.n)}else{S.daily[ks]=q.o.map(x=>x[0]);save()}const h=body(1);setBar(1,1);$('nx').hidden=true;askQ(h,q,{saved:S.daily[t],pre:'<span class="tag">Завтра будет новая</span>',done:(x,ok,b)=>{S.daily[t]=x;award(ok?10:3,b)}})}
